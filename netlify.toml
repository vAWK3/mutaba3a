[build]
  publish = "dist-web"
  # MUT-150 (TD-084): the bundle guard runs on every Netlify build
  command = "npm run build:web && npx tsx scripts/check-bundles.ts --dist dist-web"

# MUT-382: MTB3A runs on iOS, Android and the web portal only; the free desktop apps' download page and
# installer links are gone. Old links land on the home page. Before the fallback.
[[redirects]]
  from = "/download"
  to = "/"
  status = 301

[[redirects]]
  from = "/download/*"
  to = "/"
  status = 301

# MUT-445: the free web app at /app is retired (MTB3A runs on iOS, Android and the web portal only).
# Old links and home-screen icons land on the home page; public/sw.js removes the old service worker.
[[redirects]]
  from = "/app"
  to = "/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/"
  status = 301

# /hosted (the free-vs-hosted comparison) is retired: hosted is the only plan now,
# and its request form lives inline on the home page. Before the fallback.
[[redirects]]
  from = "/hosted"
  to = "/"
  status = 301

# SPA fallback - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Web release standard (MUT-551) WX-4: the basic security headers on every page of the website. No CSP yet (the
# landing loads PostHog, Sentry and Turnstile; a report-only CSP first is its own ticket), and never
# a cross-origin opener header (MUT-291, netlify-no-coop.test.ts). Netlify adds HSTS itself.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
