app: portal
area: signin
title: Portal sign-in
tier: core
paths:
  - src/hosted/pages/auth/**
  - src/hosted/hosted.css
  - src/hosted/components/Brand.tsx
  - hosted.html
  - src/styles/**
  - src/assets/fonts/**
features:
  - id: type
    title: Sign-in is Thmanyah Sans with a Serif Display 700 heading, in English and Arabic, and loads no font from another origin (MUT-102)
    tier: core
    legacy: [MUT-102]
    steps:
      - Stub /v1 to 401 and open /sign-in, in English then Arabic
    expect:
      - The body computes Thmanyah Sans and the heading Thmanyah Serif Display 700
      - Every font and stylesheet request is same-origin
  - id: contrast
    title: Sign-in passes axe in light and dark, colour contrast included
    tier: core
    steps:
      - Open /sign-in in light mode, then in dark mode
    expect:
      - No axe violation, colour-contrast included
  - id: brand-chrome
    title: Sign-in leads with the Brand v2 mark + name lockup, and the tab icons are the bundled hashed copies (MUT-104)
    tier: secondary
    legacy: [MUT-104]
    steps:
      - Stub /v1 to 401 and open /sign-in, under OS light then OS dark
    expect:
      - The Wordmark shows the mark (mark-dark.svg on the dark canvas) beside the product name
      - Every icon link in the head points at /assets/*, and each returns 200
  - id: request-link
    title: Sign-in offers one outward "No account? Request one" link to the landing's /hosted page, in English and Arabic (MUT-188)
    tier: core
    steps:
      - Stub /v1 to 401 and open /sign-in, in English then Arabic
    expect:
      - A link named from the portal dictionary (hosted.auth.request.link) is visible under the help line, with an https href ending in /hosted
      - It is the only link on the page, and it opens in the same tab
      - The page still passes axe
  - id: arabic-default
    title: In an English browser where nobody chose a language, the portal's sign-in opens in Arabic, and a language chosen there sticks (MUT-209)
    tier: secondary
    legacy: [MUT-209]
    paths:
      - src/hosted/i18n/HostedLanguageProvider.tsx
    steps:
      - With an English browser and nothing chosen, open the portal's sign-in, press EN, reload
    expect:
      - The sign-in is in Arabic, right to left, and nothing is stored
      - EN switches to English, is stored, and stays after a reload
  - id: boot-slow-session
    title: While /v1/me is slow the portal shows the mark, which blooms in place saying "Checking your session", then "Still connecting…" from 3 s, then sign-in; reduced motion writes the words under a still mark; no wordmark text and no CSP violation (MUT-206, MUT-207 D4)
    tier: core
    paths:
      - src/components/brand/BrandLoader.tsx
      - src/components/brand/BrandLoader.css
      - src/components/brand/bloomLoaderData.ts
      - src/components/brand/bootDelay.ts
      - src/hosted/pages/auth/BootScreens.tsx
      - src/hosted/session/me.tsx
    steps:
      - Hold /v1/me for 4 s, then answer 401, and open the portal in English
      - Again with reduced motion on
    expect:
      - The mark shows at once and no MTB3A logotype appears
      - The mark blooms in place, with no fade, and a status says "Checking your session"
      - From 3 s the status says "Still connecting…"
      - Sign-in shows once /v1/me answers
      - Under reduced motion no part of the mark moves, and the words are written under it
      - The console reports no Content Security Policy violation
  - id: boot-splash
    title: Before any JavaScript the portal shows the 80 px mark centred on the canvas, React takes over without moving it, and the boot screen passes axe in light and dark (MUT-207)
    tier: core
    paths:
      - hosted.html
      - src/styles/brand/boot-splash.css
      - src/hosted/pages/auth/BootScreens.tsx
    steps:
      - With scripts off, under OS light then OS dark, open the portal
      - With scripts on and /v1/me held 3 s, open the portal and wait for React's boot screen
      - With /v1/me held, run axe on the boot screen in light and in dark
    expect:
      - The splash's background is the token canvas for the scheme; the mark is loaded, 80 px and centred (±1 px)
      - Once React mounts, the mark (or the loader in its place) has the same centre and size (±1 px), then says "Checking your session"
      - No CSP violation, and no axe violation beyond the known landmark rule
