app: portal
area: guides
title: Guides, opened in a drawer over the page (MUT-672)
tier: secondary
# MUT-674: the viewer and its one content format (src/content/guides/<id>.json). MUT-679: the Tax Authority guide opens
# from the button beside Connect on the invoicing setup's step 5 and from the allocation panel on the issue screen.
paths:
  - src/content/guides/guideSchema.ts
  - src/content/guides/index.ts
  - src/content/guides/types.ts
  - src/content/guides/tax-authority.json
  - src/hosted/components/GuideDrawer.tsx
  - src/hosted/components/GuideButton.tsx
features:
  - id: guide-open-read-close
    title: The Tax Authority guide opens from Connect, reads in Arabic then English, and closing it leaves the page as it was
    tier: secondary
    tickets: [MUT-674, MUT-679]
    steps:
      - Open Invoicing in Arabic and choose step 5, the Tax Authority
      - Press the guide button beside Connect
      - Read it in Arabic, right to left
      - Close it with the cross
      - Press the button again and Escape
      - Open it in English from the same button and read it
      - Press Done
    expect:
      - The guide is a drawer over Invoicing, named by its title, with the lead, four numbered steps each with a drawing, the note, what to do if it goes wrong and the Tax Authority's page
      - In Arabic it reads right to left and the drawings are the Arabic ones
      - Closing it with the cross leaves step 5 exactly as it was, with Connect still there
      - Escape closes it and focus is back on the button that opened it
      - In English it reads the same four steps; Done closes it and step 5 is as it was
  - id: guide-over-issue-drawer
    title: The guide opens over the issue drawer from the allocation panel, and closing it returns to the invoice as it was
    tier: secondary
    tickets: [MUT-679]
    paths:
      - src/hosted/components/ManualAllocationPanel.tsx
      - src/hosted/components/IssueDocumentDrawer.tsx
    steps:
      - Open Issue a document, choose Client 1 and a line of 6,000, and type the allocation number
      - Press How to connect in the panel
      - Close the guide
    expect:
      - The panel offers How to connect only where the person can connect, and the guide opens over the invoice, which stays open behind it
      - Closing the guide returns to the invoice with the client, the line and the typed allocation number as they were
  - id: invoice-from-issued-and-setup
    title: The invoice guide opens from the empty Issued list and from the ready invoicing setup, in Arabic then English
    tier: secondary
    tickets: [MUT-785]
    paths:
      - src/content/guides/issue-first-invoice.json
      - src/hosted/pages/views/IssuedDocuments.tsx
      - src/hosted/pages/invoicing/InvoicingSetupPage.tsx
    steps:
      - Open Documents, Issued, in Arabic: nothing is issued yet
      - Press the guide button and read it in Arabic, right to left
      - Close it with the cross
      - Open the ready invoicing setup in English and press the guide button there
      - Press Done
    expect:
      - The empty list offers How to issue; the guide is a drawer over it with four numbered steps each with a drawing, the note and what to do if it goes wrong
      - In Arabic it reads right to left and the drawings are the Arabic ones, except the direction-neutral second step
      - Closing it leaves the empty list as it was
      - The ready setup offers the same guide in English, and Done closes it with the setup as it was
  - id: accountant-from-sharing
    title: The accountant guide opens from the Sharing page, in Arabic then English
    tier: secondary
    tickets: [MUT-786]
    paths:
      - src/content/guides/accountant-access.json
      - src/hosted/pages/sharing/SharingPage.tsx
      - src/hosted/pages/sharing/AccountantsColumn.tsx
    steps:
      - Open Sharing in Arabic on a profile shared with nobody
      - Press the guide button and read it in Arabic
      - Close it with the cross
      - Open Sharing in English with an accountant and press the guide button in the Accountants column
      - Press Done
    expect:
      - The empty Sharing page offers How to invite beside Invite by email; the guide is a drawer with three numbered steps and the note
      - What the accountant sees is the Sharing page's own wording, in Arabic and in English
      - Closing it leaves the page as it was; with an accountant listed, the Accountants column offers the same guide
  - id: tax-guide-ended-state
    title: The Tax Authority guide opens beside Connect again when the connection has ended
    tier: secondary
    tickets: [MUT-679]
    paths:
      - src/hosted/pages/invoicing/InvoicingSteps.tsx
    steps:
      - Open Invoicing and choose step 5 with a connection that has ended
      - Press How to connect beside Connect: the guide opens, and closing it leaves step 5 as it was
    expect:
      - Step 5 says the connection has ended and offers Connect and How to connect together
      - The guide opens over it and closing it returns to step 5 unchanged
