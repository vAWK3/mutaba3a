app: portal
area: expenses
title: Expenses in the portal
tier: secondary
paths:
  - src/hosted/pages/views/ExpensesList.tsx
  - src/hosted/components/ExpenseDrawer.tsx
  - src/hosted/components/expenseApiErrors.ts
  - src/hosted/components/ClientPicker.tsx
  - src/hosted/components/ProjectPicker.tsx
  - src/hosted/components/Drawer.tsx
  - src/hosted/components/SavedNotice.tsx
  - src/hosted/data/expenseQueries.ts
  - src/hosted/data/anchoredList.ts
  - src/hosted/data/attemptKey.ts
  - src/hosted/format/currencies.ts
features:
  - id: vendor-typeahead
    title: The vendor field suggests the profile's saved vendors; a new one is kept as typed, and picking one prefills its last category (MUT-254)
    tier: secondary
    tickets: [MUT-254]
    paths:
      - src/hosted/components/VendorPicker.tsx
    steps:
      - Record an expense at a new vendor, Yellow Cab, under Travel
      - Record another and type "yel" in Vendor
      - Pick Yellow Cab from the suggestions and save
    expect:
      - Typing a new vendor offers "New vendor" and Enter keeps the text as typed
      - GET /v1/vendors is asked with q=yel and suggests Yellow Cab
      - Picking it fills Vendor and prefills Category with Travel
      - POST /v1/expenses gets vendor Yellow Cab and the Travel category
  - id: create
    title: Record an expense; the drawer says what is missing, takes a currency's own decimals (JOD 3), and the expense is listed and filterable
    tier: secondary
    steps:
      - Open Expenses and choose Record expense
      - Save it empty, then with 12.345 in USD
      - Switch to JOD, add a title, vendor and client, and save
      - Filter by another category, then Clear filters
    expect:
      - The date defaults to today in the profile's zone; empty Save shows "Enter a valid amount" and "Required"; 12.345 is refused in USD
      - POST /v1/expenses gets the JOD expense with an Idempotency-Key
      - The row shows its category, client and amount, and "Saved" is announced
      - The category filter sends categoryId and says "Nothing matches these filters." until cleared
  - id: create-with-receipt
    title: Record an expense with receipts; they upload once it is saved, and one that fails stays on the new expense to try again (MUT-491)
    tier: secondary
    tickets: [MUT-491]
    paths:
      - src/hosted/components/ReceiptPickButton.tsx
      - src/hosted/components/ReceiptUploader.tsx
      - src/hosted/data/receiptUpload.ts
      - src/hosted/data/receiptQueries.ts
    steps:
      - Open Expenses and choose Record expense
      - Add a text file as a receipt, then a PDF and a JPEG
      - Remove the JPEG and save
      - Record another expense with a receipt whose upload fails, then upload it again
      - Record a third expense, pick 11 receipts, then cancel
    expect:
      - The text file is refused with "Receipts must be a PDF, JPEG or PNG file." and nothing is sent
      - The picked files are listed with Remove and "They're added when you save."
      - POST /v1/expenses is sent once, then the PDF is started on the new expense, PUT to the bucket and completed; the drawer closes and the row is Saved
      - Reopening the expense lists the PDF under Receipts
      - A failed upload leaves the drawer open on the new expense at ?expense=<id> with "Couldn't upload the receipt. Try again." on that file; Upload again lands it
      - 'Of 11 picked, 10 are listed, "An expense holds at most 10 receipts. Not added: r11.pdf." is shown and Add receipt is disabled; Cancel sends no receipt'
  - id: create-with-receipt-arabic
    title: In Arabic the new-expense drawer's receipts read right to left, with Arabic copy and a Latin filename kept in its own order (MUT-491)
    tier: secondary
    tickets: [MUT-491]
    paths:
      - src/hosted/components/ReceiptPickButton.tsx
    steps:
      - Open Expenses in Arabic and choose تسجيل مصروف
      - Add a text file as a receipt, then taxi-receipt.pdf
    expect:
      - The page is right to left and the drawer shows الإيصالات with إضافة إيصال
      - The text file is refused with "يجب أن يكون الإيصال بصيغة PDF أو JPEG أو PNG."
      - taxi-receipt.pdf is listed in its own <bdi> with إزالة and "تُضاف عند الحفظ.", and nothing is sent
  - id: edit-receipts
    title: Edit an expense; attach a receipt (start, PUT to the signed bucket, complete), download and remove it, and save a change with If-Match
    tier: secondary
    paths:
      - src/hosted/components/ReceiptUploader.tsx
      - src/hosted/data/download.ts
    steps:
      - Open an expense from the list
      - Attach a text file, then a PDF
      - Download the receipt, then delete it
      - Change the title and save
    expect:
      - The drawer opens filled in at ?expense=<id>
      - The text file is refused with "Receipts must be a PDF, JPEG or PNG file." and nothing is sent
      - The PDF is started, PUT to the storage bucket and completed, then listed
      - Download hands the signed link to the browser as a download; Delete removes it
      - PATCH carries If-Match 1 and the new title, which the list shows
  - id: delete
    title: Delete an expense after confirming in place; a refused stale save keeps the drawer open with a message (MUT-417)
    paths:
      - src/hosted/components/InPlaceConfirm.tsx
    tier: secondary
    steps:
      - Open an expense and save a change the server refuses as stale
      - Choose Delete, then Cancel; choose Delete again and confirm
    expect:
      - '"This expense changed elsewhere" is shown and the drawer stays open'
      - The footer turns into a confirm naming the expense ("Delete “Client lunch” (…80.00)? This can't be undone."), Cancel focused, no browser prompt; Cancel sends nothing and focus returns to Delete
      - Confirming sends DELETE, the drawer closes and the row is gone
  - id: saved-show
    title: An expense saved outside the current filter is announced with Show, which starts the list at it; a gone anchor drops itself (MUT-91)
    tier: secondary
    paths:
      - src/hosted/components/SavedNotice.tsx
      - src/hosted/data/anchoredList.ts
    steps:
      - Open Expenses filtered to Travel and record an Office supplies expense
      - Choose Show, then Show latest
      - Open an old link anchored on an expense that no longer exists
    expect:
      - '"Expense saved" with Show appears because the filtered list cannot show it'
      - Show puts anchor=<id> in the URL, sends it to the server, focuses "Showing from a saved entry" and lists the expense; Show latest removes it
      - The stale anchor is dropped and the plain list shows
  - id: edit-conflict
    title: An expense changed on another device is refused on Save, the drawer then shows the latest version, and saving again works
    tier: secondary
    steps:
      - Open an expense; meanwhile it is changed elsewhere
      - Change the title and save, then save again
    expect:
      - The first save is refused and the drawer shows the latest amount
      - The second save goes through with If-Match of the latest version
  - id: redate-expense
    title: An expense's date is changed in the edit drawer, sent with If-Match, and the list shows the new day (MUT-224 regression)
    tier: secondary
    steps:
      - Open Expenses and choose the expense
      - Change only its date and save
    expect:
      - PATCH /v1/expenses/<id> carries the new occurredOn with If-Match 1
      - The row shows the new day
  - id: expense-category-client-matter
    title: An expense saved with a category, a client and a matter (as the phone sends it) shows all three in the portal's drawer (MUT-384)
    tier: secondary
    tickets: [MUT-384]
    paths:
      - src/hosted/components/ExpenseDrawer.tsx
      - src/hosted/components/ClientPicker.tsx
      - src/hosted/components/ProjectPicker.tsx
      - src/hosted/components/useMatterCascade.ts
    steps:
      - On a firm's business profile, open Expenses and choose an expense that has a category, a client and a matter
    expect:
      - The expense's drawer shows its category, its client and its matter
  - id: categories-follow-language
    title: A seeded expense category is named in the portal's language, and switching the language renames it (MUT-464)
    tier: secondary
    tickets: [MUT-464]
    paths:
      - src/hosted/api/client.ts
      - src/hosted/i18n/HostedLanguageProvider.tsx
      - src/hosted/data/expenseQueries.ts
      - src/hosted/data/reportQueries.ts
    steps:
      - Open Expenses in Arabic on a profile whose rent expense is under the seeded Office Rent category
      - Switch to English on You › App and go back to Expenses
    expect:
      - In Arabic the row names its category إيجار المكتب, and GET /v1/expense-categories was sent Accept-Language ar
      - After the switch the categories are fetched again with Accept-Language en and the row says Office Rent
  - id: renamed-category-keeps-name
    title: A category a person named or renamed keeps that name in both languages (MUT-464)
    tier: secondary
    tickets: [MUT-464]
    paths:
      - src/hosted/data/expenseQueries.ts
    steps:
      - Open Expenses in English on a profile with a seeded Office Rent and a named Studio rent category
      - Switch to Arabic on You › App and go back to Expenses
    expect:
      - In English the rows say Office Rent and Studio rent
      - In Arabic the seeded one says إيجار المكتب and the named one still says Studio rent
  - id: date-too-far
    title: An expense may be dated ahead up to ten years; a date the server refuses as more than ten years ahead is said at the date field (MUT-392)
    tier: secondary
    paths:
      - src/hosted/components/ExpenseDrawer.tsx
      - src/hosted/components/expenseApiErrors.ts
      - src/components/expenses/ExpenseFormFields.tsx
      - src/hosted/format/dates.ts
    steps:
      - Open Expenses and choose Record expense
      - Type 40, pick Office supplies, set the date 3 days ahead and save
      - Record another dated 2040-01-01 while the server refuses it as more than ten years ahead
    expect:
      - The date field's max is ten years after today
      - POST /v1/expenses gets the date 3 days ahead and the drawer closes
      - The refused one shows "The date can't be more than ten years ahead" under the date and the drawer stays open
  - id: save-feedback-animation
    title: A successful expense save shows the animated save-feedback icon in SavedNotice (MUT-338)
    tier: tertiary
    legacy: [MUT-338]
    paths:
      - src/components/icons/SaveFeedbackIcon.tsx
      - src/lib/motion/saveFeedbackPreset.ts
    steps:
      - Open Expenses and add a new expense
      - Save it
    expect:
      - The saved-flash notice includes the animated save-feedback icon
      - On a profile with firm features on, the icon grows in without overshooting (restrained)
  - id: save-feedback-business-playful
    title: On a business profile without firm features, a saved expense's icon still plays the playful pop (MUT-338)
    tier: tertiary
    legacy: [MUT-338]
    paths:
      - src/lib/motion/saveFeedbackPreset.ts
    steps:
      - On a business profile whose firm features are off, open Expenses and add a new expense
      - Save it
    expect:
      - The saved-flash notice's icon overshoots past full size, then settles (playful)
  - id: save-feedback-personal
    title: On a personal profile, a saved expense's icon plays the playful pop (MUT-338)
    tier: tertiary
    legacy: [MUT-338]
    paths:
      - src/components/icons/SaveFeedbackIcon.tsx
      - src/lib/motion/saveFeedbackPreset.ts
      - src/lib/motion/iconMotion.ts
    steps:
      - On a personal profile, open Expenses and add a new expense
      - Save it
    expect:
      - The saved-flash notice's icon overshoots past full size, then settles (playful)
  - id: save-feedback-reduced-motion
    title: With Reduce Motion on, the save-feedback icon shows settled with no pop (MUT-338)
    tier: tertiary
    legacy: [MUT-338]
    paths:
      - src/components/icons/SaveFeedbackIcon.tsx
      - src/lib/motion/iconMotion.ts
      - src/lib/motion/mediaQuery.ts
    steps:
      - Turn on Reduce Motion
      - On a personal profile, open Expenses and save a new expense
    expect:
      - The saved-flash notice's icon is full size from its first frame and never moves
  - id: vat
    title: A firm records an expense with VAT; the row previews net and VAT, the server stores the split, and reopening reads it (MUT-302)
    tier: secondary
    tickets: [MUT-302]
    paths:
      - src/hosted/components/expenseForm/ExpenseVatRow.tsx
      - src/hosted/components/expenseForm/HostedExpenseFields.tsx
      - src/hosted/components/expenseForm/useHostedExpenseForm.ts
      - src/hosted/lib/expenseVat.ts
      - server/src/expenses/vat.ts
    steps:
      - On a firm profile, open an expense saved before VAT existed
      - Record an expense of 117 and open VAT
      - Choose Standard and type 17, then save
      - Reopen the expense
    expect:
      - The old expense's VAT row reads "No VAT recorded" (MUT-302 AC2)
      - Closed, the row reads "No VAT recorded"; open, it shows net 100.00 and VAT 17.00
      - POST /v1/expenses gets vat with STANDARD_RATED and 1700 basis points, never net or VAT
      - Reopened, the row reads "VAT 17%" with 17.00, and net 100.00 when opened
  - id: vat-none-personal
    title: A profile without firm features has no VAT row, and its expenses send no VAT (MUT-302 AC3)
    tier: secondary
    tickets: [MUT-302]
    paths:
      - src/hosted/components/expenseForm/HostedExpenseFields.tsx
    steps:
      - On a profile without firm features, open Record expense
      - Record an expense
    expect:
      - There is no VAT row on the form
      - POST /v1/expenses has no vat
