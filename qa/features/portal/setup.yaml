app: portal
area: setup
title: Set your password from a setup link
tier: core
paths:
  - src/hosted/pages/auth/SetupPage.tsx
  - src/hosted/pages/auth/setupLink.ts
features:
  - id: set-password
    title: A valid setup link opens in the account's language with the fragment gone from the address bar; setting a password signs the person in and lands on Home, in English and Arabic (MUT-236)
    tier: core
    legacy: [MUT-236]
    paths:
      - src/hosted/router.tsx
      - src/hosted/api/client.ts
      - src/hosted/i18n/HostedLanguageProvider.tsx
    steps:
      - With no language chosen in the browser, open a valid setup link for an English account
      - Type a password of 12 or more characters and press Save and sign in
      - Again for an Arabic account
    expect:
      - The page is in the account's language (Arabic right to left), and the address bar shows /setup with no #
      - The email shows read-only above the new-password field
      - Saving sends the token and the password, then signs in with that email and password
      - The person lands on the first profile's Overview
  - id: refused-links
    title: An expired, used, superseded, unknown or incomplete setup link says so in its own words, in English and Arabic, and shows no password form (MUT-236)
    tier: core
    legacy: [MUT-236]
    steps:
      - Open an expired, a used, a superseded and an unknown setup link, then one with no token after the #
      - Open an expired link in Arabic
    expect:
      - Each shows its own heading and no password field
      - The used link offers Go to sign in
      - The Arabic page reads right to left
  - id: password-rule
    title: A password shorter than 12 characters is refused under the field before anything is sent (MUT-236)
    tier: secondary
    legacy: [MUT-236]
    steps:
      - Open a valid setup link, type an 11-character password and press Save and sign in
    expect:
      - The field says "Use at least 12 characters." and nothing is sent to the server
  - id: answer-lost
    title: When a save gets no answer but went through, the retry signs the person in instead of calling the link used (TD-149, MUT-236 D3)
    tier: secondary
    legacy: [MUT-236, TD-149]
    paths:
      - src/hosted/session/SessionBridge.tsx
    steps:
      - Open a valid setup link and press Save and sign in while the connection drops
      - Press Save and sign in again
    expect:
      - The first try says MTB3A couldn't be reached and keeps the typed password
      - The second try lands on the first profile's Overview, signed in with the typed password
  - id: claim-code
    title: An accountant's customer opens their link to who set it up and for which business, enters the six-digit code (tries left on a wrong one), sets the password with the code, sees the account is theirs, then the card step on the business (MUT-769)
    tier: core
    legacy: [MUT-769, MUT-765]
    paths:
      - src/hosted/pages/auth/ClaimCodeStep.tsx
      - src/hosted/pages/auth/claimStep.ts
      - src/hosted/components/PinBoxes.tsx
      - src/hosted/components/HandoverClaimedMotion.tsx
    steps:
      - Open the link an accountant's customer was mailed
      - Type a wrong code and press Verify
      - Type the code the accountant said and press Verify
      - Set a password and press Save and sign in
      - Press Continue
      - Again in Arabic, at 375 px
    expect:
      - The context line names the accountant and the business beside the welcome scene; step 1 of 3; the heading has focus
      - Six boxes read left to right, each named "Digit n of 6"; the step passes axe
      - A wrong code says "Wrong code. 4 tries left." and empties the boxes
      - The right code opens the password step (step 2 of 3) under the same context line, and the redeem carries the code
      - '"The account is yours" shows the hand-over moment, and Continue opens Subscribe on the business profile'
      - In Arabic the page reads right to left and the code boxes left to right, with no sideways scroll at 375 px
  - id: claim-refused
    title: A locked claim code or a dead accountant's link says to ask the accountant and offers no self-service link (MUT-769, B7)
    tier: secondary
    legacy: [MUT-769, MUT-765]
    paths:
      - src/hosted/pages/auth/ClaimCodeStep.tsx
    steps:
      - Type a fifth wrong code
      - Open a link whose code is already locked
      - Open an expired accountant's link
    expect:
      - '"Too many tries" with the code-locked scene and "Ask your accountant for a new code."'
      - The already-locked link opens on the same screen
      - '"This link is no longer valid" with the link-expired scene, "Ask your accountant for a new one.", no Send a new link and no password field'
