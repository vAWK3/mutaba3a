app: portal
area: terms
title: Accepting the terms of service on the portal
tier: core
paths:
  - src/hosted/pages/auth/TermsUpdatePage.tsx
  - src/hosted/terms.ts
features:
  - id: setup-requires-accept
    title: A setup link can't be finished without ticking "I agree to the terms of service"; the tick links the exact version and the save records it (MUT-324)
    tier: core
    legacy: [MUT-324]
    paths:
      - src/hosted/pages/auth/SetupPage.tsx
      - src/hosted/pages/auth/setupLink.ts
    steps:
      - Open a valid setup link, type a password and press Save and sign in without ticking the terms
      - Tick "I agree to the terms of service" and save again
    expect:
      - Without the tick the page asks to agree and sends nothing
      - The terms link opens the version being accepted, in the page language (?lang), in a new tab
      - Saving sends that version, the page language and the web release that showed it (MUT-354), and the person lands signed in on Overview
  - id: language-switch-clears-tick
    title: Switching the setup page's language clears the terms tick, so the agreement follows a read in the language recorded (MUT-324 review pass 2)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/hosted/pages/auth/SetupPage.tsx
    steps:
      - Open a valid setup link in English, type a password and tick the terms
      - Switch the page to Arabic
      - Tick again and save
    expect:
      - The switch clears the tick and the terms link opens the Arabic text
      - Saving records Arabic and lands signed in
  - id: updated-terms-step
    title: A signed-in person behind on the terms sees the Updated-terms step before the portal, agrees once, and is not asked again (MUT-324)
    tier: core
    legacy: [MUT-324]
    paths:
      - src/hosted/session/AuthGate.tsx
      - src/hosted/api/client.ts
    steps:
      - Open the portal signed in as someone who accepted an older version of the terms
      - Press I agree
      - Reload the page
    expect:
      - The step shows before any navigation, with Read the terms (that version, ?lang in the page language), I agree, Sign out and the support email
      - Agreeing records the version in the page language with the web release that showed it (MUT-354), and opens Overview
      - After reloading, the step doesn't come back
  - id: bumped-mid-session-keeps-draft
    title: Terms that change while the portal is open ask in a dialog above it; an expense half typed in its drawer survives, can't be touched until the person agrees, and saves after (MUT-346)
    tier: core
    paths:
      - src/hosted/session/AuthGate.tsx
      - src/hosted/pages/auth/TermsUpdatePage.tsx
      - src/components/ui/BlockingDialog.tsx
      - src/components/ui/BlockingDialog.css
      - src/components/ui/blockingLayer.ts
    steps:
      - Open Expenses, choose Record expense and type an amount and a title
      - A server release names newer terms, and the portal reads /v1/me again (back to the tab after a minute)
      - Press Escape, Tab around, and try Save behind the dialog
      - Press I agree, then Save
    expect:
      - The Updated-terms step opens as a dialog above the portal; the drawer stays open behind it with what was typed
      - Escape doesn't close the drawer, Tab stays in the dialog, and nothing behind it can be pressed
      - I agree records the newer version; the dialog goes, focus is back in the drawer field, and the draft is intact
      - Save records the expense
  - id: changed-mid-step
    title: If the terms change again while the Updated-terms step is open, I agree says so, the step names the new version, and the retry accepts it (MUT-324 review fix 4)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/hosted/pages/auth/TermsUpdatePage.tsx
    steps:
      - Open the portal behind on the terms
      - A server release names newer terms while the step is open
      - Press I agree, then I agree again
    expect:
      - The first I agree says the terms changed and the link names the new version
      - The second records the new version and opens Overview
  - id: step-sign-out
    title: Sign out on the Updated-terms step signs out without accepting the terms (MUT-324)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/hosted/pages/auth/TermsUpdatePage.tsx
      - src/hosted/session/useSignOut.ts
    steps:
      - Open the portal behind on the terms
      - Press Sign out
    expect:
      - The session ends and the step is gone
      - Nothing is accepted
  - id: links
    title: You › App and the sign-in page link the terms of service (MUT-324)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/hosted/pages/you/YouApp.tsx
      - src/hosted/pages/auth/SignInPage.tsx
    steps:
      - Open You › App while signed in
      - Open the sign-in page
    expect:
      - Both link the terms of service in the page language, in a new tab
