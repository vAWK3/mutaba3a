app: portal
area: income
title: Income capture on an owned profile
tier: secondary
# Add income and Record payment (MUT-133). Not core: only owned profiles write income here.
paths:
  - src/hosted/components/IncomeDrawerHost.tsx
  - src/hosted/components/IncomeCaptureDrawer.tsx
  - src/hosted/components/incomeForm.ts
  - src/hosted/components/incomeApiErrors.ts
  - src/hosted/components/ClientPicker.tsx
  - src/hosted/components/ProjectPicker.tsx
  - src/hosted/components/Drawer.tsx
  - src/hosted/components/Toast.tsx
  - src/hosted/data/incomeAffordances.ts
  - src/hosted/data/incomeQueries.ts
  - src/hosted/data/attemptKey.ts
features:
  - id: add-received
    title: Add income, Received, from Payments sends the canonical amount, client and method with an Idempotency-Key, says Saved, and lists the payment
    tier: secondary
    paths:
      - src/hosted/pages/views/PaymentsList.tsx
    steps:
      - Open Payments and choose + Add income
      - Type 1,200, pick Client 1, open More details and choose Bank transfer
      - Save income
    expect:
      - Received is chosen and the defaults read "ILS · today · cash"
      - POST /v1/income gets {kind received, amount 1200.00, ILS, today, the client, BANK} with an Idempotency-Key
      - The drawer closes, "Saved · ₪1,200.00 received from Client 1" is announced, the payment is listed, and focus returns to + Add income
  - id: add-client
    title: Add income for a client that isn't there yet, with Add client in the picker; a Malafat-fed profile never offers it
    tier: secondary
    paths:
      - src/hosted/data/customerQueries.ts
      - src/hosted/components/ExpenseDrawer.tsx
      - src/hosted/pages/views/ExpensesList.tsx
    steps:
      - On your own profile's Receivables, choose + Add income, Owed, and type a client name nobody has ("Ramallah Bakery")
      - Choose "Add client: Ramallah Bakery", type 900, and save
      - On a Malafat-fed profile, record an expense and type the same name in Client
    expect:
      - The client is created on the server with that name and picked in the drawer; the income goes to the server for that client
      - The entry is listed under Ramallah Bakery
      - On the Malafat-fed profile the client list offers no Add client row
  - id: add-matter
    title: Add income on a matter that isn't there yet; a hint until a client is chosen, then Add matter; a Malafat-fed profile never offers it
    tier: secondary
    paths:
      - src/hosted/data/projectQueries.ts
      - src/hosted/components/ExpenseDrawer.tsx
      - src/hosted/components/usePendingPicks.ts
    steps:
      - On your own profile's Receivables, choose + Add income, Owed, open More details and type a matter nobody has ("Lease dispute") with no client chosen
      - Pick Client 2, then choose "Add matter: Lease dispute"
      - Type 900 and save
      - On a Malafat-fed profile, record an expense, type "Lease" in Matter, then a name no matter has
    expect:
      - With no client, "Choose a client first to add a matter." shows and there is no Add matter row
      - POST /v1/projects gets {customerId of Client 2, Lease dispute, ILS} with an Idempotency-Key, and the matter is picked
      - The income names the new matter, and the entry is listed with it
      - On the Malafat-fed profile there is no Add matter row and no hint
  - id: matter-fills-client
    title: Picking a matter with no client fills the client, each matter names its client, and changing the client empties a matter of another one
    tier: secondary
    paths:
      - src/hosted/components/useMatterCascade.ts
      - src/lib/forms/useClientProjectCascade.ts
    steps:
      - Choose + Add income, Owed, open More details and open Matter with no client chosen
      - Pick Client 2's Retainer
      - Change Client to Client 1
    expect:
      - The two Retainer rows read "Retainer · Client 1" and "Retainer · Client 2"
      - Client fills with Client 2
      - Changing the client to Client 1 empties Matter
  - id: date-too-old
    title: Add income dated more than ten years back is refused at the date field with "can't be more than ten years ago", not "later than today", and keeps the entry
    tier: secondary
    paths:
      - src/hosted/components/incomeApiErrors.ts
      - src/hosted/components/expenseApiErrors.ts
      - src/hosted/components/conversionApiErrors.ts
      - src/hosted/api/client.ts
      - src/hosted/i18n/en.json
      - src/hosted/i18n/ar.json
    steps:
      - Open Payments and choose + Add income
      - Type 1,200, pick Client 1, open More details and set the date to 2001-03-04
      - Save income while the server refuses the date as more than ten years ago (DATE_INVALID, bound past)
    expect:
      - POST /v1/income was sent with occurredOn 2001-03-04
      - The date field says "The date can't be more than ten years ago" and does not say "later than today"
      - The drawer stays open with 1,200 and the date still filled in
  - id: add-owed-future
    title: Add income, Owed, dated 30 days ahead saves with that date; a Received dated tomorrow is refused as later than today without a request (MUT-392)
    tier: secondary
    paths:
      - src/hosted/components/incomeForm.ts
      - src/hosted/components/IncomeCaptureDrawer.tsx
      - src/hosted/format/dates.ts
    steps:
      - Open Payments, choose + Add income (Received), type 1,200, set tomorrow under More details and save
      - Open Receivables, choose + Add income (Owed)
      - Type 750, pick Client 1, set the date 30 days ahead under More details and save
    expect:
      - The date field's max is today for Received and ten years after today for Owed
      - Received with tomorrow shows "The date can't be later than today" and no POST is sent
      - POST /v1/income gets {kind owed, 750.00, the future date, Client 1}, and the drawer closes
  - id: owed-errors
    title: Add income, Owed, says at the field what is missing or wrong, keeps the entry through a refusal or a dropped connection, and a retry reuses the attempt's Idempotency-Key
    tier: secondary
    paths:
      - src/hosted/pages/views/ReceivablesList.tsx
    steps:
      - Open Receivables and choose + Add income
      - Save with nothing filled in, then with $50
      - Fill 750 for Client 1 and save while the server says that client is not on the profile
      - Pick Client 2 and save while the connection drops, then save again
    expect:
      - Owed is chosen; empty Save shows "Enter an amount" and "Owed needs a client"; $50 shows "That amount is in USD; this entry is in ILS"
      - The refusal shows "This client isn't on this profile" under Client
      - The dropped save shows "Couldn't reach the server. Try again." and keeps the values
      - The retry saves once under the same Idempotency-Key as the dropped try (a different one from the refused body), and the entry is open on Receivables with Record payment
  - id: switch-kind
    title: Add income switched from Owed to Received after opening More details still saves, as Received with its method (MUT-408)
    tier: secondary
    steps:
      - Open Receivables and choose + Add income
      - Type 500, pick Client 1, and open More details
      - Switch Kind to Received and choose Bank transfer
      - Save income
    expect:
      - Owed is chosen and More details shows Due date; after the switch it shows Method instead
      - POST /v1/income gets {kind received, amount 500.00, ILS, today, Client 1, BANK} and no Owed-only fields
      - The drawer closes and "Saved · ₪500.00 received from Client 1" is announced
  - id: record-payment
    title: Record payment on an open Owed entry offers what is left, says what a typed amount leaves, refuses more than is left, and shows the entry partly paid
    tier: secondary
    paths:
      - src/hosted/components/RecordPaymentDrawer.tsx
      - src/hosted/pages/views/ReceivablesList.tsx
    steps:
      - Open Receivables and choose Record payment on the entry captured in the portal
      - Type 700, then 200 by bank transfer, and record while the server says less is left now
      - Record again
    expect:
      - Only the captured (ADJUSTMENT) entry offers Record payment; the drawer is titled "Record payment · ₪500.00 left" with 500.00 filled in and "Paid in full"
      - 700 reads "Exceeds what's left" and Record payment is disabled; 200 reads "₪300.00 still owed"
      - The race shows "That's more than what's left now (₪150.00)" and keeps 200
      - POST …/settle gets {200.00, today, BANK}; "Payment recorded · ₪200.00 from Client 1" is announced and the entry is Partly paid with 300.00 left
  - id: from-client
    title: Add income from a client's page starts as Owed with that client filled in
    tier: secondary
    paths:
      - src/hosted/pages/views/ClientDetailPage.tsx
    steps:
      - Open a client and choose + Add income
      - Type 300 and save, then open the Receivables tab
    expect:
      - Owed is chosen and Client shows the client
      - The POST names that client, and the entry is on the client's Receivables
  - id: redate-owed
    title: An Owed entry's date is changed from Receivables; the Date column shows it, its due date stays, and the save carries If-Match (MUT-224)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/components/HostedTable.tsx
      - src/hosted/pages/views/ReceivablesList.tsx
      - src/hosted/data/filters.ts
      - src/hosted/api/client.ts
    steps:
      - Open Receivables and open the Owed entry from its row
      - Pick a date last month and save
    expect:
      - The drawer opens at ?income=<id> titled "Change the date", says the due date stays as it is, and nothing but the date is editable
      - PATCH /v1/income/<id> gets {occurredOn} with If-Match 1
      - The drawer closes, ?income is cleared, the row's Date shows the new day and its Due is unchanged
  - id: redate-received
    title: A Received payment's date is changed from Payments by its Received cell, and the list shows the new day (MUT-224)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/pages/views/PaymentsList.tsx
    steps:
      - Open Payments and open the payment from its Received date
      - Pick an earlier day and save
    expect:
      - The drawer opens at ?payment=<id> titled "Change the received date"
      - PATCH /v1/payments/<id> gets {receivedOn} with If-Match 1
      - The row's Received shows the new day
  - id: redate-payment
    title: A settled entry lists its payment; opening that payment and changing its date updates the entry's payment line (MUT-224)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/components/RecordPaymentDrawer.tsx
    steps:
      - Record payment in full on the Owed entry
      - Open the entry (Settled), then open its payment line
      - Pick an earlier day and save, then open the entry again
    expect:
      - The settled entry's drawer lists "<date> · <amount>" for its payment
      - The payment line opens ?payment=<id>, and PATCH /v1/payments/<id> gets the new receivedOn
      - The entry's drawer now lists the payment with the new date
  - id: redate-no-future
    title: A payment's date picker stops at the profile's today, and a later date typed in is refused at the field without a request (MUT-224; MUT-392 keeps payments past-only)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
    steps:
      - Open a Received payment
      - Type tomorrow's date and save
    expect:
      - The date field's max is today in the profile's timezone
      - The message "The date can't be later than today" shows under the date and no PATCH is sent
  - id: redate-owed-future
    title: An Owed entry moves to a day after its due date; the drawer says the due date moves to the 15th of the next month, and a day past ten years ahead is refused at the field (MUT-392)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/components/incomeApiErrors.ts
      - src/hosted/format/dates.ts
    steps:
      - Open the Owed entry (due Nov 15, 2026)
      - Type a day more than ten years ahead and save
      - Type 2026-12-01 and save
    expect:
      - The date field's max is ten years after today
      - The far day shows "The date can't be more than ten years ahead" with no PATCH
      - On 2026-12-01 the drawer says "Due Jan 15, 2027 — moves with the new date", and PATCH /v1/income/<id> gets {occurredOn 2026-12-01}
  - id: redate-conflict
    title: A date changed on another device is refused on Save; the drawer refills with the latest date and saving again works (MUT-224)
    tier: secondary
    paths:
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/components/incomeApiErrors.ts
    steps:
      - Open an Owed entry; meanwhile it is re-dated elsewhere
      - Pick a day and save, then save again
    expect:
      - The first save is refused with "This changed elsewhere…" and the date field shows the other device's day
      - The second save goes through with If-Match 2
  - id: currency-jod
    title: Add income in JOD from Receivables; it saves at 3 decimals, shows JOD, and the currency filter finds it (MUT-388)
    tier: secondary
    paths:
      - src/hosted/components/FilterControls.tsx
      - src/hosted/format/currencies.ts
      - src/hosted/data/filters.ts
    steps:
      - Open Receivables and choose + Add income
      - Open More details, check the Currency list, choose JOD, type 1,250.505, and pick Client 1
      - Save income
      - Filter the list by JOD, then by a different currency
    expect:
      - The Currency list offers USD, ILS, EUR and JOD only
      - POST /v1/income sends currency JOD with the canonical amount 1250.505
      - The row shows 1,250.505
      - Filtering by JOD keeps the row; filtering by USD hides it
  - id: redate-malafat-readonly
    title: A Malafat-fed profile offers no date change on Receivables or Payments, even from a deep link (MUT-224)
    tier: secondary
    paths:
      - src/hosted/data/incomeAffordances.ts
    steps:
      - Open the Malafat-fed firm's Receivables at ?income=<id>
      - Open its Payments at ?payment=<id>
    expect:
      - No row is clickable and no drawer opens on either list
  - id: save-feedback-animation
    title: A successful income save shows the animated save-feedback icon in its toast (MUT-338)
    tier: tertiary
    legacy: [MUT-338]
    paths:
      - src/components/icons/SaveFeedbackIcon.tsx
      - src/lib/motion/saveFeedbackPreset.ts
    steps:
      - Open Payments and choose + Add income
      - Save a received income entry
    expect:
      - The saved toast includes the animated save-feedback icon
  - id: reverse-payment
    title: A payment recorded on the wrong job is reversed with a reason; the entry it paid is owed again and the payment shows why (MUT-453)
    tier: secondary
    paths:
      - src/hosted/components/CorrectionPane.tsx
      - src/hosted/components/RedateDrawer.tsx
      - src/hosted/pages/views/PaymentsList.tsx
    steps:
      - Record payment in full on an Owed entry
      - Open that payment from Payments and choose Reverse payment
      - Give the reason "Applied to the wrong job" and confirm
    expect:
      - POST /v1/payments/<id>/reverse gets {reason} with an Idempotency-Key
      - The toast says Payment reversed and the payment reads Reversed
      - Opening it again shows "Reversed on <date> · Applied to the wrong job" and no Reverse button
      - The Owed entry is back among the open ones
  - id: credit-owed
    title: Reduce amount owed by part of what is left, with a reason; what is left drops and the credit is listed (MUT-453)
    tier: secondary
    paths:
      - src/hosted/components/CorrectionPane.tsx
      - src/hosted/pages/views/ReceivablesList.tsx
    steps:
      - Open an open Owed entry of 500 from Receivables and choose Reduce amount owed
      - Type 200 and the reason "Agreed a lower fee", then Reduce
    expect:
      - The drawer says "₪300.00 left after this" before saving
      - POST /v1/receivables/<id>/credits gets {amount 200.00, reason} with an Idempotency-Key
      - The entry shows 300.00 outstanding, and its drawer lists the credit with its reason
  - id: credit-over-outstanding
    title: Reducing by more than is left is refused at the field without a request; if the server has less left, its figure is shown (MUT-453)
    tier: secondary
    paths:
      - src/hosted/components/CorrectionPane.tsx
      - src/hosted/components/incomeApiErrors.ts
    steps:
      - Open an Owed entry of 500 and choose Reduce amount owed
      - Type 600 with a reason and Reduce
      - Type 200 while the server has only 100 left, and Reduce
    expect:
      - The field says it exceeds what's left, and nothing is sent
      - The server's answer shows "That’s more than what’s left now (₪100.00)" and the drawer stays open
  - id: cancel-owed
    title: Cancel amount owed credits everything left, with a reason; the entry reads Cancelled (MUT-453)
    tier: secondary
    paths:
      - src/hosted/components/CorrectionPane.tsx
      - src/hosted/pages/views/ReceivablesList.tsx
      - src/hosted/data/incomeAffordances.ts
    steps:
      - Open an open Owed entry of 500 and choose Cancel amount owed
      - Give the reason "Client dropped the job" and confirm
    expect:
      - POST /v1/receivables/<id>/credits gets {amount 500.00, reason}
      - The toast says Amount owed cancelled, and among settled entries it reads Cancelled
  - id: correct-malafat-readonly
    title: A Malafat-fed profile offers no correction, even from a deep link (Malafat keeps that ledger) (MUT-453)
    tier: secondary
    paths:
      - src/hosted/data/incomeAffordances.ts
    steps:
      - Open the firm's Payments at ?payment=<id>
      - Open the firm's Receivables at ?income=<id>
    expect:
      - No row opens a drawer and no Reverse, Reduce or Cancel is offered
