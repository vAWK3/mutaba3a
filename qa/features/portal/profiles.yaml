app: portal
area: profiles
title: Hosted profiles
tier: secondary
# New profile and Manage profiles (MUT-183), the shell's drawers, opened from the switcher.
paths:
  - src/hosted/shell/ProfileDrawers.tsx
  - src/hosted/shell/ProfileSwitcher.tsx
  - src/hosted/components/ProfilesManageDrawer.tsx
  - src/hosted/components/ProfileEditForm.tsx
  - src/hosted/components/ProfileTypeCards.tsx
  - src/hosted/components/ProfileBanner.tsx
  - src/hosted/components/profileApiErrors.ts
  - src/hosted/components/profileFormSchema.ts
  - src/hosted/components/Drawer.tsx
  - src/hosted/data/profileQueries.ts
  - src/hosted/data/profileRules.ts
  - src/hosted/format/currencies.ts
  - src/hosted/data/useProfileKind.ts
features:
  - id: edit
    title: Edit a profile's name and currency in Manage profiles; a change made elsewhere first is refused with Reload, which loads the latest
    tier: secondary
    steps:
      - Open Manage profiles from the switcher and choose the open profile
      - Meanwhile it is renamed elsewhere; rename it and change the currency, and save
      - Reload, rename and change the currency again, and save
    expect:
      - The list shows the used count, Open now, each kind, and the Malafat firm locked
      - The pane shows Name, Currency and the time zone, and Save waits for a change
      - The stale save (If-Match 1) shows "This profile was changed elsewhere…" with Reload; Reload shows the name it has now
      - The save sends If-Match 2 with only name and currency; "Profile saved", and the list and switcher show the new name
  - id: type-change
    title: Change a profile's type; the cards say what each seeds, the confirm counts the expenses that lose a category, and the note leads to Expenses
    tier: secondary
    steps:
      - Open a Business profile in Manage profiles and choose Personal
      - Save, go Back, then Save and Switch to Personal
      - Open Expenses from the note
    expect:
      - Both cards show what they seed
      - Save asks the server for the preview first and focuses "Switch to Personal?" with "3 expenses will become uncategorized."; nothing is saved yet
      - Back returns focus to Save; the switch sends PATCH {type PERSONAL} once
      - The list notes "Now Personal. 3 expenses are uncategorized." and Open Expenses goes to that profile's Expenses with the drawer closed
  - id: create
    title: New profile asks for a name and a type, lets the zone be changed, says so at the cap, and opens the new profile
    tier: secondary
    paths:
      - src/hosted/components/ProfileCreateDrawer.tsx
      - src/hosted/format/timezones.ts
    steps:
      - Choose + New profile in the switcher and create it empty
      - Name it Home, Personal, JOD, change the zone to Asia/Amman, and create while the server says the cap is reached
      - Open it again and create
    expect:
      - Empty Create shows "Enter a name" and "Choose Personal or Business"
      - Change reveals and focuses the time zone list
      - The cap refusal shows "You've reached your limit of 6 profiles." and Create profile turns aria-disabled
      - POST /v1/profiles gets exactly the choices with an Idempotency-Key; "Home is ready" and the new profile's Overview opens
  - id: limits
    title: At the cap New profile stays focusable but does nothing and says why; a Malafat-fed profile cannot be edited, even from a link
    tier: secondary
    steps:
      - With six owned profiles, open the switcher and press Enter on New profile
      - Open Manage profiles
      - Open a link to edit the Malafat-fed profile
    expect:
      - New profile is aria-disabled with "You've used 6 of 6 profiles" and opens nothing
      - The Malafat firm's row is not a button and reads "Managed in Malafat. Change it there."; New profile is aria-disabled there too
      - The link shows the profile list, not an edit pane
  - id: firm-request
    title: The owner of a Business profile asks for firm features from its edit pane; it then reads Requested, and a Personal profile never offers it (MUT-300)
    tier: secondary
    paths:
      - src/hosted/components/FirmRequestSection.tsx
    steps:
      - Open Manage profiles and choose a Personal profile you own
      - Go back and choose a Business profile you own
      - Request firm features
      - Reopen the portal and the same profile
    expect:
      - The Personal profile's pane has no firm request
      - The Business profile's pane offers "Use this profile for a firm" with Request firm features
      - POST /v1/profiles/{id}/firm-request goes once with an Idempotency-Key, and the pane reads "Requested on … Firm features show up here once they're turned on." with no button
      - After the reload it still reads Requested
  - id: co-owner-write
    title: A co-owner sees the shared profile named for their partner, owns it fully, and its Owners section lists both; the Personal type stays locked (MUT-373)
    tier: secondary
    paths:
      - src/hosted/components/ProfileOwnersSection.tsx
      - src/hosted/data/profileRules.ts
      - src/hosted/data/partnerMail.ts
      - src/hosted/data/firmRequestLine.ts
    steps:
      - Open the switcher on a profile Basel created and shared with you
      - Open Manage profiles and the shared profile
      - Add a received income on the shared profile
    expect:
      - The switcher and the list read "Business · Shared with Basel Sader", and the list explains the count ("Profiles shared with you don't count.")
      - The switcher lists only the shared profile and your own personal profile, never your partner's
      - The Owners section lists Basel Sader (Created this profile) and you (You); there is no Remove, and Leave sits at its foot
      - The Personal card is disabled with "A shared profile stays Business."
      - The income drawer offers Received and the save is sent for the shared profile
  - id: co-owner-remove
    title: The creator removes a co-owner after an in-place confirm; the row goes and a toast says so (MUT-373)
    tier: secondary
    paths:
      - src/hosted/components/ProfileOwnersSection.tsx
      - src/hosted/components/profileApiErrors.ts
    steps:
      - Open your shared profile in Manage profiles
      - Choose Remove on Lina's row, then Remove Lina Saleh in the confirm
    expect:
      - The creator's Owners section offers Remove and never Leave
      - The confirm reads "Lina Saleh loses access to Sader & Haddad. What they recorded stays."
      - DELETE /v1/profiles/{id}/owners/{lina} goes once with an Idempotency-Key
      - The toast reads "Lina Saleh removed from Sader & Haddad", her row is gone, and the section reads Only you own this profile
  - id: co-owner-leave
    title: A co-owner leaves the open shared profile, lands on their personal profile with a toast, and the drawer closes (MUT-373)
    tier: secondary
    paths:
      - src/hosted/components/ProfileOwnersSection.tsx
      - src/hosted/components/ProfilesManageDrawer.tsx
    steps:
      - On the shared profile, open it in Manage profiles
      - Choose Leave, then Leave Sader & Haddad in the confirm
    expect:
      - The confirm reads "You'll lose access to Sader & Haddad. What you recorded stays." and Save is gone while it is open
      - The personal profile opens with the toast "You left Sader & Haddad", the drawer is closed, and the switcher no longer lists the shared profile
  - id: co-owner-removed
    title: Someone removed while working on the shared profile lands on their personal profile with a banner naming it (MUT-373)
    tier: secondary
    paths:
      - src/hosted/session/AuthGate.tsx
      - src/hosted/session/lostAccess.ts
    steps:
      - Work on the shared profile's Clients
      - Meanwhile the creator removes you; open Expenses
    expect:
      - The portal moves to the personal profile and shows "You no longer have access to Sader & Haddad. What you recorded stays."
      - Close dismisses the banner
  - id: co-owner-full-rights
    title: A co-owner adds a client, records a payment and an expense, and renames the shared profile — the rights its creator has (MUT-373)
    tier: secondary
    paths:
      - src/hosted/data/incomeAffordances.ts
      - src/hosted/data/profileRules.ts
    steps:
      - On the shared profile, add Owed income for a new client with Add client
      - Record a payment on an open entry
      - Record an expense
      - Rename the shared profile in Manage profiles
    expect:
      - The client, the income, the payment and the expense are each sent for the shared profile
      - The rename sends PATCH {name} only, says Profile saved, and the switcher shows the new name
