app: portal
area: shell
title: Signed-in portal shell
tier: secondary
# Every signed-in portal page boots through these: the entry, router, query client, the one
# API client and its types, both dictionaries, money and date formatting, the shell and the
# shared list pieces. Every spec in qa/specs/portal/ (bar sign-in) runs them.
paths:
  - src/hosted/main.tsx
  - src/hosted/HostedApp.tsx
  - src/hosted/router.tsx
  - src/hosted/queryClient.ts
  - src/hosted/api/client.ts
  - src/hosted/api/schema.d.ts
  - src/hosted/i18n/en.json
  - src/hosted/i18n/ar.json
  - src/hosted/format/DecimalAmount.tsx
  - src/hosted/format/dates.ts
  - src/hosted/shell/HostedShell.tsx
  - src/hosted/shell/YouIsland.tsx
  - src/hosted/shell/usePopover.ts
  - src/hosted/pages/views/shared.tsx
  - src/hosted/components/HostedTable.tsx
  - src/hosted/components/QueryView.tsx
  - src/hosted/components/Icons.tsx
  - src/hosted/components/Toast.tsx
  - src/hosted/data/queries.ts
  - src/hosted/data/filters.ts
features:
  - id: navigate
    title: Signed in, the portal opens on Owed for the first profile (owed, overdue, proposed, overdue clients first, per currency), the four destinations Owed, Paid, Spent and Clients are one click away, and عربي turns it right to left
    tier: core # the portal is unusable for everyone signed in if this breaks
    paths:
      - src/hosted/pages/views/OverviewPage.tsx
      - src/hosted/session/AuthGate.tsx
      # MUT-424: which destination a page lights
      - src/hosted/shell/destinations.ts
      - src/components/filters/SegmentedTabs.tsx
      # MUT-165 D9: the shell's spacing, screenshotted in English and Arabic
      - src/hosted/hosted.css
    steps:
      - Sign in and open the portal at /
      - Read the overview, then switch it to USD
      - Visit each of the four destinations from the pill
      - Open You › App, choose عربي, then go to Conversions through Paid
    expect:
      - / lands on the first profile's Owed page (today's overview) with the ILS strip (Owed 4,500.00, Overdue 1,200.00, Proposed 800.00), an As of line, and the overdue client first
      - USD shows the USD block and puts currency=USD in the URL
      - The pill holds exactly Owed, Paid, Spent and Clients; each page's heading is its tab's word and its link is aria-current
      - The page turns rtl with the Arabic destination names
      - Every profile call carried X-Mutaba3a-Profile for that profile
      - A screenshot of the shell is attached in English and in Arabic, for spacing review
  - id: one-level-in
    title: From Owed, Paid and Clients, Receivables, Conversions and Documents are one link away, each lights its destination and links back to it (MUT-424)
    tier: secondary
    paths:
      - src/hosted/components/DeeperLinks.tsx
      - src/hosted/pages/views/ReceivablesList.tsx
      - src/hosted/pages/views/ConversionsList.tsx
      - src/hosted/pages/views/DocumentsList.tsx
    steps:
      - Open Owed, then Receivables from the row at the bottom, then go back from the page's own link
      - Open Paid, then Currency conversions, then go back
      - Open Clients, then Documents, then go back
      - Choose عربي and open a link straight to Receivables
    expect:
      - Each row opens its page at the URL it always had, titled with its own name, with its destination still aria-current
      - Each page's back link returns to its destination
      - In Arabic, a deep link to Receivables lights المستحق and its back link reads المستحق
      - A screenshot of Receivables in Arabic is attached
  - id: switch-profile
    title: You › Profiles lists each profile with its kind, keeps the section when switching (?from=, MUT-425), and a profile not on the account says so
    tier: secondary
    paths:
      - src/hosted/pages/you/YouProfiles.tsx
      - src/hosted/shell/YouIsland.tsx
      - src/hosted/shell/youRoutes.ts
      - src/hosted/data/profileRules.ts
    steps:
      - Open Payments on one office and open You › Profiles from the island
      - Switch to the second office
      - Open a profile id that is not on the account, then Go to the first profile
    expect:
      - Each profile shows Hosted and its kind (Business, Income recorded by Malafat), with the local-profiles footer
      - Switching lands on the same section for the other profile, whose figures are fetched with its own header
      - An unknown profile reads "This profile isn't available" and its button opens the first profile
  - id: client-detail
    title: A client opens to its summary (last payment, per-currency strip, matters), then its own receivables, payments and documents
    tier: secondary
    paths:
      - src/hosted/pages/views/ClientDetailPage.tsx
      - src/hosted/pages/views/ClientsPage.tsx
    steps:
      - Open Clients and choose a client
      - Read the summary
      - Open the Receivables, Payments and Documents tabs, then All clients
    expect:
      - The summary shows Last payment, the ILS strip and each matter with its status
      - Each tab lists only this client's records, without a client column, and asks the server with that customerId
      - All clients returns to the list
  - id: no-profiles
    title: An account with no profile yet is offered New profile beside Sign out (MUT-183)
    tier: secondary
    paths:
      - src/hosted/session/AuthGate.tsx
      - src/hosted/shell/ProfileDrawers.tsx
    steps:
      - Sign in to an account with no profile
      - Choose New profile, then Back
    expect:
      - '"You don''t have a profile yet" shows, with no section navigation'
      - New profile opens its drawer (newProfile=true); Back closes it; Sign out is beside it
  - id: firm-enabled-banner
    title: Once an operator turns firm features on, the Overview shows one "Firm features are on" note; Dismiss keeps it gone, in English and in Arabic (MUT-300, DR5)
    tier: secondary
    paths:
      - src/hosted/components/FirmOnBanner.tsx
      - src/hosted/data/firmBanner.ts
      - src/hosted/pages/views/OverviewPage.tsx
    steps:
      - Sign in to a profile whose firm features are on
      - Dismiss the note
      - Reload the portal
      - Open the portal in Arabic on another profile with firm features on
    expect:
      - Owed shows "Firm features are on for Khatib Law. New tools show up here as they're released." with Dismiss
      - Dismiss removes it, and it stays gone after the reload
      - In Arabic the page is right to left and the note reads "ميزات المكتب مفعّلة لملف …" with إغلاق
  - id: mtb3a-name
    title: Sign-in, the tab title and You › App name the product MTB3A in English and متابعة in Arabic; the floating chrome has no wordmark (MUT-402, MUT-426 D3)
    tier: secondary
    legacy: [MUT-402]
    paths:
      - src/hosted/components/Brand.tsx
      - src/hosted/pages/you/YouApp.tsx
      - src/hosted/HostedApp.tsx
      - src/hosted/shell/HostedShell.tsx
      - src/hosted/hosted.css
      - hosted.html
      - src/components/brand/Logotype.tsx
      - src/components/brand/Logotype.css
    steps:
      - Open sign-in in English on a cold load
      - Switch to Arabic
      - Sign in at desktop width, look at the chrome, then open You › App
    expect:
      - Sign-in shows a 40px mark with the MTB3A logotype, the tab says MTB3A, and the logotype file is fetched once (the preload is used; Chromium only)
      - In Arabic the lockup writes متابعة as live text with no logotype, and the tab says متابعة
      - The chrome shows no wordmark, the tab says MTB3A, and You › App shows a 32px mark with the MTB3A logotype
  - id: floating-chrome
    title: The pill, the You island and the Reports icon float over every page with no sidebar or header bar; the pill sits at the bottom on a phone, Arabic mirrors every position, and nothing scrolls sideways at 320 px (MUT-426)
    tier: core # every signed-in page is reached through this chrome
    paths:
      - src/hosted/shell/HostedShell.tsx
      - src/hosted/shell/YouIsland.tsx
      - src/hosted/components/Icons.tsx
      - src/hosted/hosted.css
      - hosted.html
    steps:
      - Open Clients on a 1280 px desktop
      - Scroll the list under the chrome, then switch to dark mode
      - Open it in Arabic
      - Open it on a 375 px phone, focus the search field, then leave it
      - Open it in Arabic on the phone
      - Open it at 320 px in English and in Arabic
    expect:
      - No aside and no header outside the page; Reports is top start, the pill top centre and the island top end, 16 px from the edges
      - Scrolled, the list runs under the glass and axe finds nothing new, in light and in dark
      - In Arabic, Reports and the island swap sides
      - On the phone the pill and the island circle are at the bottom (the name only in the island's label) and Reports is top end; the bar hides while the search has focus and returns after (D9; a real iPhone keyboard is a manual check)
      - In Arabic on the phone, Reports is top start and the island sits left of the pill
      - At 320 px nothing scrolls sideways and no tab label is cut, in either language
  - id: island
    title: The You island names the profile with its ring, opens You › Profiles lit, a second press returns to the exact page, any tab leaves, and switching from Reports keeps Reports (MUT-426 D2, D7, D8)
    tier: secondary
    paths:
      - src/hosted/shell/YouIsland.tsx
      - src/hosted/shell/youRoutes.ts
      - src/hosted/pages/you/YouPage.tsx
    steps:
      - Open a client
      - Press the island
      - Press it again
      - Press it, then Paid in the pill
      - Open Reports from its corner icon, then switch profile from You › Profiles
    expect:
      - The island shows Nour Studio and the avatar ringed in the profile's colour, not current
      - You › Profiles opens with from=clients and back= in the URL, and the island is aria-current
      - The second press lands back on that client, not the Clients list
      - Paid leaves You and the island is no longer current
      - Reports is aria-current on its icon, and switching lands on the other profile's Reports
  - id: page-motion
    title: Going deeper slides forward, back slides the other way, mirrored in Arabic; the You page grows from the island; tabs cross-fade; drawers start no transition; reduced motion only cross-fades (MUT-426 D6)
    tier: secondary
    paths:
      - src/hosted/shell/pageMotion.ts
      - src/hosted/router.tsx
      - src/hosted/hosted.css
    steps:
      - Open Owed in Chromium
      - Open Receivables from the row at the bottom, then go back from its link
      - Press Paid in the pill
      - Press the island, then open Billing from You › Account
      - In Arabic, open Receivables and go back
      - With reduced motion, open Receivables
    expect:
      - The browser takes view-transition types under both the portal's and the router's checks
      - Receivables arrives as forward (in from the right), and its back link as back (in from the left)
      - Tab to tab is a fade
      - The You page is an island transition, growing from the island's corner
      - Opening the Billing drawer starts no view transition
      - In Arabic forward comes in from the left and back from the right
      - With reduced motion the forward move is only a cross-fade
  - id: reduced-transparency
    title: With reduced transparency the floating pill is solid, with no blur (MUT-426)
    tier: secondary
    paths:
      - src/hosted/hosted.css
    steps:
      - Open Owed on a desktop
      - Ask the browser for reduced transparency (Chromium's DevTools protocol; Playwright has no option for it)
    expect:
      - By default the pill's backdrop is blurred and its background see-through
      - With reduced transparency its backdrop-filter is none and its background opaque
  - id: keyboard
    title: From the top of a page, Tab reaches Reports, Owed, Paid, Spent, Clients, then the island, each with a visible focus ring; aria-current marks the lit tab, and the island on You (MUT-426)
    tier: secondary
    paths:
      - src/hosted/shell/HostedShell.tsx
      - src/hosted/shell/YouIsland.tsx
      - src/hosted/hosted.css
    steps:
      - Open Paid and press Tab six times
      - Press Enter on the island
    expect:
      - Focus goes Reports, Owed, Paid, Spent, Clients, You · Nour Studio, each with a focus ring; only Paid is aria-current
      - You opens and the island is aria-current
