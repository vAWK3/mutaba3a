app: portal-live
area: billing
title: Settings › Billing against Stripe's sandbox
tier: secondary
# MUT-362 (epic MUT-322, ADR-170; eng review D8 B): the portal on a real dev API holding a Stripe sandbox key, with
# `stripe listen` forwarding the webhook, so the flows fill Stripe's real hosted Checkout and cancel in its real
# Customer Portal. Checkout's Subscribe runs an hCaptcha that never passes under automation, and QA doesn't work
# around bot checks, so the paying flows fill the page, then pay on that Checkout's own customer and price through
# Stripe's API and follow its success URL back (TD-201). Started by qa/support/billing-live.mjs. MUT-418: consumers
# everywhere (billing-countries.json "*"), the GA list prices ₪29 / $9 a month (MUT-529), and the trial's card prompt, which
# starts at a real signup on this API (memory mailer, fixture domains, Turnstile's test secret).
paths:
  - src/hosted/components/BillingDrawer.tsx
  - src/hosted/data/billingView.ts
  - src/hosted/data/billingQueries.ts
  - src/hosted/data/countries.ts
  - server/src/routes/billing.ts
  - server/src/billing/checkout.ts
  - server/src/billing/billing-countries.json
  - server/src/billing/stripe/checkout-gateway.ts
features:
  - id: subscribe
    title: Subscribe in shekels from Israel as a business, pay with a test card, and come back subscribed
    tier: core
    paths:
      - src/hosted/shell/AccountDrawers.tsx
      - src/hosted/pages/you/YouAccount.tsx
      - src/hosted/components/RadioCards.tsx
      - src/hosted/i18n/en.json
      - src/hosted/i18n/ar.json
      - src/hosted/hosted.css
      - src/hosted/data/filters.ts
      - server/src/billing/stripe/sync.ts
    steps:
      - Sign in as a new person and open Billing from You › Account
      - Press Subscribe, choose Israel, For a business, Monthly
      - Read the heads-up and press Continue to payment
      - On Stripe's page, fill in 4242 4242 4242 4242, an Israeli address and the business tax number
      - Pay (through Stripe's API on this Checkout's customer and price; its page blocks automated payment)
    expect:
      - Our drawer explains the plan, both prices, the VAT sentence and the cancel rule before any Stripe page (AC4)
      - Stripe's page charges ₪29.00 a month, asks for "Business tax number · الرقم الضريبي" and shows our Arabic + English note
      - The Checkout is on the person's own Stripe customer (metadata mutaba3a_user_id), in subscription mode, at freelancer_list_monthly_ils
      - Back in the portal the drawer says "Confirming your payment…", then "You're subscribed. Thank you." once the webhook lands, with Manage billing (AC1, ILS)
  - id: subscribe-usd
    title: Subscribe in dollars from the Emirates as a business with a tax ID
    tier: secondary
    steps:
      - Sign in as a new person, open Billing and press Subscribe
      - Choose United Arab Emirates, For a business, Yearly
      - Fill in Stripe's page with the test card and a UAE TRN, then pay (through Stripe's API, as above)
    expect:
      - The step's summary and Stripe's page show $90.00 a year; Yearly is labelled "2 months free"
      - Back in the portal the drawer says "You're subscribed. Thank you." (AC1, USD)
  - id: consumer-everywhere
    title: A person in any country goes straight on to the card; a business still gives its tax number
    tier: secondary
    steps:
      - Sign in, open Billing and press Subscribe
      - Choose Jordan and For yourself
      - Continue to Stripe's page
    expect:
      - '"No tax number needed, in any country", the summary shows $9.00 a month, and Continue to payment is enabled (MUT-418 comment 12451)'
      - Stripe's page charges $9.00 a month and asks for no business tax number
  - id: trial-start
    title: A new signup lands on "Your 14-day free trial has started"; adding a card keeps the trial and the first charge is its end
    tier: core
    paths:
      - src/hosted/session/trialWelcomeOffer.ts
      - src/hosted/shell/TrialWelcomeOpener.tsx
      - src/hosted/data/trialPrompt.ts
      - src/hosted/data/trialPromptQueries.ts
      - server/src/billing/trial-prompt.ts
      - server/src/routes/sessions.ts
      - server/src/routes/me.ts
      - qa/support/billing-live.mjs
    steps:
      - Ask for a signup link on a business address and open the mail's link
      - Finish creating the account (password, terms) in English
      - Read the trial step, then press Add a card now (recommended)
      - Choose Israel, For yourself, Monthly and continue to Stripe's page
      - Fill in the test card and an Israeli address, then add it (through Stripe's API with the trial's end, TD-201)
      - Go back to Home
    expect:
      - The first sign-in lands on "Your 14-day free trial has started" with its end date, "You won't be charged until <date>. Cancel any time before then.", Add a card now (recommended) and Not now (AC1)
      - 'The Subscribe step shows ₪29.00 and "Your free trial continues: the first charge is on <date>"; Stripe''s page shows the free days first and asks a person for no tax number'
      - Back in the portal, "You're subscribed. Thank you." and "Card added. Your first charge is on <trial end>"; Stripe holds a trialing subscription whose trial_end is the trial end, and /v1/me says ACTIVE paid by Stripe (AC2)
      - Home shows neither the step nor the trial banner again
  - id: trial-banner
    title: The Home trial banner in Arabic on a 375 px phone - Not now, hide for 3 days, the last 3 days, gone once a card is on file
    tier: secondary
    paths:
      - src/hosted/components/TrialBanner.tsx
      - src/hosted/pages/views/OverviewPage.tsx
      - src/hosted/data/trialPrompt.ts
    steps:
      - Sign up and finish the account in Arabic on a 375 px screen
      - Press ليس الآن on the trial step
      - Press إخفاء لمدة 3 أيام, then reload
      - Move the trial to its last 3 days, then reload
      - Add a card (a trialing subscription through Stripe's API), then reload
    expect:
      - The trial step reads right to left in Arabic with nothing overflowing sideways
      - Not now lands on Home with one quiet line of the days left in the trial and أضف بطاقة (AC3, MUT-426 D4); the step never returns
      - Hidden, the banner stays hidden after a reload (the snooze is stored on the account)
      - In the last 3 days it shows again ("بقي يومان من تجربتك المجانية") with no way to hide it
      - Once a card is on file the banner is gone (AC3)
  - id: manage
    title: Manage billing opens Stripe's Customer Portal for the card and invoices; cancelling is MTB3A's own
    tier: core
    paths:
      - server/src/billing/entitlement.ts
      - server/src/billing/stripe/mirror.ts
    steps:
      - Sign in as a person with a paid monthly subscription and open Billing
      - Press Manage billing
      - In Stripe's portal, look for a way to cancel, then return to MTB3A
    expect:
      - The drawer shows Active and the renewal date before, and Stripe's Customer Portal opens on Manage billing (AC3)
      - "Stripe's portal offers no cancel (MUT-532 D8: off in its configuration); the note under Manage billing reads \"Change your card or see invoices, on Stripe's page (in English).\""
      - Back in the portal (?portal=returned) the plan is still Active; /v1/me still reports the profile ACTIVE, paid by Stripe
  - id: manage-ended
    title: After the cancelled period ends the account is read-only and Subscribe comes back
    tier: secondary
    steps:
      - Sign in as a person whose cancelled subscription sits on a Stripe test clock
      - Advance the test clock past the period end
      - Open Billing
    expect:
      - 'The drawer says "Your plan has ended", read-only, with Subscribe (AC3: READ_ONLY after the period)'
  - id: rtl-375
    title: Billing in Arabic on a 375 px phone
    tier: secondary
    steps:
      - Sign in as an Arabic-speaking person on a 375 px screen
      - Open Billing, then the Subscribe step, choose Israel and For a business
    expect:
      - Nothing overflows sideways; the headline, chip and buttons read right to left
      - The amount reads ₪29.00 inside Arabic text (<bdi>), and Continue to payment spans the footer (AC4, DR10)
  # MUT-361 (ADR-181): the lapse gate on the real API: the trial's days moved in the QA database.
  - id: lapse-gate
    title: After the trial the API refuses writes and the portal is read-only; from day 30 only Subscribe and the records export answer
    tier: core
    paths:
      - server/src/billing/gate.ts
      - server/src/auth/billing-gate.ts
      - server/src/auth/middleware.ts
      - server/src/billing/coverage.ts
      - server/src/routes/me.ts
      - server/src/routes/entries.ts
      - src/hosted/components/LapseGate.tsx
      - src/hosted/queryClient.ts
    steps:
      - Sign up and skip the card
      - Twenty days later, open Expenses and try to record one anyway
      - Thirty-one days later, open the portal and download my records
    expect:
      - On day 20 the banner says the profile is read-only, there's no Record expense, and the API answers a write with 402 SUBSCRIPTION_LAPSED
      - On day 31 only "Subscribe or download your records" shows, the API refuses a list read with 402, and Download my records saves the file
  # MUT-525 (ADR-237, eng review R3/R6): the launch offer. Each run owns its coupon id (billing-live.mjs passes it to the
  # API, which reads it uncached); only these four create it and delete it, so every flow above sees no offer.
  - id: launch-offer-yearly
    title: Launch offer - a trialist picks Yearly, sees ₪290 → ₪145, and pays ₪145 for the first year
    tier: core
    paths:
      - server/src/billing/offer.ts
      - server/src/billing/offers.json
      - server/src/billing/offer-read.ts
      - src/hosted/components/TrialBanner.tsx
      - src/hosted/components/OfferTopLine.tsx
      - qa/support/livePortal.ts
    steps:
      - The launch coupon runs in Stripe (50% once, Freelancer only, three days left)
      - Sign up, press Not now on the trial step, and move the trial to its last day
      - On Home, press "50% off a yearly plan until <date>" in the trial line
      - Read the Subscribe step, choose Israel and continue to Stripe's page
      - Fill in the test card and pay (through Stripe's API with the Checkout's coupon, TD-201)
    expect:
      - The Home line offers 50% off a yearly plan until the offer's last day, in place of Add a card
      - Subscribe opens on "Yearly · −50%" with the launch line, ₪145.00 before a struck ₪290.00 for the first year, and "You pay ₪145.00 today for your first year, then ₪290.00 a year from <date>"
      - Stripe's page carries the coupon (Launch offer) and our Arabic offer line above Pay
      - Back in the portal "You're subscribed. Launch offer applied."; the first invoice is ₪145.00 with a ₪145.00 discount line
  - id: launch-offer-monthly
    title: Launch offer - Monthly shows no offer price and Stripe charges the full monthly price
    tier: secondary
    paths:
      - server/src/routes/billing.ts
    steps:
      - The launch coupon runs in Stripe
      - Sign up, press Not now, open Billing and press Subscribe
      - Switch to Monthly, choose Israel and continue to Stripe's page
    expect:
      - The step opens on Yearly while the offer applies; on Monthly it shows ₪29.00, no struck price, and "Yearly is 50% off the first year until <date>"
      - Stripe's page charges ₪29.00 a month with no discount, and the Checkout carries no coupon
  - id: launch-offer-ended
    title: Launch offer - ended early mid-Subscribe, the drawer says so before any charge; the next Checkout is at full price
    tier: secondary
    paths:
      - src/hosted/data/billingQueries.ts
    steps:
      - The launch coupon runs in Stripe; sign up, press Not now, open Subscribe (Yearly, offer shown) and choose Israel
      - The operator deletes the coupon (ends the campaign early)
      - Press Continue to payment
      - Press Continue to payment again
      - Go back to Home
    expect:
      - The first Continue makes no Checkout and shows "The launch offer has ended. The yearly price is ₪290.00." in the drawer
      - The second goes to Stripe's page at ₪290.00 a year with no discount
      - Home's trial line is back to Add a card, and GET /v1/billing answers offer null
  - id: launch-offer-trial-carry
    title: Launch offer - with more than 48 hours of trial left the trial carries over and the first paid invoice is ₪145
    tier: secondary
    paths:
      - server/src/billing/checkout.ts
    steps:
      - The launch coupon runs in Stripe; sign up (14 days of trial) and press Not now
      - Open Subscribe, choose Israel, continue to Stripe's page and fill in the test card
      - Add the card (through Stripe's API, with the trial's end and the coupon)
      - End the trial in Stripe (its API's trial_end=now bills the first paid period at once)
    expect:
      - The step says "Your free trial continues. On <trial end> you pay ₪145.00 for your first year, then ₪290.00 a year from <a year later>"
      - Back in the portal "Card added. Your first charge is on <trial end>" and "Launch offer applied"
      - Stripe's invoices are ₪0 for the trial, then ₪145.00 with a ₪145.00 discount (the D5 spike's result, recorded)
  # MUT-531 (ADR-238): the switch from monthly to yearly. A test clock started a month back makes two real monthly
  # payments, and Stripe prorates on that clock's time (plan-gateway clockNow).
  - id: yearly-switch
    title: Switch to yearly from the 2nd payment - the line names the saving, Stripe's preview is what is charged, no discount
    tier: core
    paths:
      - server/src/routes/billing-plan.ts
      - server/src/billing/retention.ts
      - server/src/billing/stripe/plan-gateway.ts
      - src/hosted/components/BillingSwitchBody.tsx
      - src/hosted/components/useSwitchStep.ts
      - src/hosted/components/billingParts.tsx
      - src/hosted/components/billingText.tsx
    steps:
      - A monthly subscriber in shekels has paid two months (the sandbox clock runs a month)
      - Open Billing
      - Press Switch to yearly and read the preview
      - Press Pay and switch
    expect:
      - Under Manage billing, "Switch to yearly and save ₪58.00 a year" (twelve months less the year, from the catalog; AC2)
      - The step says ₪290.00 a year renewing on the anniversary of the billing day (Stripe keeps the day) and what is charged today: the rest of that year less the unused part of this month (AC1)
      - Back on the status view "You're on the yearly plan. It renews on <date> at ₪290.00." and, once the webhook lands, "Renews at ₪290.00 on <date>"
      - Stripe holds the yearly list price with no discount, and today's invoice is the previewed amount (AC3); /v1/me stays ACTIVE · STRIPE (AC4)
  - id: yearly-switch-early
    title: Switch to yearly - no line before the 2nd payment
    tier: secondary
    paths:
      - server/src/billing/retention.ts
    steps:
      - A monthly subscriber has paid once
      - Open Billing
    expect:
      - Billing shows Active and Manage billing with no switch line, and GET /v1/billing/yearly-switch answers 409 SWITCH_NOT_AVAILABLE (TOO_EARLY)
  # MUT-532 (ADR-240): pause instead of cancel, the stay offer and MTB3A's own cancel flow. A pause runs on the server's
  # real clock while Stripe runs on a test clock, so the pause flows start a subscription whose paid month ends a
  # couple of minutes from now (payingUntilSoon). The stay coupon is this run's own (BILLING_STAY_COUPON_ID).
  - id: pause
    title: Pause instead of cancelling - booked from the paid month's end, read-only while it runs, back on its own
    tier: core
    paths:
      - src/hosted/components/BillingCancelFlow.tsx
      - src/hosted/components/useCancelFlow.ts
      - src/hosted/components/LapseGate.tsx
      - src/hosted/data/trialPrompt.ts
      - server/src/billing/entitlement.ts
      - server/src/billing/gate.ts
      - server/src/billing/stripe/mirror.ts
      - server/src/billing/stripe/sync.ts
      - server/src/routes/billing-plan.ts
      - server/src/billing/retention.ts
      - server/src/billing/stripe/plan-gateway.ts
    steps:
      - A monthly subscriber whose paid month ends in two minutes opens Billing and presses Cancel plan
      - Pick "I don't use it enough" and press Continue
      - On Pause instead of cancelling?, pick 2 months and press Pause my plan
      - The paid month ends (the sandbox clock passes it, and the real one too)
      - Open the profile, try to add an expense, and download the records
      - Two months on, Stripe restarts billing on its own
    expect:
      - The step offers 1, 2 or 3 months, each with its restart date, and says the pause starts when the paid month ends and is once a year
      - Billing then says "Your plan pauses on <date>" with the Pause booked chip and Don't pause; Stripe holds pause_collection void until an hour before the restart
      - Once the month ends Stripe voids the invoice (₪0), Billing says "Paused until <date>", and the profile's banner says the plan is paused until then, with Resume now and Download, never Subscribe
      - Adding is refused (402, paused); the records export still answers; nothing is LOCKED
      - At the restart Stripe charges ₪29.00, the pause is gone and the profile is Active again
  - id: pause-resume-now
    title: Resume now during a pause - a month charged today, writable again
    tier: secondary
    paths:
      - src/hosted/components/BillingDrawer.tsx
      - src/hosted/components/InPlaceConfirm.tsx
    steps:
      - A monthly subscriber has paused for a month, and the pause is running
      - Open Billing and press Resume now
      - Read what it charges today and press Resume now again
    expect:
      - The confirm says "You pay ₪29.00 today, and your plan renews monthly from today."
      - Stripe charges ₪29.00 today as its own invoice, the pause is gone and the plan renews monthly from today
      - Billing shows the plan Active and adding works again
  - id: pause-once-a-year
    title: A second Cancel within 12 months of a pause offers no pause
    tier: secondary
    steps:
      - A monthly subscriber paused, and resumed
      - Open Billing, press Cancel plan, pick a reason and press Continue
    expect:
      - The next step is the stay offer, not the pause; GET /v1/billing/retention answers pause null
  - id: stay-offer
    title: The stay offer - half price for 2 months, once per person ever
    tier: core
    steps:
      - A monthly subscriber opens Billing and presses Cancel plan
      - Pick "It costs too much", Continue, then No, keep cancelling on the pause
      - On the stay offer press Keep my plan at ₪14.50
      - The next month is invoiced
      - Press Cancel plan again, pick a reason, Continue, then No, keep cancelling
    expect:
      - The offer reads "Stay with 50% off for 2 months" and "You pay ₪14.50 a month instead of ₪29.00, then ₪29.00 a month again"
      - Billing says "Done. Your next 2 months are ₪14.50 each."; Stripe holds this run's stay coupon on the plan
      - The next invoice is ₪14.50
      - The second time there is no stay offer, only Confirm cancel (rule 2)
  - id: cancel-reason
    title: Cancel with a reason - the plan stays on to the period end, and Keep my plan takes it back
    tier: core
    steps:
      - A monthly subscriber opens Billing and presses Cancel plan
      - Pick "I'm moving to another tool" and write a comment, Continue
      - No, keep cancelling on the pause, then No, cancel my plan on the stay offer
      - Press Keep my plan
    expect:
      - Billing says "Your plan ends on <date>" with the Ending chip; Stripe holds cancel_at_period_end with feedback switched_service and the comment
      - Keep my plan brings back "Freelancer, renews <date>"; Stripe no longer cancels
  - id: card-failed-mail
    title: A declined renewal - one Arabic mail within the hour, no amount or card; Update card opens Stripe's card form
    tier: core
    paths:
      - server/src/billing/card-failed-mail.ts
      - server/src/routes/card-failed-mail.ts
      - server/src/billing/stripe/plan-gateway.ts
      - server/src/email/templates/copy.ts
      - server/src/email/templates/look.ts
      - server/src/email/ports.ts
      - src/hosted/data/billingQueries.ts
      - src/hosted/data/filters.ts
      - src/hosted/shell/AccountDrawers.tsx
    steps:
      - A monthly subscriber in Arabic has a renewal that declines, and Stripe starts retrying
      - The hourly failed-card job runs, then runs again
      - Open the mail's button, signed in
      - Press Update card, enter a good card on Stripe's page and save it
    expect:
      - One mail, in Arabic, "لم تنجح عملية الدفع ببطاقتك", saying the account stays fully open while Stripe retries; no amount, no currency, no card digits
      - The second run sends nothing new
      - Billing opens on "لم نتمكن من تحصيل دفعتك الأخيرة" with حدّث البطاقة (Update card) as the button
      - Update card opens Stripe's own card form (the Customer Portal's payment-method flow)
      - Saving a good card brings the person back to Billing, which asks Stripe to pay the open invoice on it now (Stripe's card form alone waits for its next retry); the plan is Active again
  - id: card-failed-reminder
    title: A declined renewal a week on - exactly one reminder, then nothing more for that invoice
    tier: secondary
    paths:
      - server/src/billing/card-failed-mail.ts
    steps:
      - A monthly subscriber's renewal first declined over a week ago, and Stripe is still retrying
      - The hourly failed-card job runs three times
    expect:
      - Exactly one mail, the reminder "Your card still isn't going through", saying the plan ends within N days at most; no first mail (only the current stage is sent)
      - Further runs send nothing more for the invoice (never more than two mails per failed invoice)
  - id: card-failed-3ds
    title: A renewal the bank wants confirmed (3-D Secure) - no MTB3A mail; Stripe's own confirm-payment mail covers it
    tier: secondary
    paths:
      - server/src/billing/card-failed-mail.ts
      - server/src/billing/stripe/plan-gateway.ts
    steps:
      - A monthly subscriber's renewal needs the person to confirm it with their bank (3-D Secure)
      - The hourly failed-card job runs
    expect:
      - The job skips the plan as needing authentication and mails nothing; Stripe's own confirm-payment email (kept on) asks the person
  - id: comeback-offer
    title: The come-back offer - mailed 30 days after a paid plan ended; the first month back is ₪9, then ₪29
    tier: core
    paths:
      - server/src/billing/comeback.ts
      - server/src/billing/comeback-mail.ts
      - server/src/billing/comeback-read.ts
      - server/src/routes/comeback-mail.ts
      - server/src/billing/offer.ts
      - server/src/billing/offers.json
      - server/src/routes/billing.ts
      - server/src/billing/checkout.ts
      - src/hosted/components/BillingDrawer.tsx
      - src/hosted/data/billingView.ts
    steps:
      - A monthly subscriber paid once, and the plan ended 31 days ago
      - The daily come-back job runs
      - Open the mail's button, signed in, and pick Israel
      - Continue to payment and pay
      - The job runs again
    expect:
      - One mail, "Your MTB3A records are still here", saying the records are still there and "Come back for ₪9 for your first month, then ₪29 a month"
      - Subscribe says "Welcome back - your first month is ₪9.00, then ₪29.00 a month."
      - Stripe's page says the welcome-back price, and the first invoice takes ₪20 off ₪29
      - Once back, Billing offers it no more and the job mails nothing more
  - id: comeback-yearly
    title: The come-back offer on Yearly - the same ₪20 off the first year, ₪270 then ₪290
    tier: secondary
    paths:
      - server/src/billing/comeback.ts
    steps:
      - A monthly subscriber paid once, the plan ended 31 days ago, and the job mailed them
      - Open the mail's button, pick Israel and Yearly, and pay
    expect:
      - Subscribe says "Welcome back - your first year is ₪270.00, then ₪290.00 a year."; the first invoice takes ₪20 off ₪290
  - id: comeback-usd
    title: The come-back offer in dollars - a shekel payer coming back from abroad sees and pays $3.00, then $9.00
    tier: secondary
    paths:
      - server/src/billing/comeback.ts
    steps:
      - A shekel subscriber paid once, the plan ended 31 days ago, and the job mailed them
      - Open the mail's button and pick the United Kingdom
    expect:
      - Subscribe says "Welcome back - your first month is $3.00, then $9.00 a month."; Stripe's page carries the come-back coupon in dollars

