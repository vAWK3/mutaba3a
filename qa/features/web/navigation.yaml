# One file per area. Feature ids become <app>.<area>.<id> — tag the test with that id.
app: web
area: navigation
title: Sidebar navigation
tier: core
paths:
  - src/components/layout/**
  - src/router.tsx
  - src/lib/features/**
  - src/hooks/useCheckForUpdates.ts
features:
  - id: core-sidebar
    title: A fresh install shows the core four (Home, Clients, Income, Settings) and each one navigates
    tier: core
    legacy: [MUT-15]
    steps:
      - Open a fresh install
      - Read the sidebar's nav items
      - Click Clients, then Income, then Settings, then Home
    expect:
      - The sidebar shows exactly Home, Clients, Income, Settings — no Projects, Transactions, Reports or Expenses
      - Each click lands on the matching route and marks that link aria-current="page"
  - id: retired-areas
    title: Old Planning and Retainers links land on Home, and no switch brings either area back (MUT-226)
    tier: secondary
    legacy: [MUT-226]
    steps:
      - Open a fresh install, then a bookmarked /app/planning?plan=p1
      - Open a bookmarked /app/retainers?status=active
      - Open Settings and read the Features switches
    expect:
      - Each old link lands on Home, and the sidebar has no Planning or Retainers entry
      - Settings › Features lists exactly Expenses, Insights, Projects and Currency conversions
