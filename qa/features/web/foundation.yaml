# The plumbing every screen stands on: the IndexedDB layer, the query and store wiring, and the
# shared UI kit. Nothing here is a screen of its own, so it is claimed by the flows that cannot
# work without it. A change here runs these, and core always runs on a release anyway.
app: web
area: foundation
title: App foundation
tier: core
paths:
  # Storage: the Dexie database, its upgrades and the repository the UI reads through
  - src/db/database.ts
  - src/db/repository.ts
  - src/db/provider.ts
  - src/db/interfaces.ts
  - src/db/index.ts
  - src/db/baseQuery.ts
  - src/db/defaultSettings.ts
  - src/types/**
  # Query, store and toast wiring
  - src/hooks/useQueries.ts
  - src/hooks/useMutationWithFeedback.ts
  - src/lib/queryClient.ts
  - src/lib/stores.ts
  - src/lib/toastStore.ts
  - src/lib/savedFlashStore.ts
  - src/lib/useSavedFlash.ts
  - src/lib/utils.ts
  - src/lib/dates.ts
  - src/lib/currencyAmounts.ts
  - src/lib/platform.ts
  - src/lib/retiredStorage.ts
  # The shared UI kit these flows render
  - src/components/icons/**
  - src/components/ui/index.ts
  - src/components/ui/Badge.*
  - src/components/ui/Button.*
  - src/components/ui/Card.*
  - src/components/ui/CurrencyAmounts.*
  - src/components/ui/EmptyState.tsx
  - src/components/ui/ErrorBoundary.*
  - src/components/ui/Input.*
  - src/components/ui/Numeric.tsx
  - src/components/ui/Pagination.tsx
  - src/components/ui/SegmentedControl.*
  - src/components/ui/Switch.*
  - src/components/ui/Table.css
  - src/components/ui/Toast.*
  - src/components/ui/ToastContainer.tsx
  - src/components/ui/TruncatedTitle.*
features:
  - id: persists
    title: What you log is still there after a reload — an unpaid entry and a paid one
    tier: core
    steps:
      - Open a fresh install at /income
      - Log "Logo redesign" for Acme Studio, $1,200
      - Log "Brand audit" for Beta Labs, $500, and record its payment in full
      - Reload the page
    expect:
      - Both entries are listed with their clients and amounts
      - Logo redesign still offers Record Payment; Brand audit no longer does
      - The empty state is gone
  - id: row-actions-duplicate
    title: A row's ⋯ menu opens, and Duplicate opens a new entry prefilled from that row
    tier: secondary
    paths:
      - src/components/ui/RowActionsMenu.*
      - src/components/ui/RowActionsHeader.*
    steps:
      - Log "Logo redesign" for Acme Studio, $1,200
      - Open the row's ⋯ menu and pick Duplicate
      - Save the drawer
    expect:
      - The menu lists Mark Paid and Duplicate
      - The New Income drawer opens with the title and amount filled in
      - After saving, the Income list holds two "Logo redesign" rows
