app: web
area: brand
title: Brand v2 on the website (tokens, contrast, layout)
tier: core
paths:
  - src/styles/**
  - src/assets/fonts/**
  - src/index.css
  - src/main.tsx
  - vite.config.ts
  - index.html
  - public/favicon*
  - public/apple-touch-icon.png
  - public/og-card-*
  - public/icons/**
  - src/components/brand/**
  - src/lib/theme/themeColorMeta.ts
  - src/assets/brand/**
features:
  - id: contrast-landing
    title: The landing page passes axe in light and dark, colour contrast included
    tier: core
    steps:
      - Open / in light mode, then in dark mode
    expect:
      - No axe violation, colour-contrast included
  - id: layout
    title: At 375px and 1280px, in English and Arabic, the landing page and the privacy page fit the window
    tier: secondary
    paths:
      # MUT-165 D9: the spacing sweep's landing surfaces
      - src/pages/landing/LandingPage.css
      - src/pages/landing/PrivacyPolicyPage.css
      - src/pages/landing/components/HeroSection.css
    steps:
      - Set the window to 375 × 812, then 1280 × 720, in each language
      - Open the landing page and the privacy page
    expect:
      - The page never scrolls sideways
      - A screenshot of each page is attached for review
  - id: chrome-icons
    title: The tab shows the Brand v2 favicon, a cream tile in a light browser and a plum tile in a dark one, and the head has the PNG fallbacks and apple-touch icon (MUT-104)
    tier: core
    legacy: [MUT-104]
    steps:
      - Emulate OS light, then OS dark, and open the landing page
      - Open /favicon.svg directly in each scheme
    expect:
      - The favicon tile is #FBF1D8 in light and #221B2D in dark, never black
      - The head links /favicon.svg, /favicon-32.png, /favicon-16.png and /apple-touch-icon.png, and each returns 200
  - id: link-preview
    title: The built landing page carries the Arabic link-preview card (MUT-104)
    tier: secondary
    legacy: [MUT-104]
    steps:
      - Build the web app and read dist-web/index.html
      - After a deploy, paste the site URL into a social-card debugger
    expect:
      - og:title is "تابع مالك، بأمان.", og:image is the absolute https og-card-ar-1200x630.png at 1200×630, twitter:card is summary_large_image
      - The debugger shows the wide Arabic card
  - id: link-hover
    title: Hovered button-links keep their label colour and gain no underline; classed text links still underline; unclassed links take the link hover (TD-122)
    tier: secondary
    paths:
      - src/pages/landing/**
    steps:
      - In light mode, then dark mode, hover the landing hero button and a Get it card
      - Hover the hero's other link and the privacy page's back link
      - Hover an unclassed link
    expect:
      - Controls keep their label colour (or the one their own hover sets) and computed text-decoration-line stays none
      - Text links compute text-decoration-line underline
      - The unclassed link takes --link-hover and an underline

  - id: boot-splash
    title: Before any JavaScript the landing shows the 80 px mark centred on the brand canvas, in the OS's light or dark scheme (MUT-207)
    tier: core
    paths:
      - index.html
      - src/styles/brand/boot-splash.css
      - src/components/brand/BootSplash.tsx
      - src/components/brand/bootDelay.ts
      - src/main.tsx
    steps:
      - With scripts off, under OS light then OS dark, open /
    expect:
      - The splash's background is the canvas the token file names for that scheme
      - The mark is loaded (the dark file under OS dark), 80 px, and centred in the window (±1 px)
  - id: mtb3a-name
    title: The landing header and the public pages name the product MTB3A in English and متابعة in Arabic, as the MUT-401 logotype (MUT-402)
    tier: secondary
    legacy: [MUT-402]
    paths:
      - src/components/brand/Logotype.tsx
      - src/components/brand/Logotype.css
      - src/components/brand/Wordmark.tsx
      - src/pages/landing/components/LandingHeader.tsx
      - src/pages/landing/LandingPage.css
      - src/lib/i18n/translations/en/*.json
      - src/lib/i18n/translations/ar/landing.json
    steps:
      - Open the landing page in English at 1280px, then switch to Arabic
      - Open it at 320 and 360px in English and in Arabic
      - Turn on forced colours (high contrast)
    expect:
      - The header link shows the mark, the MTB3A logotype, the dot and متابعة, in the page's reading order, named "MTB3A متابعة" in English and "متابعة MTB3A" in Arabic
      - The logotype is 12.8px tall in the link's own colour, and no English page text says Mutaba3a
      - The tab title is the English meta title, then the Arabic one
      - At 320 and 360px only the mark and the active name show, with nothing wrapped or overflowing
      - In forced colours the logotype, the dot and متابعة are one colour and the mark has a ring
      - Screenshots of both languages are attached for comparison with the Wordmark Kit preview
