features:
  - id: amounts
    title: In Arabic, amounts on Home, Clients and a client profile keep their order and currency position
    tier: core
    legacy: [MUT-109]
    steps:
      - Log two clients' income, one overdue, and record a partial payment
      - Switch to Arabic and open Home, Clients and the overdue client's profile
    expect:
      - Every amount reads currency then number on screen, as before ($US 1,300)
      - Each amount is a plain <bdi> that resolves right to left from its own RLM
  - id: ltr-content
    title: In Arabic, the exchange-rate formula and a client's email read left to right
    tier: secondary
    legacy: [MUT-109]
    steps:
      - Give a client an email, switch to Arabic
      - Read the top bar's exchange rate and the client profile's contact line
    expect:
      - The formula reads $1 = ₪3.70 and the email reads in order, both computing left to right
  - id: amount-inputs
    title: In Arabic, the income and payment drawers' amount fields look as before, and the expense amount stays left to right
    tier: secondary
    legacy: [MUT-109]
    steps:
      - Log an overdue entry, turn on Expenses and switch to Arabic
      - Open the income drawer, the payment drawer and a new expense
    expect:
      - The currency and amount groups read left to right with the amount on the left, as before
      - The expense amount is left to right and sits on the right
  - id: english
    title: In English, amounts and fields are unchanged, and the Arabic business name is typed right to left
    tier: secondary
    legacy: [MUT-109]
    steps:
      - Log an overdue entry in English
      - Read Home's amount and the income drawer, then open Settings › + Add Profile
    expect:
      - The amount reads $1,200 left to right and the amount field is unchanged
      - The Arabic business name field is right to left
