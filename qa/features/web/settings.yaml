app: web
area: settings
title: Settings
tier: secondary
paths:
  - src/pages/settings/SettingsPage.tsx
  - src/lib/i18n/**
  - src/lib/theme/**
features:
  - id: language
    title: Switch language to Arabic (RTL) and back to English
    tier: secondary
    steps:
      - Open Settings
      - Click العربية, then English
    expect:
      - html's lang/dir switch to ar/rtl, then back to en/ltr
      - No accessibility violations, colour contrast included (MUT-102)
  - id: theme
    title: Switch between Dark, Light and System themes
    tier: secondary
    steps:
      - Click Dark, then Light, then System
    expect:
      - html's data-theme follows the choice, and System removes the attribute
  - id: export
    title: Your data exports one business
    tier: secondary
    paths:
      - src/pages/settings/YourDataSection.tsx
      - src/components/modals/ExportDataModal.tsx
    steps:
      - Open Export a business
      - Export the default profile
    expect:
      - A CSV download starts, named mutaba3a-Default-Profile-<date>.csv
  - id: malafat
    title: Settings offers Malafat to law firms and accounting offices, and after a second business is added says so once; a switch turns the suggestions off (MUT-190)
    tier: secondary
    legacy: [MUT-190]
    paths:
      - src/pages/settings/MalafatEntry.tsx
      - src/pages/settings/MalafatEntry.css
      - src/components/malafat/**
      - src/lib/malafatSuggestions.ts
      - src/lib/useMalafatSuggestions.ts
      - src/lib/malafatMomentStore.ts
      - src/components/drawers/BusinessProfileDrawer.tsx
      - src/lib/malafatBusinessAdded.ts
      - src/components/layout/GoHostedCard.tsx
    steps:
      - Open Settings, read the MTB3A + Malafat row, add a second business, read the note, dismiss it, reload, switch the suggestions off
    expect:
      - The row has one link to Malafat's contact page tagged web-local and settings
      - After the second business, the row's line becomes a note with one link tagged business-profile, and the Go hosted card steps aside
      - Dismissing it brings the row's own line back with focus on its link, and the dismissal is saved (no second-business card on Clients after a reload)
      - In Arabic the row reads right to left and links to Malafat in Arabic
      - The switch turns suggestions off and stays off after a reload; the row stays
  - id: arabic-default
    title: In an English browser where nobody chose a language, the web app opens in Arabic; choosing English in Settings sticks (MUT-209)
    tier: secondary
    legacy: [MUT-209]
    paths:
      - src/main.tsx
      - src/lib/i18n/context.tsx
      - src/lib/i18n/core.tsx
    steps:
      - With an English browser and nothing chosen, open the web app, skip the welcome, choose English in Settings, reload
    expect:
      - The app and its welcome open in Arabic, right to left
      - English applies at once and stays after a reload

