app: web
area: settings
title: Settings
tier: secondary
paths:
  - src/pages/settings/SettingsPage.tsx
  - src/lib/i18n/**
  - src/lib/theme/**
features:
  - id: language
    title: Switch language to Arabic (RTL) and back to English
    tier: secondary
    steps:
      - Open Settings
      - Click العربية, then English
    expect:
      - html's lang/dir switch to ar/rtl, then back to en/ltr
      - No accessibility violations, colour contrast included (MUT-102)
  - id: theme
    title: Switch between Dark, Light and System themes
    tier: secondary
    steps:
      - Click Dark, then Light, then System
    expect:
      - html's data-theme follows the choice, and System removes the attribute
  - id: export
    title: Your data exports one business
    tier: secondary
    paths:
      - src/pages/settings/YourDataSection.tsx
      - src/components/modals/ExportDataModal.tsx
    steps:
      - Open Export a business
      - Export the default profile
    expect:
      - A CSV download starts, named mutaba3a-Default-Profile-<date>.csv
