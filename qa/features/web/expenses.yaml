app: web
area: expenses
title: Expenses
tier: secondary
# Expenses is an optional area (ADR-032): off on a fresh install, turned on in Settings → Advanced features
paths:
  - src/pages/expenses/**
  - src/components/drawers/ExpenseDrawer.tsx
  - src/components/drawers/expenseDrawerFormSchema.ts
  - src/components/expenses/ExpenseFormFields.tsx
  - src/components/expenses/expenseFormSchema.ts
  - src/hooks/useExpenseQueries.ts
  - src/db/expenseRepository.ts
  - src/db/defaultExpenseCategories.ts
  # Every spec here turns Expenses on through it (support/app.ts enableOptionalArea)
  - src/pages/settings/AdvancedFeaturesSection.tsx
features:
  - id: log-expense
    title: Log two expenses from the same vendor; the second reuses the vendor the first created
    tier: secondary
    paths:
      - src/components/ui/VendorTypeahead.tsx
      - src/lib/vendorNormalization.ts
    steps:
      - Turn on Expenses in Settings → Advanced features
      - Open Expenses from the sidebar
      - Click Add Expense, fill amount, title, a new vendor ("Hetzner Online GmbH") and a category, save
      - Open a new expense from + Add, type the same vendor in lower case
      - Pick the existing vendor the list offers, fill amount, title and category, save
      - Switch to the By Category view
    expect:
      - Both expenses are in the ledger with their amounts, and Total Expenses sums them
      - The new vendor is saved under its canonical name, the company suffix dropped ("Hetzner Online")
      - The second time, the vendor list offers that vendor and no "Create new" option, and picking it fills its saved name
      - By Category groups each expense under its category
  - id: edit-delete
    title: Edit an expense from its row, then delete it from the drawer
    tier: secondary
    steps:
      - Turn on Expenses and log one expense
      - Click its row in the ledger
      - Change the amount and save
      - Click the row again, Delete, confirm
    expect:
      - The Edit Expense drawer opens filled with the expense
      - The row shows the new amount
      - After deleting, "Expense deleted successfully" shows and the ledger is empty
  - id: recurring-mark-paid
    title: A recurring expense with missed months shows in Needs Attention and Mark paid records each month
    tier: secondary
    paths:
      - src/components/expenses/RecurringAttentionList.tsx
      - src/components/expenses/RecurringAttentionList.css
      - src/components/expenses/recurringAttention.ts
      - src/components/drawers/RecurringMarkPaidDrawer.tsx
      - src/components/drawers/RecurringMarkPaidDrawer.css
      - src/services/recurringExpenseService.ts
      - src/hooks/useRecurringExpenseQueries.ts
    steps:
      - Turn on Expenses
      - New Expense → Recurring, monthly, starting the 1st two months ago, no end
      - Look at Needs Attention on the Expenses page
      - Click Mark Paid, keep all three months checked, Mark 3 paid
    expect:
      - Needs Attention has one row for the rule — "$80 monthly", three months not marked, $240
      - The drawer lists the three missed months
      - Needs Attention is gone and this month's payment is in the ledger, badged Recurring
  - id: recurring-long-missed
    title: A recurring expense missed for eight months shows every month in Needs Attention, counted from where it started (MUT-96)
    tier: tertiary
    paths:
      - src/components/expenses/RecurringAttentionList.tsx
      - src/components/expenses/recurringAttention.ts
      - src/services/recurringExpenseService.ts
    steps:
      - Turn on Expenses
      - New Expense → Recurring, monthly, starting the 1st eight months ago, no end
      - Look at Needs Attention on the Expenses page
    expect:
      - The row says "9 payments since <month> not marked" for the start month, and totals $720
      - Mark Paid lists all nine months
  - id: recurring-skip-snooze
    title: Skip one missed month and snooze the other; the snoozed one moves to Upcoming Expenses
    tier: tertiary
    paths:
      - src/components/expenses/RecurringAttentionList.tsx
      - src/components/expenses/RecurringAttentionList.css
      - src/components/expenses/recurringAttention.ts
      - src/components/drawers/RecurringMarkPaidDrawer.tsx
      - src/components/drawers/RecurringMarkPaidDrawer.css
      - src/services/recurringExpenseService.ts
      - src/hooks/useRecurringExpenseQueries.ts
      - src/components/ui/RecurringOccurrenceCard.tsx
      - src/components/ui/RecurringOccurrenceCard.css
    steps:
      - Turn on Expenses and add a monthly recurring expense starting the 1st of last month
      - Open Mark Paid on its Needs Attention row
      - Skip last month and confirm
      - Snooze this month, pick "in 7 days", Snooze
      - Expand Upcoming Expenses
    expect:
      - Needs Attention is gone
      - Upcoming Expenses (1) lists the rule as "Snoozed until …"
  - id: legacy-edit
    title: An expense restored from a pre-MUT-14 backup opens in the legacy expense drawer from its project and saves
    tier: tertiary
    paths:
      - src/components/drawers/LegacyExpenseEditDrawer.tsx
    steps:
      - Restore a backup (Settings › Your data › Restore…) holding a project with an old expense transaction
      - Open the project, Transactions tab
      - Click the expense row, change the amount, save
    expect:
      - The Edit Expense drawer opens filled with the old expense
      - The project's Transactions tab shows the new amount
