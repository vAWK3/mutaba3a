app: web
area: conversions
title: Currency conversions and exchange rates
tier: secondary
paths:
  - src/pages/conversions/ConversionsPage.tsx
  - src/components/drawers/ConversionDrawer.tsx
  - src/components/drawers/conversionFormSchema.ts
  - src/hooks/useConversionQueries.ts
features:
  - id: log
    title: Turn on Currency conversions and log a conversion with its implied rate (MUT-141)
    tier: secondary
    legacy: [MUT-141]
    steps:
      - Turn on Currency conversions in Settings › Features
      - Open Conversions from the sidebar
      - From + Add › Conversion, enter 1,000 USD to 3,650 ILS
      - Read the rate, add a note, save
    expect:
      - The drawer shows "Rate: 1 USD = 3.6500 ILS" as you type
      - Without a reload, the Conversions list shows $1,000 → ₪3,650 at 3.6500 with the note
  - id: validation
    title: A conversion needs both amounts and two different currencies
    tier: tertiary
    steps:
      - Open Log Conversion and save with both amounts empty
      - Fill both amounts with USD on both sides and save
      - Pick EUR as the to-currency and save
    expect:
      - '"Amount is required" shows under both amounts'
      - '"Choose a different currency to convert to" shows and the drawer stays open'
      - With EUR the rate reads "1 USD = 1.0000 EUR" and the drawer saves and closes
  - id: edit-delete
    title: Edit a conversion's amount, then delete it
    tier: tertiary
    steps:
      - Log a conversion of 500 USD to 1,800 ILS
      - Click its row, change the to-amount to 1,850, save
      - Click its row again, Delete, confirm
    expect:
      - The edit drawer opens with the saved amounts, and the rate updates to 3.7000
      - Without a reload, the row shows ₪1,850 at 3.7000
      - After deleting, a "Conversion deleted" toast shows and the list is empty again
  - id: fx-rate
    title: The top bar shows the live exchange rate, and a dollar amount shows its shekel equivalent
    tier: secondary
    paths:
      - src/lib/fx/fxService.ts
      - src/lib/fx/index.ts
      - src/hooks/useFxRate.ts
      - src/components/ui/AmountWithConversion.tsx
    steps:
      - With Frankfurter answering 1 USD = 3.70 ILS and 1 EUR = 4.00 ILS, open a fresh install
      - Read the exchange rate in the top bar and open it
      - Log $1,000 of work and hover its amount in the Income list
    expect:
      - The top bar reads "$1 = ₪3.70"; its panel lists $1 = ₪3.7000 and €1 = ₪4.0000, both Live, with the rates' date
      - The amount's tooltip reads "≈ ₪3,700 ($1 = 3.70 ₪, Live)"
