app: web
area: landing
title: Landing page
tier: secondary
paths:
  - src/pages/landing/**
  - src/content/download-config.ts
  - src/content/malafatLinks.ts
  - src/lib/goHosted.ts
  - src/hooks/**
  # The website's own shell (MUT-445: the free web app that shared it is retired)
  - src/lib/i18n/**
  - src/lib/theme/**
  - src/lib/{appVersion,dates,utils}.ts
  - src/components/ui/{ErrorBoundary,Input}.*
features:
  - id: header-cta
    title: The header button appears only once the hero button has scrolled away, and goes to the same place (MUT-77)
    tier: secondary
    legacy: [MUT-77]
    steps:
      - Open the landing page and scroll past the hero
    expect:
      - The sticky bar's button fades in and opens the same place as the hero's button
  - id: transparency
    title: The bar is frosted by default and solid when reduced transparency is asked for (MUT-77)
    tier: secondary
    legacy: [MUT-77]
    steps:
      - Open the landing page, then ask the OS for reduced transparency
    expect:
      - The bar is frosted, then solid
  - id: press
    title: Every landing button gives press feedback, and nothing scales under reduced motion (MUT-77)
    tier: secondary
    legacy: [MUT-77]
    steps:
      - Hold the hero button, the language switch, a Get it card and the bar's button; repeat under reduced motion
    expect:
      - Each presses to the brand scale; FAQ rows dim; nothing scales under reduced motion
  - id: hover-light
    title: Hovering a landing control in OS light mode keeps its label colour and readable
    tier: secondary
    steps:
      - In OS light mode, hover the hero button, the wordmark, a Get it card and the bar's button
    expect:
      - Labels keep their colour, no underline appears, the hero button stays at least 4.5:1
  - id: "375"
    title: At 320 and 375 px in English and Arabic the bar fits and overlaps nothing (MUT-77, MUT-231)
    tier: secondary
    legacy: [MUT-77, MUT-231]
    steps:
      - Open the landing page at 375 px wide, then 320, in English then Arabic
      - Scroll past the hero's button
    expect:
      - The wordmark is not clipped and does not overlap the actions; 44 px tap targets
      - Sign in shows at the top; once scrolled, the bar's button takes its place
  - id: title
    title: The tab title follows the language
    tier: tertiary
    steps:
      - Open the landing page and switch the language
    expect:
      - The document title changes with the language
  - id: reveal
    title: Chapter visuals rise in once on scroll, and are simply there under reduced motion (MUT-77)
    tier: secondary
    legacy: [MUT-77]
    steps:
      - Scroll through the chapters; repeat under reduced motion
    expect:
      - Visuals rise in once; under reduced motion they are already in place
  - id: privacy-bar
    title: The privacy policy has the bar without the button, and its wordmark goes home
    tier: secondary
    paths:
      - src/pages/landing/PrivacyPolicyPage.tsx
    steps:
      - Open /privacy
    expect:
      - The landing bar shows without the button; the wordmark links home
  - id: retired-paths
    title: Old /app and /download links land on the home page; the free web app and the desktop apps are retired (MUT-445, MUT-382)
    tier: secondary
    paths:
      - src/main.tsx
      - netlify.toml
      - public/sw.js
    steps:
      - Open /app, then /app/clients?client=c1, then /download
    expect:
      - Each lands on the home page with the hero showing
  - id: get-it-form
    title: Get MTB3A puts the request card first and takes a request through every state, two fields a row on desktop (MUT-186, redesign 2026-10-25)
    tier: secondary
    legacy: [MUT-186]
    paths:
      - src/pages/landing/components/GetItSection.tsx
      - src/pages/landing/components/HostedRequestForm.tsx
      - src/pages/landing/hostedRequest.ts
      - src/pages/landing/LandingPage.css
    steps:
      - Open the landing page in English, scroll to Get MTB3A, in light and dark
      - Press Send request with nothing filled in
      - Fill in a name and email and send while the server fails
      - Press Try again once the server answers
    expect:
      - The request card comes before sign-in and the app tiles; name and email share a row; the device chooser has no box around it; axe is clean
      - Both errors show and the name is focused; the failure alert shows beside Try again with the answers kept
      - The card confirms with the visitor's own email, focused, and one request carries form-name hosted-request in English
  - id: get-it-375
    title: At 375 px in Arabic Get MTB3A fits, one field a row, with 44 px device pills, a full-width send and stacked app tiles
    tier: secondary
    paths:
      - src/pages/landing/components/PlatformIcons.tsx
    steps:
      - Open the landing page in Arabic at 375 px wide and scroll to the request card
    expect:
      - No horizontal overflow; fields stack; device pills and the send button are at least 44 px; the send spans the form; app tiles stack
  - id: phone
    title: The phone chapter says the phone logs and the hosted account shows, and names each phone app from its config (MUT-173)
    tier: secondary
    legacy: [MUT-173]
    steps:
      - Open the landing page, scroll past Get MTB3A to the phone chapter, read it and the two platform lines, press "See hosted accounts"; same in Arabic, also at 375 px
    expect:
      - The chapter says the phone app is for logging and the portal, your hosted account in a browser, is where you see every client, what they owe and what they paid; it claims no reports
      - Today both iPhone and Android link to their store listings, carrying the landing's campaign; a platform without a configured listing is named with "with your hosted account" or says "coming soon" instead, and a store link presses and keeps its colour like every landing control
      - The laptop-and-phone picture stays whole, also on a phone; the underlined link opens /hosted
  - id: malafat
    title: The Malafat band tells law firms and accounting offices that MTB3A connects to Malafat, and links to Malafat in the page's language (MUT-174)
    tier: secondary
    legacy: [MUT-174]
    steps:
      - Open the landing page, scroll past the phone chapter to the dark Malafat band, read it, hover and tab to "See Malafat"; same in Arabic, also at 375 px
    expect:
      - The band speaks to law firms and accounting offices on Malafat (both named in Arabic too), ties the payment claim to a hosted account linked to the firm's Malafat and the phone app, and claims nothing automatic, no sync and no reports
      - The link reads at least 4.5:1 on the band, keeps its colour on hover, shows a ring in its own colour on keyboard focus in light and dark, and points at malafat.app in the page's language with Mutaba3a's referral tags in a new tab, which its accessible name announces
  - id: arabic-default
    title: In an English browser with no stored choice, the marketing site opens in Arabic, and a chosen language sticks (MUT-202)
    tier: secondary
    legacy: [MUT-202]
    paths:
      - src/lib/i18n/context.tsx
    steps:
      - With an English browser and nothing chosen, open /, /privacy and /terms; come back and press EN, then reload
    expect:
      - Every marketing page is in Arabic, right to left, and no language is stored
      - Pressing EN switches to English, stores it, and it stays English after a reload
  - id: arabic-day-counts
    title: "The landing page's Clients and client-profile mocks word their overdue ages correctly in Arabic (MUT-179)"
    tier: secondary
    legacy: [MUT-179]
    paths:
      - src/pages/landing/components/mocks/**
    steps:
      - Open the landing page in Arabic, its default, and scroll to the Clients and client-profile pictures
    expect:
      - 'The ages read "الأقدم 3 أيام", "الأقدم 227 يومًا", "الأقدم 158 يومًا" and "متأخر 34 يومًا"; no count above 2 is followed by a bare "يوم"'
  - id: currencies
    title: The FAQ lists the four currencies, ILS, USD, EUR and JOD, and no Gulf currency, in English and Arabic (MUT-388)
    tier: secondary
    tickets: [MUT-388]
    paths:
      - src/pages/landing/landingCopy.ts
      - src/pages/landing/components/FAQSection.tsx
    steps:
      - Open the landing page in English and open "Which currencies does it support?"
      - Switch to Arabic and open "ما العملات المدعومة؟"
    expect:
      - The English answer names US dollars, shekels, euros and Jordanian dinars, and no dirham or riyal
      - The Arabic answer names الدولار الأمريكي والشيكل واليورو والدينار الأردني, and no درهم or ريال
  - id: signup-open
    title: While the portal says signup is open, the landing leads with "Create an account" on the portal's /signup in the page language, and keeps the request form for those who want help (MUT-369)
    tier: secondary
    tickets: [MUT-369]
    paths:
      - src/pages/landing/signupDoor.ts
      - src/pages/landing/LandingPage.tsx
      - src/pages/landing/components/HeroSection.tsx
      - src/pages/landing/components/LandingHeader.tsx
      - src/pages/landing/components/GetItSection.tsx
      - src/pages/landing/components/PhoneSection.tsx
      - src/pages/landing/components/FAQSection.tsx
    steps:
      - With sign-up open, open the landing page in Arabic, its default, and look at the hero and Get it
      - Switch to English, scroll to Get MTB3A, the phone chapter and the free-plan question
      - Press "Create an account"
    expect:
      - The hero, the bar's button, Get it's first option and the phone chapter all say «أنشئ حسابًا» / "Create an account" and link the portal's /signup with ?lang=ar, then ?lang=en after the switch
      - Get it keeps the request form under "Want us to set it up for you?"; no line says there's no public sign-up, and no price or checkout appears
      - Pressing it opens the portal's /signup?lang=en in a new tab
  - id: signup-closed
    title: While signup is closed, or the portal can't be asked, the landing is exactly as before, with "Request an account" (MUT-369)
    tier: secondary
    tickets: [MUT-369]
    paths:
      - src/pages/landing/signupDoor.ts
    steps:
      - With sign-up closed, open the landing page in English
      - Again with the portal unreachable
    expect:
      - The hero's "Request an account" scrolls to the request form; the hero says there's no public sign-up; nothing says "Create an account"
