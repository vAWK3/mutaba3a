app: web
area: legal
title: Terms of service and the privacy policy's hosted-accounts section
tier: secondary
paths:
  - src/pages/landing/TermsPage.tsx
  - src/pages/landing/LegalPage.tsx
  - src/content/legal/**
  - src/lib/i18n/linkLanguage.ts
features:
  - id: terms-page
    title: /terms shows the latest frozen terms in Arabic and English, every released version keeps its own address, and an unknown version says so (MUT-324)
    tier: secondary
    legacy: [MUT-324]
    steps:
      - Open /terms in English, then in Arabic, on a desktop window and at phone width
      - Open /terms/2026-10-19
      - Open /terms/2001-01-01
    expect:
      - Every section of the terms shows with its version line; the governing-law section says the English text prevails
      - The Arabic page reads right to left, and nothing scrolls sideways at 375px
      - The version's own address shows the same text
      - An unknown version says it doesn't exist and links to the current terms
  - id: terms-linked-language
    title: A portal link (/terms/<version>?lang=en|ar) opens the terms in the language the portal records, without changing the site's language (MUT-324 review fix 1)
    tier: secondary
    legacy: [MUT-324]
    steps:
      - With the site in Arabic, open /terms/2026-10-19?lang=en
      - Then open /terms with no language in the address
    expect:
      - The English text shows, reading left to right
      - Without ?lang the site is still in Arabic
  - id: privacy-linked-language
    title: A link from the phone or the portal (/privacy?lang=en|ar) opens the privacy policy in that language, without changing the site's language (MUT-356)
    tier: secondary
    legacy: [MUT-356]
    paths:
      - src/pages/landing/PrivacyPolicyPage.tsx
      - src/lib/i18n/context.tsx
    steps:
      - With the site in Arabic, open /privacy?lang=en
      - Then open /privacy with no language in the address
      - With the site in English, open /privacy?lang=ar
      - Open /privacy?lang=fr
    expect:
      - The English policy shows, reading left to right
      - Without ?lang the site is still in Arabic
      - The Arabic policy shows, reading right to left, and the site stays in English
      - An unknown language shows the site's own language
  - id: privacy-error-reports
    title: The privacy policy says the website, our servers, the hosted portal and the phone apps send error reports, what a report holds, that Sentry keeps them in the EU, and that our own logs hold no IP address (MUT-148, MUT-149, MUT-150, MUT-151, MUT-382, ADR-091)
    tier: secondary
    legacy: [MUT-148, MUT-149, MUT-150, MUT-151]
    paths:
      - src/pages/landing/PrivacyPolicyPage.tsx
      - src/lib/i18n/translations/en/landing.json
      - src/lib/i18n/translations/ar/landing.json
    steps:
      - Open the privacy policy in English, then in Arabic
    expect:
      - An "Error reports" section follows "Anonymous usage counts" and says amounts, names, notes, contact details, request contents, the IP address and anything typed are removed before a report is sent
      - It says the website (when a page crashes or hits an error, with no account), our servers, the hosted portal (when a page crashes), the iPhone and Android apps, and the iPhone app's share extension, widgets and Siri shortcuts send reports, and that the apps never attach screenshots
      - '"What reaches the network" says the mobile apps connect to Sentry for error reports, and the hosted portal sends its error reports to Sentry'
      - '"No ads, no tracking" no longer says the apps use no crash reporting, names no free apps, and says our own log lines never include the IP address'
      - '"Who else handles your data" names Sentry, hosted in the EU'
      - The Arabic page says the same, right to left
  - id: links
    title: The terms are linked from the landing footer and under the /hosted request form, and the privacy policy explains hosted accounts (MUT-324)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/pages/landing/PrivacyPolicyPage.tsx
      - src/pages/landing/components/LandingFooter.tsx
      - src/pages/landing/components/HostedRequestForm.tsx
    steps:
      - Open the landing page and the privacy policy
      - Open /hosted
    expect:
      - The footer links Terms to /terms
      - The request form's notice links the terms of service
      - The privacy policy has a hosted-accounts section naming me-west1, 14-day backups with recovery to any moment in the last 7 days, Sentry and PostHog in the EU, and deletion after 30 days
  - id: terms-manifest
    title: The website publishes /legal/terms-versions.json, the list the server release checks before naming a new version (MUT-324 D11)
    tier: secondary
    legacy: [MUT-324]
    paths:
      - src/content/legal/termsManifest.ts
      - vite.config.ts
    steps:
      - Fetch /legal/terms-versions.json from the website
    expect:
      - It lists 2026-10-19 with a sha256 for the English and the Arabic text
  - id: privacy-signup
    title: The privacy policy says what self-service signup and account emails involve, naming Cloudflare Turnstile, the DNS and RDAP domain lookup and Resend, in English and Arabic (MUT-369, draft pending Basel's approval)
    tier: secondary
    tickets: [MUT-369]
    paths:
      - src/pages/landing/PrivacyPolicyPage.tsx
    steps:
      - Open /privacy in English and read "When you create an account" and "Emails we send"
      - Open it in Arabic and read «عند إنشاء حساب» and «الرسائل التي نرسلها»
    expect:
      - Both sections follow "Where your records live"; they name Cloudflare Turnstile, public DNS records, RDAP and Resend, and say only the domain is sent and Resend's records sit in the United States
      - The Arabic page reads right to left with the same sections, and the English page says MTB3A, never Mutaba3a
