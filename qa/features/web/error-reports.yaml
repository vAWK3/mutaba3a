app: web
area: error-reports
title: The website's error reports (Sentry), and the free web app sending none
tier: secondary
paths:
  - src/pages/landing/observability/**
  - src/pages/landing/afterLoadIdle.ts
  - src/pages/landing/marketingPath.ts
  - src/lib/observability/**
features:
  - id: landing-crash-reported
    title: An error on the home page sends one report with the landing surface, the route, the language and no account (MUT-150)
    tier: secondary
    legacy: [MUT-150]
    paths:
      - src/main.tsx
    steps:
      - Open the home page in English
      - Something on the page throws an error nobody catches
    expect:
      - Exactly one report reaches Sentry, tagged landing, route /, English
      - It carries no user, and the page address has no query string
  - id: landing-crash-reported-ar
    title: An error on the Arabic privacy page is reported with the Arabic language (MUT-150)
    tier: tertiary
    legacy: [MUT-150]
    steps:
      - Open the privacy policy in Arabic
      - Something on the page throws an error nobody catches
    expect:
      - One report, tagged Arabic and route /privacy
  - id: terms-covered
    title: Errors on a frozen terms version are reported; the version never appears in the route (MUT-150; the download page went in MUT-382)
    tier: tertiary
    legacy: [MUT-150]
    steps:
      - Open /terms/2026-10-19; something throws
    expect:
      - One report with route /terms/:version
  - id: landing-crash-screen
    title: A website page that can't load shows its own screen in the visitor's language and reports once (MUT-150)
    tier: secondary
    legacy: [MUT-150]
    paths:
      - src/pages/landing/observability/LandingCrashScreen.tsx
    steps:
      - Open the home page while its code can't be downloaded
    expect:
      - The website's crash screen shows in Arabic, with a reload button and nothing about "your data"
      - One report reaches Sentry, tagged landing and route /
