# tertiary by default here, so these only run when directly touched (project default: directOnly ['tertiary'])
app: web
area: drawer-motion
title: Drawer motion
tier: tertiary
paths:
  - src/components/drawers/Drawer.tsx
  - src/lib/motion/**
features:
  - id: escape-exit
    title: Escape closes a drawer at once, and its exit snapshot slides out to the trailing edge
    tier: tertiary
    legacy: [MUT-80]
    steps:
      - Open the New Income drawer
      - Press Escape
    expect:
      - The dialog is gone immediately
      - The exit snapshot slides past 400px before being removed
  - id: drag-dismiss
    title: Dragging a drawer past half its width closes it; a shorter drag springs back
    tier: tertiary
    steps:
      - Open the New Income drawer
      - Drag the title by 120px and release
      - Drag the title by 320px and release
    expect:
      - The 120px drag springs back and the drawer stays open
      - The 320px drag closes the drawer
  - id: rtl-mirror
    title: In Arabic the drawer opens from the left, and a leftward drag closes it
    tier: tertiary
    paths:
      - src/lib/i18n/**
    steps:
      - Switch language to Arabic
      - Open the New Income drawer
      - Drag the title left
    expect:
      - The drawer sits flush left (x = 0)
      - The leftward drag closes it
