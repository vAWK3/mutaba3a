app: web
area: clients
title: Clients
tier: core
paths:
  - src/pages/clients/**
  - src/components/clients/**
features:
  - id: owed-now-parity
    title: "The Clients strip's Owed Now equals Home's, including a No client row (MUT-83)"
    tier: core
    legacy: [MUT-83]
    steps:
      - Log one income entry for a client and one with no client
      - Open Home and read Owed Now
      - Open Clients, read Owed Now and find the "No client · 1 entry" row
    expect:
      - Both totals are equal
      - '"No client" makes up the difference'
      - No accessibility violations, colour contrast included (MUT-102)
  - id: no-client-filter
    title: 'The "No client" row opens Income filtered to entries with no client, with a clearable chip'
    tier: secondary
    steps:
      - Click the "No client" row on Clients
      - Clear the filter chip
    expect:
      - Income is filtered to the one entry (the URL carries client=none)
      - Clearing the chip removes the filter
  - id: profile
    title: A client's profile shows their logged work
    tier: core
    steps:
      - Open a client from the Clients list
    expect:
      - '"Work and billing" is visible'
      - The logged entry's title and amount are shown
      - No accessibility violations, colour contrast included (MUT-102)
  - id: split-view
    title: "On a wide window a client opens beside the list, and the arrow keys walk the clients (MUT-84)"
    tier: secondary
    paths:
      - src/hooks/useMediaQuery.ts
      - src/lib/breakpoints.ts
    legacy: [MUT-84]
    steps:
      - Log three clients and open Clients at 1280 px
      - Click Cedar Co
      - Press ↓, then ↑
      - Press Enter, then Escape
      - Press →, then ←
      - Check accessibility with both panes showing
      - Go Back
    expect:
      - The profile opens beside the list; the open client's link is the current page and the top bar names it
      - ↓/↑ open the next/previous client, with the URL, the focus and aria-current following
      - The status line says "Showing Beta Labs" after the walk
      - Enter and → move focus into the profile; Escape and ← return it to the open client's row
      - No accessibility violations, colour contrast included (MUT-102)
      - Back returns to the full list, not to the previous client
  - id: split-view-deep-link
    title: A deep link to a client with a sort opens both panes, sorted, and the walk keeps the sort (MUT-84)
    tier: secondary
    paths:
      - src/components/clients/clientsSearch.ts
      - src/components/clients/useClientsSearch.ts
    legacy: [MUT-84]
    steps:
      - Open /clients/<Beta Labs>?sort=name&dir=asc
      - Focus Beta Labs in the list and press ↓
    expect:
      - Both panes show, the list sorted by name, Beta Labs marked as the current page
      - Nothing is announced for the client the page opened on
      - ↓ opens Cedar Co (next by name) and the URL keeps sort=name&dir=asc
  - id: split-view-resize
    title: Resizing across the breakpoint keeps the open profile as it was (MUT-84)
    tier: tertiary
    paths:
      - src/pages/clients/ClientsLayout.tsx
      - src/pages/clients/ClientsLayout.css
      - src/components/clients/clientsSplitView.ts
      - src/hooks/useMediaQuery.ts
      - src/lib/breakpoints.ts
    legacy: [MUT-84]
    steps:
      - Open a client beside the list and type "Logo" in its Work search
      - Narrow the window to 375 px
      - Widen it back to 1280 px
    expect:
      - At 375 px the profile fills the page and the list is hidden
      - At 1280 px the list returns beside it
      - The typed search is kept throughout (the profile never remounts)
  - id: split-view-rtl
    title: In Arabic the list sits on the right and ← moves into the profile (MUT-84)
    tier: tertiary
    paths:
      - src/pages/clients/ClientsLayout.tsx
      - src/pages/clients/ClientsLayout.css
      - src/components/clients/clientsSplitView.ts
    legacy: [MUT-84]
    steps:
      - Switch to Arabic in Settings, open Clients and click a client
      - Press ←, then →
    expect:
      - The list column is to the right of the profile
      - ← moves focus into the profile; → returns it to the open client's row
  - id: malafat
    title: With a second business, the Clients list shows one Malafat suggestion; its link opens Malafat and retires it for good (MUT-190)
    tier: secondary
    legacy: [MUT-190]
    paths:
      - src/pages/clients/MalafatClientsSuggestion.tsx
    steps:
      - With two businesses and a client, open Clients, read the suggestion, search, follow its link, reload
    expect:
      - One card for law firms and accounting offices with a link tagged web-local and second-business; none while searching
      - The link opens Malafat's contact page in a new tab; the card goes and stays gone after a reload

