app: portal-selfservice
area: operator
title: Operator console (signup reviews, accounts, billing, flags, firm requests)
tier: secondary
# MUT-460 (ADR-213): the operator reviews waiting signups in the portal instead of the CLI, against the live dev API's
# real operator gate and passkey step-up (MUT-459). Chromium's virtual authenticator answers the passkey sheet
# (support/passkeys.ts); waiting signups are made as /signup and /setup make them (support/selfService.ts pendingSignup).
# MUT-461 adds Accounts: find an account by email and act on it (sign out everywhere, disable/enable, a reset link).
# MUT-462 adds billing grants and feature flags on the account page, and the Firms tab (enable or decline a request).
# MUT-527 makes Accounts a list (search as you type), lets you switch your own features, and adds Your settings. The
# no-passkey note can't be reached live (an operator must hold a passkey, MUT-459 D7); component tests cover it.
# Only a profile's owner can ask for firm features, so a live request is an owned Business profile's; an operator-made
# firm's request (the one whose owners the operator chooses) is marked in the QA database (support/selfService.ts).
paths:
  - src/hosted/pages/operator/**
  - src/hosted/operator/**
  - src/hosted/data/operatorQueries.ts
  - src/hosted/data/signupReviews.ts
  - server/src/operator/**
  - server/src/routes/operator.ts
  - server/src/auth/operator-gate.ts
  - server/src/auth/step-up.ts
  - server/src/email/review-digest.ts
  - server/src/routes/admin-billing.ts
  - server/src/routes/admin.ts
  - server/src/routes/admin-users.ts
  - src/hosted/components/YouRows.tsx
  - src/hosted/data/operatorUsageQueries.ts
  - server/src/routes/operator-usage.ts
features:
  - id: signups-approve
    title: From the digest mail, sign in with a passkey and approve a waiting signup
    tickets: [MUT-460]
    tier: core
    paths:
      - src/hosted/pages/auth/SignInPage.tsx
      - server/src/email/templates/copy.ts
    steps:
      - Someone signs up with an @gmail.com address and finishes setting a password
      - Open the "Review signups" link in the operator's digest mail while signed out
      - Sign in with the passkey, which the sign-in page offers first
      - Find the signup in the list, press Approve and confirm
    expect:
      - The signup is listed with its wait and a Webmail chip
      - The confirm says "‹email› can sign in. We'll email them now."
      - '"‹email› approved · email sent", the row leaves the list, and no second passkey prompt was needed'
      - The person gets the "your account is ready" mail and can sign in
  - id: signups-decline
    title: Decline a waiting signup, in Arabic on a 375 px phone
    tickets: [MUT-460]
    steps:
      - Sign in with the password on a 375 px phone in Arabic
      - Find the signup, press رفض and confirm with the passkey
    expect:
      - The confirm says the account will be deleted and they can sign up again
      - The toast says the signup was declined and the mail went
      - The person gets the decline mail and can no longer sign in
      - The page reads right to left with no sideways scroll
  - id: step-up-passkey
    title: A stale step-up asks for the passkey on the same tap; cancelling it changes nothing
    tickets: [MUT-460]
    paths:
      - src/hosted/passkeys/webauthn.ts
    steps:
      - Sign in with the password (no passkey step-up yet)
      - Press Approve on a waiting signup
      - Dismiss the passkey sheet, then press Approve with passkey again and confirm on the device
    expect:
      - The confirm button reads "Approve with passkey"
      - Dismissing the sheet leaves the confirm as it was, with no message and nothing approved
      - Confirming on the device approves the signup
  - id: hidden-for-non-operator
    title: Someone who isn't an operator never sees the console
    tickets: [MUT-460]
    paths:
      - src/hosted/pages/you/YouAccount.tsx
      - src/hosted/router.tsx
      - src/hosted/session/features.ts
    steps:
      - Sign in as someone who isn't an operator
      - Look at You › Account, then open /operator/signups directly
    expect:
      - You › Account has no Operator row
      - /operator/signups goes to Home, and the server refuses the list with 404
  - id: account-find
    title: Opening Accounts lists every account; search narrows it, and says so when nothing matches
    tickets: [MUT-461, MUT-527]
    paths:
      - src/hosted/pages/operator/OperatorAccountsPage.tsx
      - src/hosted/pages/operator/AccountStatusBadge.tsx
      - src/hosted/pages/operator/OperatorLayout.tsx
      - src/hosted/router.tsx
      - src/hosted/api/client.ts
      - server/src/operator/account-list.ts
    steps:
      - Open the Accounts tab of the operator console, with no search
      - Type an address no account has
      - Type part of a person's address in capitals, then open their row
    expect:
      - The list shows every account without a search, newest sign-in first, each with its status chip and last sign-in; the operator's own row has the Operator chip
      - Nothing matching says "No account matches “…”", and the query stays in the URL
      - The person's row shows them with an Active chip; their account page shows the address, Active, the last sign-in and whether they have a passkey, the Access rows with how many devices each would end, and their personal profile with its billing
  # MUT-527 (Basel 2026-10-31): the list, your own features, feature names, and Your settings.
  - id: account-search-arabic
    title: Searching "basel" finds every account with it in the email or name, in Arabic on a 375 px phone
    tickets: [MUT-527]
    paths:
      - src/hosted/pages/operator/OperatorAccountsPage.tsx
      - src/hosted/data/operatorQueries.ts
      - src/hosted/hosted.css
    steps:
      - Two people exist, one with basel in the email, one with Basel in the name; a third has neither
      - On a 375 px phone in Arabic, open الحسابات and type basel
    expect:
      - Both people are listed and the third is not; the addresses read left to right
      - The page reads right to left with no sideways scroll, the four tabs included
  - id: own-feature
    title: Switch accountant access on your own account with the passkey; the blocked actions are explained once
    tickets: [MUT-527]
    paths:
      - src/hosted/pages/operator/OperatorAccountPage.tsx
      - src/hosted/pages/operator/OperatorFeaturesSection.tsx
      - src/hosted/pages/operator/OperatorBillingSection.tsx
      - src/hosted/operator/featureNames.ts
      - src/hosted/operator/OperatorStepUp.tsx
    steps:
      - Sign in with the password (no step-up yet) and open your own account from the list
      - Turn Accountant access on, confirming with the passkey
      - Try to disable your own account through the API
    expect:
      - One note at the top says sign-in and security actions are in You › Account and features switch here; there are no Access rows and no Grant row
      - Accountant access is named and explained ("As an owner, they can invite an accountant…"), and turns on after the passkey; the CLI lists you as a holder
      - The server still refuses to disable your own account (409 OWN_ACCOUNT)
  - id: feature-name-arabic
    title: Accountant access shows its name and explanation in Arabic, and its own turn-off confirmation
    tickets: [MUT-527]
    paths:
      - src/hosted/operator/featureNames.ts
      - src/hosted/i18n/ar.json
      - src/hosted/i18n/en.json
    steps:
      - In Arabic, open a person's account; in الميزات find وصول المحاسب and turn it on
      - Turn it off
    expect:
      - The switch is named وصول المحاسب with its explanation, never accountant_access
      - Turning it off asks first, in its own words (the person can't invite accountants or make new links)
  - id: you-panel
    title: Your settings shows you're an operator, your passkeys, the step-up, and your own features
    tickets: [MUT-527]
    paths:
      - src/hosted/pages/operator/OperatorYouPage.tsx
      - src/hosted/pages/operator/OperatorLayout.tsx
      - src/hosted/operator/time.ts
      - server/src/operator/actions/accounts.ts
    steps:
      - Sign in with the password on a 375 px phone and open Your settings in the console
      - Turn Accountant access on for yourself, confirming with the passkey
      - Press Manage passkeys
    expect:
      - It says Operator since <date>, 1 passkey, and Not confirmed (changes will ask for your passkey), with no sideways scroll
      - After the passkey the switch reads on and the page says Confirmed with your passkey until <time>
      - Manage passkeys opens You › Account with the Passkeys drawer
  - id: account-revoke-sessions
    title: Sign a person out everywhere; their password still works
    tickets: [MUT-461]
    paths:
      - src/hosted/pages/operator/OperatorAccountPage.tsx
      - src/hosted/components/InPlaceConfirm.tsx
      - src/hosted/operator/time.ts
      - server/src/operator/actions/accounts.ts
    steps:
      - The person is signed in on another device
      - Open their account and press Sign out everywhere
      - Confirm with the passkey
    expect:
      - The confirm says how many devices will be signed out and that the password still works
      - The toast says the person was signed out on 1 device
      - Their other device is signed out, and their password still signs in
  - id: account-disable-enable
    title: Disable an account and enable it again, in Arabic on a 375 px phone
    tickets: [MUT-461]
    steps:
      - On a 375 px phone with no language chosen, open the portal
      - Sign in (the account is Arabic); the person is signed in on another device
      - Open their account from الحسابات, press تعطيل الحساب and confirm with the passkey
      - Press تفعيل الحساب and confirm
    expect:
      - With no language chosen the portal opens in Arabic, right to left
      - The page reads right to left with no sideways scroll, and the address reads left to right
      - After disabling, the page says the account is disabled and offers only تفعيل الحساب; their device is signed out and their password no longer signs in
      - After enabling, their password signs in again
  - id: account-setup-link
    title: Send a reset link with the password locked; it is shown once
    tickets: [MUT-461]
    steps:
      - The person is signed in on another device
      - Open their account and press Send reset link, keeping Lock the current password on
      - Make the link with the passkey, then open it as the person and set a new password
      - Leave the account and come back
    expect:
      - The link is shown once with "Shown once. Leaving this page discards it."
      - The old password no longer works and their other device is signed out
      - The link sets a new password that signs in
      - Back on the account the link is gone; only Send reset link is offered
  - id: billing-grant-revoke
    title: Grant a person billing coverage with a reason and an expiry, then revoke it
    tickets: [MUT-462]
    steps:
      - On a 375 px phone, open their account and press Grant coverage
      - Choose Freelancer, give the reason "Pilot comp for Khatib Law", choose 30 days, and grant with the passkey
      - Revoke the grant and confirm
    expect:
      - The drawer and the account page fit a 375 px phone with no sideways scroll
      - The drawer opens at ?grant=new and closes after granting, with the toast "Coverage granted to <email>"
      - The grant is listed as Freelancer (legacy) · Pilot comp for Khatib Law, until a day 30 days out
      - The CLI's own list shows the grant, granted by operator:<the operator's id>
      - After revoking, the row says Revoked and offers no Revoke; the CLI's list shows it revoked
  - id: billing-grant-business
    title: Grant a person the Business plan
    tickets: [MUT-702]
    paths:
      - src/hosted/pages/operator/OperatorBillingSection.tsx
      - server/src/billing/plans.ts
    steps:
      - On a 375 px phone, open their account and press Grant coverage
      - Choose Business, give the reason "Business pilot", choose No end date, and grant with the passkey
    expect:
      - The drawer offers Solo, Business, Firm and Freelancer (legacy), in that order, with Solo chosen, and fits a 375 px phone
      - The toast says "Coverage granted to <email>" and the drawer closes
      - The grant is listed as Business · Business pilot
      - The CLI's own list shows a BUSINESS grant with no end, granted by operator:<the operator's id>
  - id: feature-grant-revoke
    title: Turn Connect Claude on for a person, then off with a confirm
    tickets: [MUT-462]
    steps:
      - On a 375 px phone, open their account; the Features group lists Connect Claude, off
      - Turn it on (confirming with the passkey)
      - Turn it off and confirm
    expect:
      - Turning it on needs no confirm beyond the passkey, and the switch reads on
      - The CLI's holders of agent_access include the person
      - Turning it off says they lose Claude access and asks first, with no sideways scroll; after confirming the switch reads off and they are no longer a holder
  - id: firm-request-enable
    title: Enable firm features for a waiting request from the Firms tab
    tickets: [MUT-462]
    steps:
      - An owner asks for firm features on their Business profile
      - Open the Firms tab; it counts the request and lists it with who asked
      - Press Enable; the confirm says the owner stays its owner; enable with the passkey
    expect:
      - The tab reads "Firms · N" and the row names the profile and the asker's address, left to right
      - The toast says firm features are on, and the row leaves the list
      - The profile is a firm now, its owner unchanged, and its audit trail records firm.enabled by the operator's id
  - id: firm-request-decline
    title: Decline a firm request, in Arabic on a 375 px phone
    tickets: [MUT-462]
    steps:
      - On a 375 px phone with no language chosen, open the portal, then sign in as an operator (Arabic)
      - An owner asks for firm features; open المكاتب
      - Press رفض and confirm with the passkey
    expect:
      - With no language chosen the portal opens in Arabic, right to left
      - The page reads right to left with no sideways scroll, and the asker's address reads left to right
      - The confirm says the profile stays a regular profile and its owner can ask again
      - The request leaves the list; the profile has no firm features and no pending request, and the audit records firm.request_declined by the operator's id
  - id: firm-request-owners
    title: Enable firm features for an operator firm, choosing its owners
    tickets: [MUT-462]
    steps:
      - A member of a firm we made has asked for firm features
      - Press Enable on its row; tick the colleague too
      - Enable with the passkey
    expect:
      - The members are listed with the one who asked already ticked, and the confirm names the owners as they are ticked
      - The toast says firm features are on, and the row leaves the list
      - Both ticked members are owners of the firm, and the audit records firm.enabled by the operator's id
  # MUT-735 (ADR-281): Operator › Usage, read from the usage ledger. The month's usage is written into the QA database
  # as the meters write it (support/selfService.ts seedUsage): real issuing needs a Tax Authority setup; the live
  # metering itself is usage.billing-usage. Starter's caps arrive with MUT-731, so the seeded people are on Solo.
  - id: usage-overview
    title: Operator › Usage shows this month per plan, and the Solo people near or at their cap
    tickets: [MUT-735]
    paths:
      - src/hosted/pages/operator/OperatorUsagePage.tsx
      - src/hosted/data/operatorUsageQueries.ts
      - src/hosted/operator/usageMonths.ts
      - server/src/routes/operator-usage.ts
      - server/src/usage/reports.ts
    steps:
      - As the operator, open Operator › Usage
      - Read the Solo row for this month
      - Open People (near a cap), then At a cap
    expect:
      - The Usage tab is current and the month is this Jerusalem month
      - The Solo row counts its payers, who is near a cap and who is at one, and the documents
      - Near a cap lists the person at 41 of 50 marked 80%, not the one at 50
      - At a cap lists the person at 50 of 50 marked At cap
  - id: usage-account
    title: An account shows six months of documents and scans against the plan's limits
    tickets: [MUT-735]
    paths:
      - src/hosted/pages/operator/OperatorUsageSection.tsx
      - src/hosted/pages/operator/OperatorAccountPage.tsx
    steps:
      - From Operator › Usage › People, open the person near their cap
      - Scroll to Usage
    expect:
      - Six months are listed, this one first
      - This month reads Solo, documents 41 of 50 and scans 7 of 100
      - A month with no plan says no cap
  - id: usage-routes
    title: Routes lists the API routes this run called, with counts and p95
    tickets: [MUT-735]
    paths:
      - server/src/usage/route-meter.ts
      - server/src/usage/route-key.ts
      - server/src/usage/route-buckets.ts
      - server/src/app.ts
      - server/src/index.ts
    steps:
      - As the operator, open Operator › Usage › Routes
      - Wait up to a minute and a half, reloading
    expect:
      - GET /v1/me is listed with its requests and p95, never a raw path with an id
      - The range of Jerusalem days is shown
  - id: usage-csv
    title: Export the overview as CSV with the passkey; it has the same totals
    tickets: [MUT-735]
    paths:
      - src/hosted/pages/operator/OperatorUsagePage.tsx
      - src/hosted/api/client.ts
      - server/src/routes/operator-usage.ts
    steps:
      - Signed in with the password (the step-up is stale), open Operator › Usage
      - Press Export CSV with passkey
    expect:
      - The passkey sheet answers, then a usage-overview-YYYY-MM.csv downloads
      - The file is UTF-8 with a byte-order mark and the overview's header
      - Its Solo row has the same payers, near, at-cap and document counts as the page
