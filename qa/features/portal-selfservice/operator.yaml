app: portal-selfservice
area: operator
title: Operator console (signup reviews, accounts, billing, flags, firm requests)
tier: secondary
# MUT-460 (ADR-213): the operator reviews waiting signups in the portal instead of the CLI, against the live dev API's
# real operator gate and passkey step-up (MUT-459). Chromium's virtual authenticator answers the passkey sheet
# (support/passkeys.ts); waiting signups are made as /signup and /setup make them (support/selfService.ts pendingSignup).
# MUT-461 adds Accounts: find an account by email and act on it (sign out everywhere, disable/enable, a reset link).
# MUT-462 adds billing grants and feature flags on the account page, and the Firms tab (enable or decline a request).
# Only a profile's owner can ask for firm features, so the live firm request is an owned Business profile's; the
# owner picker for an operator-made firm is covered by OperatorFirmsPage.test.tsx.
paths:
  - src/hosted/pages/operator/**
  - src/hosted/operator/**
  - src/hosted/data/operatorQueries.ts
  - src/hosted/data/signupReviews.ts
  - server/src/operator/**
  - server/src/routes/operator.ts
  - server/src/auth/operator-gate.ts
  - server/src/auth/step-up.ts
  - server/src/email/review-digest.ts
  - server/src/routes/admin-billing.ts
  - server/src/routes/admin.ts
  - server/src/routes/admin-users.ts
  - src/hosted/components/YouRows.tsx
features:
  - id: signups-approve
    title: From the digest mail, sign in with a passkey and approve a waiting signup
    tickets: [MUT-460]
    tier: core
    paths:
      - src/hosted/pages/auth/SignInPage.tsx
      - server/src/email/templates/copy.ts
    steps:
      - Someone signs up with an @gmail.com address and finishes setting a password
      - Open the "Review signups" link in the operator's digest mail while signed out
      - Sign in with the passkey, which the sign-in page offers first
      - Find the signup in the list, press Approve and confirm
    expect:
      - The signup is listed with its wait and a Webmail chip
      - The confirm says "‹email› can sign in. We'll email them now."
      - '"‹email› approved · email sent", the row leaves the list, and no second passkey prompt was needed'
      - The person gets the "your account is ready" mail and can sign in
  - id: signups-decline
    title: Decline a waiting signup, in Arabic on a 375 px phone
    tickets: [MUT-460]
    steps:
      - Sign in with the password on a 375 px phone in Arabic
      - Find the signup, press رفض and confirm with the passkey
    expect:
      - The confirm says the account will be deleted and they can sign up again
      - The toast says the signup was declined and the mail went
      - The person gets the decline mail and can no longer sign in
      - The page reads right to left with no sideways scroll
  - id: step-up-passkey
    title: A stale step-up asks for the passkey on the same tap; cancelling it changes nothing
    tickets: [MUT-460]
    paths:
      - src/hosted/passkeys/webauthn.ts
    steps:
      - Sign in with the password (no passkey step-up yet)
      - Press Approve on a waiting signup
      - Dismiss the passkey sheet, then press Approve with passkey again and confirm on the device
    expect:
      - The confirm button reads "Approve with passkey"
      - Dismissing the sheet leaves the confirm as it was, with no message and nothing approved
      - Confirming on the device approves the signup
  - id: hidden-for-non-operator
    title: Someone who isn't an operator never sees the console
    tickets: [MUT-460]
    paths:
      - src/hosted/pages/you/YouAccount.tsx
      - src/hosted/router.tsx
      - src/hosted/session/features.ts
    steps:
      - Sign in as someone who isn't an operator
      - Look at You › Account, then open /operator/signups directly
    expect:
      - You › Account has no Operator row
      - /operator/signups goes to Home, and the server refuses the list with 404
  - id: account-find
    title: Find an account by its email, and say so when there is none
    tickets: [MUT-461]
    paths:
      - src/hosted/pages/operator/OperatorAccountsPage.tsx
      - src/hosted/pages/operator/AccountStatusBadge.tsx
      - src/hosted/pages/operator/OperatorLayout.tsx
      - src/hosted/router.tsx
    steps:
      - Open the Accounts tab of the operator console
      - Search for an address no account has
      - Search for a person's address in capitals, then open the match
    expect:
      - The empty search says "No account with this address" with the address
      - The match lists the person with an Active chip, and the address stays in the URL
      - The account page shows the address, Active, the last sign-in and whether they have a passkey, the Access rows with how many devices each would end, and their personal profile with its billing
  - id: account-revoke-sessions
    title: Sign a person out everywhere; their password still works
    tickets: [MUT-461]
    paths:
      - src/hosted/pages/operator/OperatorAccountPage.tsx
      - src/hosted/components/InPlaceConfirm.tsx
      - src/hosted/operator/time.ts
      - server/src/operator/actions/accounts.ts
    steps:
      - The person is signed in on another device
      - Open their account and press Sign out everywhere
      - Confirm with the passkey
    expect:
      - The confirm says how many devices will be signed out and that the password still works
      - The toast says the person was signed out on 1 device
      - Their other device is signed out, and their password still signs in
  - id: account-disable-enable
    title: Disable an account and enable it again, in Arabic on a 375 px phone
    tickets: [MUT-461]
    steps:
      - On a 375 px phone with no language chosen, open the portal
      - Sign in (the account is Arabic); the person is signed in on another device
      - Open their account from الحسابات, press تعطيل الحساب and confirm with the passkey
      - Press تفعيل الحساب and confirm
    expect:
      - With no language chosen the portal opens in Arabic, right to left
      - The page reads right to left with no sideways scroll, and the address reads left to right
      - After disabling, the page says the account is disabled and offers only تفعيل الحساب; their device is signed out and their password no longer signs in
      - After enabling, their password signs in again
  - id: account-setup-link
    title: Send a reset link with the password locked; it is shown once
    tickets: [MUT-461]
    steps:
      - The person is signed in on another device
      - Open their account and press Send reset link, keeping Lock the current password on
      - Make the link with the passkey, then open it as the person and set a new password
      - Leave the account and come back
    expect:
      - The link is shown once with "Shown once. Leaving this page discards it."
      - The old password no longer works and their other device is signed out
      - The link sets a new password that signs in
      - Back on the account the link is gone; only Send reset link is offered
  - id: billing-grant-revoke
    title: Grant a person billing coverage with a reason and an expiry, then revoke it
    tickets: [MUT-462]
    steps:
      - Open their account and press Grant coverage
      - Choose Freelancer, give the reason "QA pilot comp", choose 30 days, and grant with the passkey
      - Revoke the grant and confirm
    expect:
      - The drawer opens at ?grant=new and closes after granting, with the toast "Coverage granted to <email>"
      - The grant is listed as Freelancer · QA pilot comp, until a day 30 days out
      - The CLI's own list shows the grant, granted by operator:<the operator's id>
      - After revoking, the row says Revoked and offers no Revoke; the CLI's list shows it revoked
  - id: feature-grant-revoke
    title: Turn Connect Claude on for a person, then off with a confirm
    tickets: [MUT-462]
    steps:
      - Open their account; the Features group lists Connect Claude, off
      - Turn it on (confirming with the passkey)
      - Turn it off and confirm
    expect:
      - Turning it on needs no confirm beyond the passkey, and the switch reads on
      - The CLI's holders of agent_access include the person
      - Turning it off says they lose Claude access and asks first; after confirming the switch reads off and they are no longer a holder
  - id: firm-request-enable
    title: Enable firm features for a waiting request from the Firms tab
    tickets: [MUT-462]
    steps:
      - An owner asks for firm features on their Business profile
      - Open the Firms tab; it counts the request and lists it with who asked
      - Press Enable; the confirm says the owner stays its owner; enable with the passkey
    expect:
      - The tab reads "Firms · N" and the row names the profile and the asker's address, left to right
      - The toast says firm features are on, and the row leaves the list
      - The profile is a firm now, its owner unchanged, and its audit trail records firm.enabled by the operator's id
  - id: firm-request-decline
    title: Decline a firm request, in Arabic on a 375 px phone
    tickets: [MUT-462]
    steps:
      - On a 375 px phone with no language chosen, open the portal, then sign in as an operator (Arabic)
      - An owner asks for firm features; open المكاتب
      - Press رفض and confirm with the passkey
    expect:
      - With no language chosen the portal opens in Arabic, right to left
      - The page reads right to left with no sideways scroll, and the asker's address reads left to right
      - The confirm says the profile stays a regular profile and its owner can ask again
      - The request leaves the list; the profile has no firm features and no pending request, and the audit records firm.request_declined by the operator's id
