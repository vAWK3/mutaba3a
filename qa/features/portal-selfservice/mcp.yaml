app: portal-selfservice
area: mcp
title: Claude's tools in MTB3A (MCP)
tier: secondary
# MUT-435 (ADR-200): a connected agent reads what it needs before it writes: the person's profiles, categories,
# clients, vendors, inbox and look-alike expenses. Same live dev API as connect.yaml; the spec plays the agent with
# fetch (support/agent.ts) and the person in the browser.
paths:
  - server/src/mcp/**
  - server/src/expenses/similarity.ts
  - server/src/auth/store-guard.ts
  - server/src/inbox/file-expense.ts
features:
  - id: read-tools
    title: A connected Claude lists my profiles and finds an expense I already recorded
    tier: secondary
    paths:
      - server/src/mcp/read-tools.ts
      - server/src/mcp/context.ts
    steps:
      - Connect an agent
      - Record a 45.90 ILS expense at Carrefour on the personal profile
      - The agent lists its tools and my profiles
      - The agent asks whether a 45.90 ILS purchase at carrefour on the same day is already recorded
    expect:
      - The agent is offered the six read tools, each telling it to show me what it found before writing
      - My personal profile is listed with its default currency
      - The Carrefour expense comes back as the look-alike, matched on currency, amount, date and vendor
  - id: add-expense
    title: Claude asks where an expense goes, adds it to my profile, and the drawer says "Added by Claude"
    tier: secondary
    paths:
      - server/src/mcp/write-tools.ts
      - server/src/expenses/compose.ts
      - src/hosted/components/ExpenseDrawer.tsx
    steps:
      - Claude tries to add an expense without saying where it goes
      - Claude adds a 45.90 ILS expense at Carrefour to my personal profile, then retries the same call
      - Open that expense in Expenses
    expect:
      - Claude is told to ask me whether it goes to the inbox or which profile, and nothing is recorded
      - The expense is recorded once; the retry answers the first result
      - The expense drawer shows "Added by Claude"
  - id: receipt-upload
    title: Claude uploads a receipt to an expense it added, and the receipt shows on the expense
    tier: secondary
    paths:
      - server/src/mcp/receipt-tools.ts
      - server/src/expenses/receipts-compose.ts
    steps:
      - Claude adds an expense and starts a receipt upload for it
      - Claude sends the file to the upload address and finishes the upload
      - Open that expense in Expenses
    expect:
      - The upload finishes as ready and attached to the expense
      - The expense drawer lists the receipt file
  - id: statement-match
    title: Claude gives back the expense I already recorded instead of adding the statement line twice
    tier: secondary
    # MUT-437 (ADR-202): every agent expense write checks for the same purchase first.
    paths:
      - server/src/mcp/write-tools.ts
      - server/src/mcp/read-tools.ts
      - server/src/expenses/similarity.ts
    steps:
      - Claude adds a 45.90 ILS expense at Carrefour from its receipt
      - Claude adds the card statement line for the same purchase, two days later
      - I say it is a different purchase, and Claude retries with the same key
      - Open Expenses
    expect:
      - The statement line answers "matched" with the receipt's expense and records nothing
      - The retry records it
      - Expenses lists both 45.90 purchases
  - id: file-inbox-entry
    title: Claude files my phone capture from the inbox into a profile and attaches the receipt to it
    tier: secondary
    paths:
      - server/src/mcp/write-tools.ts
      - server/src/inbox/file-expense.ts
    steps:
      - I capture 33.20 ILS on the phone; it waits in my inbox
      - Claude finds it as the look-alike of my receipt and files it to my personal profile
      - Claude uploads the receipt to the filed expense
      - Open that expense in Expenses
    expect:
      - The inbox entry is offered as a look-alike that must be filed before a receipt can attach
      - Filing creates the expense on my personal profile
      - The expense drawer lists the receipt file
