app: portal-selfservice
area: account
title: Your account on a live API (password change)
tier: secondary
# MUT-262 (TD-158): changing your password gives this browser a new session cookie, so a copy of the old one stops
# working. Needs the live dev API: the FakeApi portal app cannot show a cookie being refused.
paths:
  - src/hosted/components/ChangePasswordDrawer.tsx
  - src/hosted/api/client.ts
  - server/src/routes/sessions.ts
features:
  - id: rotate-on-change
    title: Change your password and stay signed in; the old session cookie stops working
    tier: core
    paths:
      - server/src/repositories/memory.ts
      - server/src/repositories/prisma.ts
      - server/src/auth/sessions.ts
    steps:
      - Sign in with your password
      - Open You › Account › Change password, type the current and a new password, and press Save
      - Open Home again
      - Replay the old session cookie against the API
    expect:
      - '"Password changed", and you are still signed in: Home loads'
      - The old cookie gets 401; the browser's cookie is a new value
