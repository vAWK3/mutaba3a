app: portal-selfservice
area: mail
title: The mails look like MTB3A (the new frame, its pictures, images off)
tier: secondary
# MUT-468 (epic MUT-466, .claude/designs/mut-468-mail-frame.md §6): the transactional mails in the approved frame
# (Claude Design 1b): a mood band with the header art, a chip and a headline, served from the portal at
# <PORTAL_ORIGIN>/mail/v1. Read from the live dev API's memory outbox (GET /admin/v1/dev-outbox); the QA API serves
# the built portal, so the pictures load from its own origin.
paths:
  - server/src/email/templates/**
  - server/src/email/mailer.ts
  - src/hosted/public/mail/**
features:
  - id: mail-frame
    title: The Arabic signup mail is on brand, its pictures load from the portal, and it still reads fully with images off
    tier: secondary
    paths:
      - server/src/app.ts
    steps:
      - Sign up in Arabic with a new business address
      - Open the signup mail
      - Turn images off and open it again
      - Press the mail's button
    expect:
      - 'The mail is Arabic, right to left, with the hello band, the envelope picture and chip, and the headline "خطوة أخيرة: عيّن كلمة المرور"'
      - Its pictures come from the portal's /mail/v1/ as PNGs cached for a year, and the footer names the recipient
      - With images off the headline, the button and the copyable link are all still there
      - The button opens /setup, "Finish creating your account"
  - id: mail-directional-art
    title: An approved Arabic account's ready mail faces its directional art right to left
    tier: secondary
    paths:
      - server/src/email/templates/look.ts
    steps:
      - Sign up in Arabic with a webmail address and finish /setup (it waits for review)
      - The operator approves the account
      - Open the account-ready mail
    expect:
      - The ready mail is Arabic, right to left, headed "حسابك جاهز"
      - Its header is the mirrored milestone picture (mail-header-hello-milestone-firm-rtl-2x.png) and it loads from the portal
