app: portal-selfservice
area: malafat-money-api
title: The money API Malafat's Money pages read
tier: secondary
# MUT-478 (ADR-217): reads and writes Malafat's integration key makes, against the live dev API
# (support/selfservice-live.mjs). No MTB3A screen shows them; Malafat's own release-QA covers its pages
# (web.money.client-ledger, MAL-1425). The spec plays Malafat with fetch.
paths:
  - server/src/statements/**
  - server/src/payments/numbering.ts
  - server/src/agreements/reduce.ts
  - server/src/agreements/reduce-compose.ts
  - server/src/payments/receipt-number.ts
  - server/src/proposals/draft.ts
  - server/src/retainers/create.ts
  - server/src/payments/correct.ts
  - server/src/payments/allocation-error.ts
  - server/src/agreements/correct-terms.ts
  - server/src/agreements/correct-terms-compose.ts
features:
  - id: statement
    title: Malafat reads a client's ledger card, with CHG numbers, a running balance and a reversed payment
    tier: secondary
    paths:
      - server/src/statements/build.ts
      - server/src/statements/serialize.ts
      - server/src/routes/customers.ts
    steps:
      - Malafat sets up a firm with a client, a project and a two-stage fee agreed in March
      - Malafat credits part of the second stage, records a payment on the first, and records then reverses another
      - Malafat reads the client's statement in ILS, then from May only
    expect:
      - The charges carry CHG numbers, and the lines run oldest first with debit, credit and a running balance
      - The reversed payment shows its payment line and its reversal line
      - The closing balance equals the client summary's outstanding minus unallocated
      - From May, the earlier lines fold into the opening balance and the totals still add up
  - id: reduce
    title: Malafat lowers a fixed fee past what is unbilled, and the rest becomes a credit with its reason
    tier: secondary
    # MUT-480 (ADR-222): POST /v1/agreements/{id}/reduce and its preview. Malafat's "Lower the fee" sheet is MAL-1424.
    paths:
      - server/src/agreements/reduce.ts
      - server/src/agreements/reduce-compose.ts
      - server/src/routes/agreements.ts
      - server/src/routes/installments.ts
    steps:
      - Malafat sets up a firm with a ₪3,540 fee in three stages; the first is billed on signing and partly paid
      - Malafat previews lowering the fee by ₪3,000
      - Malafat confirms it with the reason Discount
      - Malafat reads the agreement and the client's statement
    expect:
      - "The preview voids both unbilled stages and credits ₪640 on the billed one; what is outstanding goes from ₪680 to ₪40"
      - The agreement shows the effective total ₪540, the credited ₪640 and a REDUCTION row with its reason
      - The statement shows the credit line with the reason code, and the balance dropped by exactly the credit
  - id: receipt-number
    title: Malafat keeps the legal receipt's number on a payment, through a correction, and sets one later
    tier: secondary
    # MUT-481 (ADR-223): receiptNumber on POST /v1/payments, ?receiptNumber=, the statement lines, and
    # PUT /v1/payments/{id}/receipt-number. Malafat's receipt field is MAL-1420; its payment sheet MAL-1422.
    paths:
      - server/src/payments/receipt-number.ts
      - server/src/routes/payments.ts
      - server/src/statements/serialize.ts
    steps:
      - Malafat records a client's payment with receipt 2041
      - Malafat finds it by its receipt number
      - Malafat corrects it (reverses it and records the replacement without a number)
      - Malafat records another payment without a number and sets 2050 once the receipt is issued
      - Malafat reads the client's statement
    expect:
      - Searching for 2041 finds exactly that payment
      - The replacement still carries receipt 2041
      - The later payment carries receipt 2050 after it is set
      - The statement shows the receipt number on the payment line and on its reversal line
  - id: proposal-any-schedule
    title: Malafat proposes a 30/70 split and a retainer, previews each approval and approves it into exactly that agreement
    tier: secondary
    # MUT-479 (ADR-224): POST /v1/fee-proposals with a draft, POST .../approve/preview, approve with the full body and its
    # previewToken. Malafat's proposal screens are MAL-1426.
    paths:
      - server/src/proposals/draft.ts
      - server/src/routes/fee-proposals.ts
      - server/src/retainers/create.ts
    steps:
      - Malafat proposes a 30/70 fee to a client, the second stage due when the judgment comes
      - Malafat previews the approval, then approves with the preview's token
      - Malafat proposes a monthly retainer on another matter and reads the organization summary
      - Malafat previews the retainer's approval and approves it
      - Malafat approves with a preview taken before the fee changed, then approves a proposal already approved
    expect:
      - The proposal reads back with its draft and is APPROVED, linked to the agreement it made
      - The agreement has the two stages, the first posted and the second (MANUAL) still pending
      - The retainer starts on the proposed month, and the charges the preview said were due now have posted
      - The summary's proposed total leaves the retainer's monthly amount out, while the client's row lists it as RECURRING
      - The stale approval is 409 PREVIEW_STALE and the proposal stays PROPOSED; approving the approved one is 409 PROPOSAL_NOT_OPEN
  - id: payment-correct
    title: Malafat corrects a recorded payment in one call, from a preview, and a replay never corrects twice
    tier: secondary
    # MUT-443 (ADR-225): POST /v1/payments/{id}/correct and its preview. Malafat's "Correct a recorded payment" is MAL-1367.
    paths:
      - server/src/payments/correct.ts
      - server/src/payments/allocation-error.ts
      - server/src/payments/allocate.ts
      - server/src/payments/preview-token.ts
      - server/src/routes/payments.ts
      - server/src/statements/serialize.ts
    steps:
      - Malafat records a ₪1,000 payment with receipt 3001 against a ₪1,000 charge, which settles it
      - Malafat previews correcting it to ₪600 on a later date, reason ENTERED_BY_MISTAKE
      - Malafat confirms the correction
      - Malafat sends the same request again with the same key
      - Malafat tries again with an old preview, on the reversed original, with OTHER and no note, and with more than is outstanding
      - Malafat reads the client's statement
    expect:
      - The preview releases ₪1,000, allocates ₪600, and the charge goes from ₪0 to ₪400 outstanding; had the client paid ₪700, ₪100 would stay unallocated on the payment
      - The original reads REVERSED with the reason, and the replacement is POSTED with receipt 3001, ₪600 allocated, and replacesPaymentId
      - The replay answers the same, and there is still exactly one replacement
      - The refusals are 409 PREVIEW_STALE, 409 PAYMENT_NOT_POSTED, 422 REASON_REQUIRED, and 422 ALLOCATION_EXCEEDS_OUTSTANDING naming the charge, and none of them writes anything
      - The statement shows the payment line, its reversal line with the reason, and the new payment line, and the balance is ₪400
  - id: agreement-correct
    title: Malafat corrects a billed and paid fee's amount, VAT basis and treatment in one call, and a replay never corrects twice
    tier: secondary
    # MUT-444 (ADR-226): POST /v1/agreements/{id}/correct and its preview. Malafat's "Correct an agreement's terms" is MAL-1368.
    paths:
      - server/src/agreements/correct-terms.ts
      - server/src/agreements/correct-terms-compose.ts
      - server/src/routes/agreements.ts
      - server/src/statements/build.ts
      - server/src/summaries/compute.ts
    steps:
      - Malafat sets up a client, a project and a ₪1,000 VAT-inclusive fee split 50/50, "On signing" (billed at once) and "On judgment" (manual), at 18 %, and records ₪300 on the signing charge
      - Malafat previews correcting the fee to ₪1,000 VAT-exclusive, reason ENTERED_BY_MISTAKE
      - Malafat confirms with the token
      - Malafat sends the same request again with the same key
      - Malafat corrects the fee again, to ₪200 VAT-inclusive
      - Malafat corrects the VAT treatment from STANDARD_RATED to EXEMPT, same ₪200 VAT-inclusive
      - Malafat bills "On judgment", previews a correction, records a new ₪100 payment on that charge, then confirms with the old token
      - Malafat confirms a correction with the reason OTHER and no note
      - Malafat sends the same terms again
      - Malafat changes "On signing" to MANUAL
      - Malafat tries to correct a cancelled agreement
      - Malafat tries to correct a contingency agreement whose outcome is recorded
      - Malafat tries to correct a retainer
      - Malafat reads the old charge's credit, the client's statement, the payment, the audit log and the contract version
    expect:
      - The first preview shows line 1 going from ₪500 gross (₪423.73 + ₪76.27) to ₪590 (₪500 + ₪90) billed on the original date, line 2 from ₪500 to ₪590 not billed yet, a ₪500 credit dated the original date, the ₪300 payment moving to line 1, and the client's outstanding and balance going from ₪200 to ₪290 (Δ ₪90)
      - After confirming, the old lines read VOID, the old charge is settled by the credit with ENTERED_BY_MISTAKE, a new ₪590 charge is dated the original day with ₪300 paid, and the payment shows ₪300 allocated to the new charge and ₪0 unallocated
      - The replay answers the same; there is still one CORRECTION supplement and one credit from it
      - The second correction leaves ₪100 paid on the new ₪100 charge and ₪200 unallocated; outstanding goes ₪290 → ₪0, unallocated ₪0 → ₪200, the balance moves by −₪490, and no payment is lost
      - The EXEMPT correction makes the ₪100 charge net ₪100 and VAT ₪0 with the gross unchanged; the balance does not move and the payment's ₪100 sits on the new charge
      - The refusals are 409 PREVIEW_STALE, 422 REASON_REQUIRED, 422 NOTHING_TO_CORRECT, 422 POSTED_INSTALLMENT_CHANGED (position 1, TRIGGER), 409 AGREEMENT_CANCELLED, 409 OUTCOME_ALREADY_RECORDED and 422 NOT_FIXED, and none of them writes anything (the agreement's version is unchanged)
      - The statement shows, on the original date, each old charge, its credit, then its repost; the judgment charge and its payment follow; the closing balance is −₪200 and the matter's posted is ₪200, never the replaced charges
      - The audit has agreement.corrected with the before and after terms, and the contract version reads 1.90.0-mut483
  - id: period-totals
    title: Malafat reads a month's billed, received and credited, and they add up to how much owed changed
    tier: secondary
    # MUT-483 (ADR-227): GET /v1/summaries/period with the integration key. Malafat's "Month summary" sheet is MAL-1428.
    paths:
      - server/src/statements/period.ts
      - server/src/statements/lines.ts
      - server/src/routes/summaries.ts
    steps:
      - Malafat sets up a firm with two clients at 18 % VAT
      - Last month, client A is billed ₪1,000 (VAT included) on its own agreement and pays ₪400 against it
      - This month, A is billed a ₪1,000 fee (VAT included) on its own agreement and B ₪500 (VAT included)
      - B gets a ₪50 credit and pays ₪300 with nothing applied; A pays ₪200 against its fee and the payment bounces
      - B pays ₪100 against its charge and Malafat corrects it to ₪120, applied to the same charge
      - Malafat corrects A's fee from ₪1,000 VAT-inclusive to ₪1,000 VAT-exclusive
      - Malafat reads this month's totals in ILS, then last month's, then each client's statement for this month
      - Malafat reads the totals with a key that lacks summaries:read, with to before from, and reads the contract version
    expect:
      - Billed, credited, payments and reversals for this month equal both clients' statement lines for the month, added up (AC1)
      - Closing minus opening equals billed minus received minus credited, and equals change; this month's opening equals last month's closing (AC2)
      - "This month: opening ₪600, billed ₪2,680, credited ₪1,050, payments ₪720, reversals ₪300 (the bounce and the corrected original), received ₪420, change ₪1,210, closing ₪1,810"
      - "Last month: billed ₪1,000, received ₪400, credited ₪0, opening ₪0, closing ₪600"
      - The key without summaries:read gets 403 INSUFFICIENT_SCOPE, and to before from gets 422 END_BEFORE_START (AC3)
      - The contract version reads 1.90.0-mut483 (AC4)
