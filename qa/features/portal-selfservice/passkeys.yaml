app: portal-selfservice
area: passkeys
title: Passkeys (sign in with Face ID, Touch ID or the screen lock)
tier: secondary
# MUT-115 (ADR-190): add, use, remove and keep passkeys on the portal, against the live dev API's real WebAuthn checks
# (WEBAUTHN_RP_ID=localhost). Chromium's virtual authenticator (support/passkeys.ts) answers the system sheet. The iOS
# app's flows (ios.passkey.*) live in the Flutter repo's catalog.
paths:
  - src/hosted/passkeys/**
  - src/hosted/components/PasskeysDrawer.tsx
  - server/src/routes/passkeys.ts
  - server/src/auth/webauthn.ts
  - server/src/auth/passkey-names.ts
features:
  - id: add
    title: Add a passkey from You › Account right after signing in, with no password prompt
    tier: core
    paths:
      - src/hosted/pages/you/YouAccount.tsx
      - src/hosted/shell/AccountDrawers.tsx
    steps:
      - Sign in with your password
      - Open You › Account › Passkeys and press Add a passkey
      - Confirm on the device
    expect:
      - '"Passkey added", and the passkey is listed as added today and never used'
      - No password was asked for
  - id: sign-in
    title: Sign in with a passkey after signing out
    tier: core
    paths:
      - src/hosted/pages/auth/SignInPage.tsx
      - server/src/auth/sign-in.ts
      - server/src/routes/sessions.ts
    steps:
      - Add a passkey, then sign out
      - On sign-in press Sign in with a passkey
    expect:
      - You land on Home without typing a password
      - Passkeys shows it was last used today
  - id: remove
    title: Removing a passkey stops it signing in
    steps:
      - Add a passkey
      - Press Remove on it and confirm
      - Sign out and try Sign in with a passkey
    expect:
      - '"Passkey removed. Devices signed in with it are signed out."'
      - The passkey sign-in is refused with "That passkey didn’t work"
  - id: password-change-keeps
    title: Changing the password keeps the passkey working
    paths:
      - server/src/routes/sessions.ts
    steps:
      - Add a passkey
      - Change the password from You › Account
      - Sign out and sign in with the passkey
    expect:
      - The passkey still signs in
  - id: autofill
    title: The email field on sign-in offers your passkey (autofill)
    paths:
      - src/hosted/passkeys/usePasskeySignIn.ts
    steps:
      - Add a passkey and sign out
      - Open sign-in and pick the passkey the email field offers
    expect:
      - The email field asks for passkeys (autocomplete "username webauthn")
      - You land on Home
  - id: arabic-phone
    title: Passkeys in Arabic on a 375 px phone (مفاتيح المرور, right to left)
    steps:
      - In Arabic at phone width, sign in and open أنت › الحساب › مفاتيح المرور
      - Add a passkey, then sign out
    expect:
      - The drawer reads right to left and fits the phone
      - Sign-in offers تسجيل الدخول بمفتاح المرور
  # MUT-370 (ADR-191): Home suggests a passkey after a sign-in: "Add a passkey: the more secure way to sign in. Your
  # password still works." Not now hides it for 30 days; three offers in all; never with a passkey.
  - id: suggest-first-sign-in
    title: The first sign-in after signup suggests a passkey, after the free trial's first-run step
    tier: core
    paths:
      - src/hosted/components/PasskeySuggestion.tsx
      - src/hosted/data/passkeyPrompt.ts
      - src/hosted/pages/views/OverviewPage.tsx
      - server/src/auth/passkey-prompt.ts
      - server/src/routes/me.ts
    steps:
      - Sign up, open the mail's link, choose a password and create the account
      - Answer the free trial's first-run step with Continue
    expect:
      - The card is not shown while the trial step is open
      - 'On Home: "Add a passkey: the more secure way to sign in." and "Your password still works.", with Add a passkey and Not now'
  - id: suggest-not-now
    title: Not now hides the passkey suggestion for 30 days; after the third Not now it never comes back
    paths:
      - src/hosted/data/passkeyPromptQueries.ts
      - server/src/auth/passkey-prompt.ts
    steps:
      - Sign in and press Not now on the card
      - Reload
      - 30 days later (the QA database's clock), reload; press Not now again, twice more over 60 days
    expect:
      - The card is gone at once and after a reload
      - It is back after 30 days
      - After the third Not now it never shows again
  - id: suggest-add
    title: Add a passkey from the suggestion, then sign in with it
    paths:
      - src/hosted/components/PasskeySuggestion.tsx
      - src/hosted/passkeys/addPasskey.ts
    steps:
      - Sign in and press Add a passkey on the card; the device confirms
      - Sign out, then Sign in with a passkey
    expect:
      - '"Passkey added", and the card is gone'
      - The passkey signs in, and Home shows no card
  - id: suggest-has-passkey
    title: Someone who already has a passkey is never shown the suggestion
    paths:
      - src/hosted/components/PasskeysDrawer.tsx
    steps:
      - Sign in, add a passkey from You › Account › Passkeys and close the drawer
      - Go Home, then reload
    expect:
      - The card leaves as soon as the passkey is added
      - No card on Home, then or after a reload
  - id: suggest-arabic-phone
    title: The passkey suggestion in Arabic on a 375 px phone
    steps:
      - In Arabic at phone width, sign in
    expect:
      - '"أضف مفتاح مرور: الطريقة الأكثر أمانًا لتسجيل الدخول." with إضافة مفتاح مرور and ليس الآن, right to left'
      - The card fits the phone with nothing scrolling sideways
