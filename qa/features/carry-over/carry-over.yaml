app: carry-over
area: carry
title: Bringing records from the old address, or a file saved from the old web app, to the new address
tier: secondary
# MUT-291 (epic MUT-284, ADR-185): the old address's signed-out records, carried to the new address in one hand-off
# between two browser windows. The free web app that also sent its records is retired (MUT-445); a records file saved
# from it still restores. Two origins run on the loopback (qa/support/carry-over.mjs); every /v1 request is answered by
# the spec (signed out).
paths:
  - src/lib/carryOver/**
  - src/hosted/local/carryOver/**
  - src/hosted/pages/carry-over/CarryOverDetails.tsx
  - src/hosted/pages/carry-over/ReceivePage.tsx
  # Another tab's mode change must leave the carry-over pages where they are.
  - src/hosted/session/SessionBridge.tsx
features:
  - id: records-file
    title: A records file saved from the old web app restores on the new address with the same summary
    steps:
      - On the new address's carry-over page, choose a records file the old web app saved
      - Open Not carried
    expect:
      - The new address reads the file and shows its counts and totals before Save
      - The saved vendor list and the recurring rule are listed as not carried
  - id: replace-existing
    title: Carrying into a device that already has records warns, offers a download first, and replaces only on a second confirm
    steps:
      - Have records on the new address already, and records on the old address
      - Carry the old address's records over
      - On the new address, download what's here first, then replace
    expect:
      - The summary warns how many records this device already has
      - The download happens, and Replace asks once more before anything changes
      - After replacing, the device holds the carried records
  - id: portal-host
    title: The old address's signed-out records go to the new address, and the old link's page opens there
    paths:
      - src/hosted/pages/carry-over/CarryOverPage.tsx
    steps:
      - Signed out on the old address, add money received
      - Open an old link on the old address that goes through the carry-over page
      - Choose Carry my records over, then save on the new address
    expect:
      - The old address offers the move instead of sending me on
      - The new address shows the money received, and the old link's page opened there