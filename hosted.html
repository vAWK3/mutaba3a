<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      The portal's publicDir is src/hosted/public, so these ./public/ files are
      bundled as hashed /assets/* copies: the only path the portal server caches
      (MUT-104, D3). One copy of each icon serves the app and the portal.
    -->
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCF6ED" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#221B2D" />
    <link rel="stylesheet" href="./src/styles/brand/boot-splash.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <!--
      The MTB3A logotype is a CSS mask, fetched only once the page renders, and the portal has no
      service worker, so a cold sign-in would paint it late. The preload starts it with the CSS
      (MUT-402 design D4). Vite rewrites this href to the same hashed /assets/ file the CSS masks
      with. crossorigin matches the CORS-mode fetch browsers use for mask images; without it the
      file downloads twice.
    -->
    <link rel="preload" as="image" type="image/svg+xml" crossorigin href="./src/assets/brand/wordmark.svg" />
    <!-- The portal opens in Arabic until a person chooses (ADR-077); PortalTitle takes over once the bundle runs -->
    <title>متابعة</title>
  </head>
  <body>
    <!--
      The boot splash (MUT-207, ADR-080): the mark on the brand canvas until React mounts and replaces
      #root's content. Markup and a linked stylesheet only, no inline style or script, so it passes the
      portal CSP (default-src 'self'). Keep it in step with src/components/brand/BootSplash.tsx.
    -->
    <div id="root"><div class="boot-splash" aria-hidden="true"><picture><source srcset="./src/assets/brand/mark-dark.svg" media="(prefers-color-scheme: dark)"><img class="boot-splash-mark" src="./src/assets/brand/mark.svg" width="80" height="80" alt=""></picture></div></div>
    <script type="module" src="/src/hosted/main.tsx"></script>
  </body>
</html>
