  parameters: {}
paths:
  /health:
    get:
      tags:
        - Operations
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      tags:
        - Operations
      summary: Readiness (database reachable)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /v1/sessions:
    post:
      tags:
        - Sessions
      summary: Sign in (sets the session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: INVALID_CREDENTIALS — the same answer for every refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CROSS_SITE_REQUEST, or ACCOUNT_UNDER_REVIEW — the right password for a self-service account the operator has not approved yet (MUT-367); no session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/sessions/current:
    delete:
      tags:
        - Sessions
      summary: Sign out (revokes the session server-side and clears the cookie)
      security:
        - session: []
      responses:
        "204":
          description: Signed out
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CROSS_SITE_REQUEST or PRINCIPAL_NOT_ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me/malafat-suggestions:
    patch:
      tags:
        - Sessions
      summary: The person's Malafat suggestion preferences (MUT-191)
      description: "`off` replaces the switch; `dismiss` adds moments to what is stored (never removes one), so two devices never undo each other. Idempotent by construction, so no Idempotency-Key. Writes no audit row: a preference is not an event a firm sees."
      security:
        - session: []
        - deviceSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MalafatSuggestionsChange"
      responses:
        "200":
          description: The preferences now stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MalafatSuggestions"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PRINCIPAL_NOT_ACCEPTED or CROSS_SITE_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me/terms-acceptance:
    post:
      tags:
        - Sessions
      summary: Accept the current terms of service (MUT-324)
      description: "Records that the signed-in person accepted `version`, read in `locale`, from the portal or the phone, with the optional `clientRelease` that showed it (MUT-354, stored as sent). Idempotent per version: accepting again changes nothing and writes no second audit row. The person accepts for themselves and, as owner, for their own profiles, so `user.terms_accepted` is audited on each profile they own."
      security:
        - session: []
        - deviceSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAcceptanceRequest"
      responses:
        "200":
          description: The terms status after accepting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsStatus"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PRINCIPAL_NOT_ACCEPTED or CROSS_SITE_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: TERMS_VERSION_STALE — `version` is not the current terms; details.current names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me/password:
    post:
      tags:
        - Sessions
      summary: Change your own password (MUT-237)
      description: Revokes every other session, web and device; this one stays signed in. A wrong current password counts toward the same lockout a wrong sign-in attempt would.
      security:
        - session: []
        - deviceSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "403":
          description: CURRENT_PASSWORD_WRONG (the current password is wrong, the account is locked, or another change landed first), CROSS_SITE_REQUEST or PRINCIPAL_NOT_ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (the new password is 12 to 128 characters; the current one at most 1024)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/device-sessions:
    post:
      tags:
        - Device sessions
      summary: Sign in from a native app (returns a bearer token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: Signed in; the token is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSession"
        "401":
          description: INVALID_CREDENTIALS — the same answer for every refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: ACCOUNT_UNDER_REVIEW — the right password for a self-service account the operator has not approved yet (MUT-367); no token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/device-sessions/current:
    delete:
      tags:
        - Device sessions
