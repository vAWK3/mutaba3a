          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntitlementGrantRequest"
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementGrant"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such user or organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags:
        - Admin
      summary: List grants, newest first; active=true keeps only those in force now
      security:
        - adminToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: false
          name: userId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: organizationId
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: active
          in: query
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementGrantList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/v1/billing/grants/{grantId}:
    delete:
      tags:
        - Admin
      summary: Revoke a grant (it is kept, with revokedAt set); revoking twice changes nothing
      security:
        - adminToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: grantId
          in: path
      responses:
        "200":
          description: Revoked, or already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeEntitlementGrantResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/v1/billing/accounts/link:
    post:
      tags:
        - Admin
      summary: Link a Stripe customer to a person (a pilot subscription made by hand in the dashboard)
      description: Creates the billing account when the customer is new here; `currency` is then required. Linking the same pair again changes nothing.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBillingAccountRequest"
      responses:
        "200":
          description: Linked, or already linked to this person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkBillingAccountResponse"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "CONFLICT: the customer is linked to someone else, or the person already has another customer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed, or currency missing for a new customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/v1/billing/accounts:
    get:
      tags:
        - Admin
      summary: List Stripe customers, oldest first; linked=false lists those still to be matched to a person
      security:
        - adminToken: []
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: linked
          in: query
      responses:
        "200":
          description: Billing accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAccountList"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/v1/billing/status:
    get:
      tags:
        - Admin
      summary: One person’s Stripe mirror and entitlement, with and without operator grants (MUT-360)
      description: "The pilot cutover check: revoke a person’s grant only once `billingWithoutGrants` shows ACTIVE / STRIPE. MUT-362: `countryCheck` flags a linked payer billed outside the consumer countries with no tax ID (asks Stripe for the customer’s tax IDs). Exactly one of userId and email."
      security:
        - adminToken: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: false
          name: userId
          in: query
        - schema:
            type: string
            minLength: 3
            maxLength: 320
          required: false
          name: email
          in: query
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No such person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/billing/stripe/webhook:
    post:
      tags:
        - Billing
      summary: "Stripe webhook: mirrors subscriptions after re-reading them from Stripe"
      description: Called by Stripe only. The raw body is verified against `Stripe-Signature` (the endpoint secret, 300 s tolerance); a bad, missing or old signature is 400 and nothing is stored. An event already handled answers 200 `duplicate`. The subscription is re-fetched from Stripe rather than trusted from the payload, so events arriving out of order end in Stripe’s current state. A Stripe or database failure is 500 so Stripe redelivers. Failed signatures are rate-limited to 300 per minute per address; verified events never are.
      security: []
      responses:
        "200":
          description: Handled, ignored, a duplicate, or recorded for the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeWebhookResponse"
        "400":
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many failed signatures from this address; `Retry-After` says when to try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The event could not be handled now; Stripe redelivers it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: BILLING_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /jobs/v1/billing/stripe-reconcile:
    post:
      tags:
        - Billing
      summary: Nightly Stripe reconcile (Cloud Scheduler)
      description: Lists every Stripe subscription and repairs the mirror, so a missed webhook heals within a day. Always 200 once it ran; the job token opens nothing else.
      security:
        - jobToken: []
      responses:
        "200":
          description: The run’s summary; `errors` lists what needs the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeReconcileSummary"
        "401":
          description: JOB_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: RECONCILE_RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: "RECONCILE_FAILED: Stripe could not be listed; `details` is the run summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: BILLING_NOT_CONFIGURED or JOBS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/v1/billing/stripe/reconcile:
    post:
      tags:
        - Admin
      summary: Run the Stripe reconcile now
      description: The same run as the nightly job, for the operator (pilot cutover, after fixing metadata).
      security:
        - adminToken: []
      responses:
        "200":
          description: The run’s summary; `errors` lists what needs the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeReconcileSummary"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: RECONCILE_RUNNING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: "RECONCILE_FAILED: Stripe could not be listed; `details` is the run summary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: BILLING_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/email/resend/webhook:
    post:
      tags:
        - Email
      summary: "Resend webhook: suppresses addresses that hard-bounce or complain"
      description: "Called by Resend (Svix-signed) only. The raw body is verified against `svix-id`, `svix-timestamp` and `svix-signature` with the endpoint secret, within 5 minutes; anything else is 401 and nothing is stored. Only events sent from this server's own mail domain count: `email.bounced` with a Permanent bounce and `email.complained` suppress every recipient, so no more mail goes to them; every other event is acknowledged and ignored. Failed signatures are rate-limited to 60 per minute per address. A database failure is 500, so Resend redelivers."
      security: []
      responses:
        "200":
          description: Suppressed, or acknowledged and ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailWebhookResponse"
        "401":
          description: INVALID_WEBHOOK_SIGNATURE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many failed signatures from this address; `Retry-After` says when to try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The event could not be stored now; Resend redelivers it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: MAILER_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
