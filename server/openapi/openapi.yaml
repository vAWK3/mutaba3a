        "403":
          description: RECENT_SIGN_IN_REQUIRED, CURRENT_PASSWORD_WRONG, PRINCIPAL_NOT_ACCEPTED, CROSS_SITE_REQUEST or ACCOUNT_CLOSING
          content:
