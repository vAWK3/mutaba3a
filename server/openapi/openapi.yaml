  /v1/entries:
    get:
      tags:
        - Entries
      summary: Your entries across profiles, newest logged or newest money day first
      description: "Expenses, received payments, Owed entries and conversions on every profile you belong to (or the profiles you name), ordered by when each was logged (default) or, with order=occurredOn, by its money date. Everything on a profile, whoever logged it, Malafat's payments included; scheduled installments and retainer charges are not entries. No X-Mutaba3a-Profile. Unsorted entries are listed by GET /v1/inbox. Filters: occurredFrom with order=occurredOn; occurredBefore with order=occurredOn, or with loggedSince; loggedSince with the default order, at most 31 days back. Any other combination answers 422, since it could not be served from an index. A page is a snapshot: an entry edited or deleted later changes only when that page is read again (a deleted one is simply absent), so cache only the pages you re-read. With order=occurredOn an entry whose date changes between page reads can show twice or be missed until page one is read again: dedupe by id, and re-read page one after an edit. A settle shows as a received payment with settlesOwedId (its Owed is settled once paid in full, open before); a Malafat correction as a received payment with replacesPaymentId. In the default order each usually sits next to its partner; by money date they can be days apart."
      security:
        - session: []
        - deviceSession: []
      parameters:
        - schema:
            type: array
            items:
              type: string
            description: Repeatable. Only these profiles; every profile you belong to when absent. One you do not belong to (or not an id at all) answers 404.
          required: false
          description: Repeatable. Only these profiles; every profile you belong to when absent. One you do not belong to (or not an id at all) answers 404.
          style: form
          explode: true
          name: profileId
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Page size, 1–100.
          required: false
          description: Page size, 1–100.
          name: limit
          in: query
        - schema:
            type: string
            description: Opaque `nextCursor` from the previous page, read with the same `order`.
          required: false
          description: Opaque `nextCursor` from the previous page, read with the same `order`.
          name: cursor
          in: query
        - schema:
            type: string
            enum:
              - createdAt
              - occurredOn
            default: createdAt
            description: "`createdAt` (default): newest logged first. `occurredOn`: newest money day first (an expense or conversion's occurredOn, a received payment's or Owed entry's own date), a future-dated entry above today, then newest logged. A cursor pages only the order that issued it (422 otherwise)."
          required: false
          description: "`createdAt` (default): newest logged first. `occurredOn`: newest money day first (an expense or conversion's occurredOn, a received payment's or Owed entry's own date), a future-dated entry above today, then newest logged. A cursor pages only the order that issued it (422 otherwise)."
          name: order
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Money date on or after this day. `order=occurredOn` only (422 otherwise).
          required: false
          description: Money date on or after this day. `order=occurredOn` only (422 otherwise).
          name: occurredFrom
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Money date before this day. With `order=occurredOn`, or with the default order together with `loggedSince` (422 otherwise).
          required: false
          description: Money date before this day. With `order=occurredOn`, or with the default order together with `loggedSince` (422 otherwise).
          name: occurredBefore
          in: query
        - schema:
            type: string
            format: date-time
            description: Logged at or after this instant (ISO 8601, Z or an offset), at most 31 days back. Default order only (422 otherwise).
          required: false
          description: Logged at or after this instant (ISO 8601, Z or an offset), at most 31 days back. Default order only (422 otherwise).
          name: loggedSince
          in: query
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "401":
