openapi: 3.1.0
info:
  title: MTB3A Financial API
  version: 1.91.0-mut503
  description: |-
    Organization-scoped financial ledger API (MUT/MAL Money v1, Milestones 1–8).

    Scopes: integration:read, integration:write, customers:read, customers:write, projects:read, projects:write, agreements:read, agreements:write, payments:read, payments:write, attachments:read, attachments:write, summaries:read, audit:read.

    Error codes: INVALID_SIGNATURE, EMAIL_NOT_ACCEPTED, UNAUTHENTICATED, INVALID_API_KEY, API_KEY_REVOKED, API_KEY_EXPIRED, API_KEY_ENVIRONMENT_MISMATCH, ADMIN_UNAUTHORIZED, INVALID_WEBHOOK_SIGNATURE, JOB_UNAUTHORIZED, INVALID_CREDENTIALS, SESSION_EXPIRED, INSUFFICIENT_SCOPE, PRINCIPAL_NOT_ACCEPTED, READ_ONLY_PROFILE, CROSS_SITE_REQUEST, CHECK_FAILED, ACCOUNT_UNDER_REVIEW, CURRENT_PASSWORD_WRONG, ACCOUNT_CLOSING, ACCOUNT_CLOSE_BLOCKED, RECENT_SIGN_IN_REQUIRED, PASSKEY_NOT_ACCEPTED, PASSKEY_LIMIT, SUBSCRIPTION_LAPSED, FEATURE_NOT_ENABLED, NOT_FOUND, ORGANIZATION_MISMATCH, CONFLICT, OPERATION_IN_PROGRESS, RECONCILE_RUNNING, LINK_ORIGIN_LOOPBACK, TERMS_VERSION_STALE, SETUP_LINK_UNUSABLE, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_REQUIRED, PAYLOAD_TOO_LARGE, RATE_LIMITED, INTERNAL, RECONCILE_FAILED, STRIPE_UNAVAILABLE, ATTACHMENTS_NOT_CONFIGURED, BILLING_NOT_CONFIGURED, MAILER_NOT_CONFIGURED, JOBS_NOT_CONFIGURED, OAUTH_NOT_CONFIGURED, FX_RATES_UNAVAILABLE, APP_UPDATE_REQUIRED. Every error is {"error":{"code","message","details?","requestId"}}.

    Financial writes require an `Idempotency-Key` header (8–128 chars). Same key + same body replays the stored outcome; same key + different body is rejected with IDEMPOTENCY_KEY_REUSED. A JSON body is compared by meaning: key order, whitespace and escaping (`\/`, `\u00e9`) do not count; array order and values do.

    PATCH routes require `If-Match: <version>` (optimistic concurrency).

    Minimum app version (MUT-293): a phone client sends `X-App-Platform: ios|android` and `X-App-Build: <int>` on every request. Below the configured floor for that platform, every endpoint except sign-in (`POST /v1/sessions`, `POST /v1/device-sessions`) and `/health` answers 426 APP_UPDATE_REQUIRED with `details: { platform, minimumBuild }`. Between the floor and the configured recommended build, the request still succeeds but carries `X-Update-Available: true` and `X-Recommended-Build: <int>`. A request with no `X-App-Platform` header (the portal, or any build older than this contract version) is untouched — this is scoped to the phone API only, not enforced against it.

    409 CONFLICT responses carry details.reason, one of: VERSION_MISMATCH, CURRENCY_LOCKED, CUSTOMER_MISMATCH, HAS_ACTIVE_PROJECTS, PREVIEW_STALE, INTEGRATION_NOT_CONNECTED, RATE_ALREADY_SET, AGREEMENT_HAS_POSTED_RECEIVABLES, AGREEMENT_CANCELLED, PROJECT_HAS_OUTSTANDING, ALREADY_REVERSED, PROPOSAL_OPEN, PROPOSAL_NOT_OPEN, CATEGORY_NAME_TAKEN, ALREADY_SETTLED, ALREADY_ALLOCATED, REVERSED_BY_MALAFAT, ENTRY_KIND_MISMATCH, RECEIPT_ALREADY_FILED, OUTCOME_ALREADY_RECORDED, OUTCOME_NOT_RECORDED, OUTCOME_HAS_PAYMENTS, ALREADY_SUBSCRIBED, RESUME_IN_PORTAL, CONTACT_US, NOTHING_TO_COVER, COVERED_BY_MALAFAT, COVERED_BY_GRANT, NO_BILLING_ACCOUNT, BILLING_ACCOUNT_NEEDS_HELP, PASSKEY_EXISTS, INSTALLMENT_VOIDED, PAYMENT_NOT_POSTED.

    422 VALIDATION_FAILED responses raised by business rules carry details.reason, one of: AMOUNT_INVALID, VAT_RATE_MISSING, INSTALLMENTS_DO_NOT_SUM, PERCENTS_DO_NOT_SUM, MIXED_INSTALLMENT_BASIS, NO_INSTALLMENTS, TOO_MANY_INSTALLMENTS, NON_POSITIVE_INSTALLMENT, CURRENCY_MISMATCH, PROJECT_ARCHIVED, CUSTOMER_ARCHIVED, NOT_MANUAL, NOT_FIXED, NOT_RECURRING, SUPPLEMENT_EXCEEDS_UNPOSTED, NEW_INSTALLMENT_REQUIRED, NEGATIVE_NEW_INSTALLMENT, BILLING_DAY_INVALID, START_MONTH_INVALID, END_MONTH_INVALID, END_BEFORE_START, DATE_INVALID, TRIGGER_DATE_REQUIRED, ALLOCATION_EXCEEDS_PAYMENT, ALLOCATION_EXCEEDS_OUTSTANDING, ALLOCATION_DUPLICATE, RECEIVABLE_NOT_FOUND, RECEIVABLE_NOT_OPEN, RECEIVABLE_CUSTOMER_MISMATCH, PAYMENT_NOT_POSTED, NO_UNALLOCATED_FUNDS, CREDIT_EXCEEDS_OUTSTANDING, REPLACES_NOT_REVERSED, REPLACES_CUSTOMER_MISMATCH, NO_ELIGIBLE_RECEIVABLES, CUSTOMER_NOT_FOUND, CHANGE_EFFECTIVE_INVALID, CHANGE_NOTHING_CHANGED, FINAL_MONTH_INVALID, PREVIEW_TOKEN_REQUIRED, UPLOAD_INCOMPLETE, UPLOAD_MISMATCH, ATTACHMENT_TARGET_REQUIRED, ATTACHMENT_TARGET_AMBIGUOUS, MIME_TYPE_UNSUPPORTED, FILE_TOO_LARGE, FILENAME_INVALID, ATTACHMENT_NOT_READY, PROJECT_NOT_FOUND, PROFILE_REQUIRED, PROJECT_CUSTOMER_MISMATCH, CATEGORY_NOT_FOUND, CATEGORY_ARCHIVED, TOO_MANY_RECEIPTS, CUSTOMER_REQUIRED_FOR_OWED, CUSTOMER_REQUIRED, CUSTOMER_NOT_LINKED, REASON_RESERVED, EXTERNAL_REFERENCE_NOT_ALLOWED, PAYMENT_HAS_NO_CUSTOMER, COMMISSION_RATE_INVALID, NOT_CONTINGENCY, OUTCOME_DATE_INVALID, COMMISSION_LABEL_REQUIRED, SCHEDULE_REQUIRED, NAME_REQUIRED, GROUP_RANGE_TOO_LONG, GROUP_LIMIT, GROUP_ID_REQUIRED, AMOUNT_REQUIRED, SAME_CURRENCY, COUNTRY_NEEDS_BUSINESS, PASSKEY_NOT_VERIFIED, PERIOD_INVALID, RECEIPT_NUMBER_INVALID, RECEIPT_NUMBER_NOT_ALLOWED, REDUCTION_EXCEEDS_OPEN, USE_CANCEL, REASON_REQUIRED, DRAFT_CONFLICT, DRAFT_REQUIRED, AGREEMENT_TYPE_MISMATCH, PRICING_BASIS_MISMATCH, PAYMENT_NOT_CORRECTABLE, NOTHING_TO_CORRECT, POSTED_INSTALLMENT_CHANGED (schema failures carry the zod issues in details instead).
    A DATE_INVALID on a range check also carries details.bound: past when the date is more than ten years (3660 days) before the organization's today (the floor on every money date, MUT-227), future when it is later than allowed.

    Amounts are canonical decimal strings in the project currency; dates are YYYY-MM-DD in the organization timezone. VAT rates are basis points (1800 = 18 %).

    Payments (M4): a receivable's outstanding = gross − paid − credited. Allocations never cross a customer or a currency. GET /v1/operations/{key} reconciles a lost response: COMPLETED with the stored body, PENDING, or 404 (never completed; retry with the same key is safe).

    Lists paginate with ?limit= (1–200, default 50) and an opaque ?cursor= from the previous page's nextCursor.

    Fee proposals (M7, lifecycle revised in M8) hold the negotiation before an agreement: PROPOSED → APPROVED (POST /v1/fee-proposals/{id}/approve creates the agreement, dated approvedOn, in the same transaction; the first installment posts at once, later ones on their dates) or WITHDRAWN. A proposal may carry the full draft agreement — FIXED with any schedule, CONTINGENCY, or a RETAINER — which approve/preview and approve take in full with a preview token (MUT-479); a retainer proposal's monthly amount stays out of the organization summary's proposed total. One open proposal per project; archiving a project is refused while one is open. Project summaries carry the current proposal; the organization summary carries each customer's open proposals and their per-currency total (proposed).

    Users (MUT-37) are operator-provisioned through /admin/v1/users*: no signup, invite or self-service password reset exists in any environment. A user reaches organizations through memberships.

    Email (MUT-359): when the deployment configures a mailer, setting a password through a setup link and POST /v1/me/password each send the person a "your password was set/changed" notice in their language; the response never depends on it. POST /v1/email/resend/webhook is Resend's Svix-signed bounce and complaint webhook: it suppresses addresses that hard-bounce or complain, so they get no more mail.

    Writability (MUT-39): a session may read a hosted profile's ledger but not write it. A session calling an operation that writes customers, projects, agreements, payments or attachments gets 403 READ_ONLY_PROFILE with details { domain, writerOfRecord } (writerOfRecord is MALAFAT when the profile's Malafat integration is connected, otherwise null); other operations it may not use answer 403 PRINCIPAL_NOT_ACCEPTED.

    Expenses (MUT-42) are a hosted profile's own record, written by the signed-in person: /v1/expenses*, /v1/expense-categories* and /v1/summaries/expenses accept sessions only, never an API key, and nothing about them appears in any operation an API key can call (audit and operations included). Each expense keeps its original amount and currency; summaries are per currency. Receipts use the attachments bucket and signed-URL lifetime. The expenses:read / expenses:write scopes are session-only and cannot be issued to a key.

    Passkeys (MUT-115, ADR-190): one WebAuthn relying party, the apex domain, for the portal (https://app.<apex>) and the iOS app (https://<apex>). A signed-in person adds a passkey with POST /v1/passkeys/creation-options then POST /v1/passkeys (a sign-in at most 10 minutes old, else `currentPassword`: 403 RECENT_SIGN_IN_REQUIRED; at most 10, 409 PASSKEY_LIMIT), renames and removes it under /v1/passkeys/{id}; removing one signs out the sessions it opened. Sign-in: POST /v1/passkey-challenges, then POST /v1/sessions/passkey (cookie) or /v1/device-sessions/passkey (token), with the password sign-in's throttle, lockout and single 401. A password change keeps passkeys. Without WEBAUTHN_RP_ID every passkey operation answers 404.

    Sessions (MUT-38): POST /v1/sessions signs in and sets an httpOnly same-origin cookie. Each operation declares the principals it accepts in `security` (apiKey, session, or both); a request carrying both credentials is refused. Session requests to organization-scoped operations send X-Mutaba3a-Profile; a non-member organization answers 404, like any cross-organization id.

    Income (MUT-65): on a personal profile (no CONNECTED Malafat integration), a session may write customers, projects and payments — the three rows hosted-portal.md §5 marks "read-write on a personal profile" — through the same routes a Malafat-fed profile only reads, plus two new ones: POST /v1/income (kind: received|owed; Owed requires a customerId, explicit or resolved from projectId) and DELETE /v1/income/{id} (undo, 404 for anything not this session's own ADJUSTMENT receivable or unallocated payment). POST /v1/receivables/{id}/settle records a payment against one receivable without the preview/allocation dance. A Malafat-fed profile keeps today's read-only behaviour on all of it (403 READ_ONLY_PROFILE) except what MUT-61 opens below.

    Capture on a Malafat-fed profile (MUT-61): a session may POST /v1/income kind received — never owed (403 READ_ONLY_PROFILE) — for a client this integration has linked (customer.externalReference set; else 422 CUSTOMER_REQUIRED / CUSTOMER_NOT_LINKED), with an optional matter of that client whose currency it must match (422 CURRENCY_MISMATCH). The payment is POSTED, unallocated and origin `capture`; GET /v1/payments?customerId=…&origin=capture&allocationState=unallocated lists what still needs allocating, through the usual allocation preview and POST /v1/payments/{id}/allocations. The person may undo it (DELETE /v1/income/{id}) until any of it is allocated (409 ALREADY_ALLOCATED); once the integration reverses it, their undo answers 409 REVERSED_BY_MALAFAT (the reversal reason "capture_undo" is reserved for the person: 422 REASON_RESERVED). GET /v1/me publishes each profile's rules as `income`.

    Lapse gate (MUT-361, ADR-181): each hosted profile is entitled per GET /v1/me `billing.state`. On a READ_ONLY profile a session (cookie or device) may only read: any other method answers 402 SUBSCRIPTION_LAPSED with details { profileId, state, source, until }. A LOCKED profile answers only GET /v1/records-export and its receipts. The person-level routes (the inbox, GET /v1/entries, GET /v1/summaries/verdict, POST /v1/profiles) follow `billingStanding`, the best state across the person's profiles; GET /v1/entries and GET /v1/summaries/verdict leave LOCKED profiles out (the verdict names them in `unavailable`). Identity (/v1/me*, sessions, password, terms), /v1/billing/* and leaving a profile stay open in every state. An API key is never gated, and nothing is ever deleted.

    Changing a date (MUT-223): on a profile the person owns (their personal profile or one they created), PATCH /v1/income/{id} { occurredOn } moves their own Owed entry or Received entry, and PATCH /v1/payments/{id} { receivedOn } moves their own captured payment, a settle payment included (allocations untouched). Date only, If-Match on `version` (stale → 409 VERSION_MISMATCH). Received entries and payments go no later than the organization's today; an Owed entry may go up to ten years after it (MUT-392), keeping its dueDate unless the new date passes it (then EOM_15 of the new date). Nothing is refused once money is applied: an Owed dated ahead may be settled, or moved ahead after a settle, and counts from its first payment or credit. Anything else answers 404 — on a Malafat-fed profile PATCH /v1/income too, while PATCH /v1/payments answers 403 READ_ONLY_PROFILE there, before any lookup, as settle does. GET /v1/audit never lists these edits.
    Correcting money (MUT-453): on a profile the person owns (`/v1/me` `owned`, its creator or a co-owner; otherwise 403 READ_ONLY_PROFILE, reason NOT_OWNER) whose payments are read-write, POST /v1/payments/{id}/reverse { reason } reverses a payment a person recorded (origin CAPTURE, a settle payment included, whoever recorded it; not one Malafat applied to its own entries), undoing its allocations so the Owed it paid reopens, and POST /v1/receivables/{id}/credits { amount, reason, effectiveDate? } credits an Owed entry (origin ADJUSTMENT) up to what is left (more → 422 CREDIT_EXCEEDS_OUTSTANDING); crediting all of it cancels it. The same routes and codes Malafat's key uses, audited as USER. Malafat's own payments and installments answer 404 to a person; on a Malafat-fed profile both answer 403 READ_ONLY_PROFILE before any lookup. IncomeResponse adds `reversalReason` and `credited`.
    Category names (MUT-464): GET, POST and PATCH /v1/expense-categories show a category the profile was seeded with in the request language — the first ar or en tag of Accept-Language, else the signed-in person's language (Content-Language says which; Vary: Accept-Language). A name a person typed shows as typed. Each category carries `presetKey`, the preset entry it is (`other` for the automatic Other) or null, worked out from the stored name. Adding or renaming to a seeded category's other-language name answers 409 CATEGORY_NAME_TAKEN.

    Summaries (M6) are computed on read: outstanding = overdue + dueToday + notYetDue over OPEN receivables, where an Owed dated ahead counts from its own date, or from its first payment or credit if that comes first, and adds no customer row or currency block until then (MUT-392); statuses are MTB3A's. Attachments are reached only through short-lived signed URLs; 503 ATTACHMENTS_NOT_CONFIGURED when the deployment has no bucket.
    Period totals (MUT-483, ADR-227): GET /v1/summaries/period?from&to&currency (summaries:read; API key, session or device session) returns per currency billed, credited, payments, reversals, received = payments − reversals, and the balance at the start and end (openingBalance, closingBalance, change = closing − opening = billed − received − credited). They are the customer statement's lines summed across clients, plus payments with no client; the ledger as it stands at asOf, so anything dated into a closed month changes it.
tags:
  - name: Operations
    description: Liveness and readiness
  - name: Integration
    description: Credential validation and tenant binding
  - name: Customers
    description: The parties money is owed by
  - name: Projects
    description: Single-currency containers for agreements, receivables and payments
  - name: Import
    description: Batch linking of an external system's customers and projects
  - name: VAT
    description: The firm's effective-dated standard rate
  - name: Fee proposals
    description: "The negotiation before an agreement (fixed, contingency or retainer): proposed, then approved (which creates the agreement) or withdrawn"
  - name: Agreements
    description: Fixed-fee agreements, installments, supplements
  - name: Installments
    description: Manual triggers
  - name: Retainers
    description: Recurring agreements and their monthly charges
  - name: Receivables
    description: What is owed, and credits against it
  - name: Payments
    description: Money received, its allocations, reversals, and the operations lookup
  - name: Sessions
    description: Hosted-portal sign-in, sign-out and the signed-in person
  - name: Passkeys
    description: A signed-in person's passkeys, and the challenge passkey sign-in starts from (MUT-115)
  - name: Profiles
    description: "A signed-in person's own standalone profiles: create, rename, default currency and type (sessions only; never a Malafat organization)"
  - name: Expenses
    description: A hosted profile's expenses, categories, receipts and expense summary (sessions only)
  - name: Receipts
    description: "The receipts library (MUT-255/389): receipts that wait To review before their expense (sessions only). Mounted only where the deployment turns RECEIPTS_LIBRARY on; elsewhere every /v1/receipts path answers 404"
  - name: Income
    description: Received or Owed, captured directly by the signed-in person on a personal profile (sessions only)
  - name: Your data
    description: "Download my records: a profile as the records file the signed-out portal restores, and its receipt files (sessions only)"
  - name: Email
    description: Resend's bounce and complaint webhook (MUT-359)
  - name: Admin
    description: "Operator provisioning: organizations, API keys, users and memberships"
  - name: Operator
    description: "The portal's operator console (MUT-459): a signed-in operator, a passkey step-up on every write; 404 for everyone else"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Organization API key: `Authorization: Bearer mut_live_<prefix>_<secret>`"
    session:
      type: apiKey
      in: cookie
      name: __Host-mut_session
      description: "Hosted-portal session (MUT-38). Set by POST /v1/sessions; httpOnly, SameSite=Strict, same origin only. Organization-scoped calls add X-Mutaba3a-Profile: <organizationId> naming one of the user's memberships."
    deviceSession:
      type: http
      scheme: bearer
      description: "Native-app device session (MUT-64): `Authorization: Bearer mds_<secret>`. Set by POST /v1/device-sessions. Same session principal and writability as the portal cookie session — organization-scoped calls add X-Mutaba3a-Profile: <organizationId> naming one of the user's memberships."
    jobToken:
      type: apiKey
      in: header
      name: X-Job-Token
      description: The nightly Cloud Scheduler job (MUTABA3A_JOB_TOKEN, MUT-360). Opens /jobs/* only.
    googleOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "MUT-441 (R8): a Google-signed OIDC token for the receipt-read queue's or the sweep Scheduler's service account (READ_INVOKER_SA, SWEEP_INVOKER_SA), audience READ_OIDC_AUDIENCE. Opens POST /jobs/v1/receipts/read only."
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Operator token (MUTABA3A_ADMIN_TOKEN). Provisioning only.
  schemas:
    CaptureSource:
      type: string
      enum:
        - app
        - siri
        - widget
        - quick_action
        - share
    TermsStatus:
      type: object
      properties:
        version:
          $ref: "#/components/schemas/TermsVersion"
        accepted:
          type: boolean
      required:
        - version
        - accepted
    TermsVersion:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      example: 2026-10-19
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        time:
          type: string
          format: date-time
        errorReporting:
          type: string
          enum:
            - on
            - off
      required:
        - status
        - version
        - time
        - errorReporting
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - ok
                - failed
          required:
            - database
      required:
        - status
        - checks
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            displayName:
              type: string
            locale:
              $ref: "#/components/schemas/UserLocale"
            malafatSuggestions:
              $ref: "#/components/schemas/MalafatSuggestions"
            trialPrompt:
              $ref: "#/components/schemas/TrialPrompt"
            passkeyPrompt:
              $ref: "#/components/schemas/PasskeyPrompt"
            status:
              $ref: "#/components/schemas/UserStatus"
            closure:
              $ref: "#/components/schemas/AccountClosure"
            features:
              type: array
              items:
                type: string
            operator:
              type: boolean
              enum:
                - true
          required:
            - id
            - email
            - displayName
            - locale
            - malafatSuggestions
            - trialPrompt
            - passkeyPrompt
            - status
            - closure
            - features
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/HostedProfile"
        limits:
          $ref: "#/components/schemas/ProfileLimits"
        currencies:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{3}$
          description: Every currency code this server accepts, in its supported order. Clients offer only the codes they also know and ignore the rest. Servers older than MUT-280 omit the field.
          example:
            - ILS
            - USD
            - EUR
            - JOD
        terms:
          type: object
          nullable: true
          properties:
            version:
              $ref: "#/components/schemas/TermsVersion"
            accepted:
              type: boolean
          required:
            - version
            - accepted
        billingStanding:
          type: string
          nullable: true
          enum:
            - open
            - read-only
            - locked
            - null
      required:
        - user
        - profiles
        - limits
        - currencies
        - terms
        - billingStanding
    UserLocale:
      type: string
      enum:
        - en
        - ar
    MalafatSuggestions:
      type: object
      properties:
        off:
          type: boolean
        dismissed:
          type: array
          items:
            $ref: "#/components/schemas/MalafatMoment"
      required:
        - off
        - dismissed
    MalafatMoment:
      type: string
      enum:
        - business-profile
        - client-threshold
        - second-business
    TrialPrompt:
      type: object
      properties:
        welcomedAt:
          type: string
          nullable: true
          format: date-time
        welcomeAnswer:
          type: string
          nullable: true
          enum:
            - accepted
            - skipped
            - null
        bannerSnoozedUntil:
          type: string
          nullable: true
          format: date-time
      required:
        - welcomedAt
        - welcomeAnswer
        - bannerSnoozedUntil
    PasskeyPrompt:
      type: object
      nullable: true
      properties:
        due:
          type: boolean
        notNowCount:
          type: integer
          minimum: 0
          maximum: 3
        hiddenUntil:
          type: string
          nullable: true
          format: date-time
      required:
        - due
        - notNowCount
        - hiddenUntil
    UserStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED
        - PENDING_REVIEW
    AccountClosure:
      type: object
      nullable: true
      properties:
        requestedAt:
          type: string
          format: date-time
        deleteAfter:
          type: string
          format: date-time
          description: From this instant the account no longer signs in; the hourly job deletes it within the hour
      required:
        - requestedAt
        - deleteAfter
    HostedProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          enum:
            - hosted
        defaultCurrency:
          $ref: "#/components/schemas/Currency"
        timezone:
          type: string
        writerOfRecord:
          type: string
          nullable: true
          enum:
            - MALAFAT
            - null
        access:
          type: object
          additionalProperties:
            type: string
            enum:
              - read-write
              - read
              - none
        income:
          $ref: "#/components/schemas/IncomeCaptureRules"
        isPersonalDefault:
          type: boolean
        owned:
          type: boolean
        owners:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ProfileOwner"
        type:
          type: string
          nullable: true
          enum:
            - PERSONAL
            - BUSINESS
            - null
        version:
          type: integer
          minimum: 1
        firm:
          type: boolean
        role:
          $ref: "#/components/schemas/MembershipRole"
        firmRequestedAt:
          type: string
          nullable: true
          format: date-time
        firmRequestedBy:
          type: object
          nullable: true
          properties:
            userId:
              type: string
              format: uuid
            name:
              type: string
              nullable: true
          required:
            - userId
            - name
        billing:
          type: object
          nullable: true
          properties:
            state:
              type: string
              enum:
                - ACTIVE
                - GRACE
                - READ_ONLY
                - LOCKED
            source:
              type: string
              enum:
                - MALAFAT
                - OPERATOR
                - STRIPE
                - TRIAL
                - NONE
            tier:
              type: string
              nullable: true
              enum:
                - FREELANCER
                - FIRM
                - null
            until:
              type: string
              nullable: true
              format: date-time
          required:
            - state
            - source
            - tier
            - until
      required:
        - id
        - name
        - source
        - defaultCurrency
        - timezone
        - writerOfRecord
        - access
        - income
        - isPersonalDefault
        - owned
        - owners
        - type
        - version
        - firm
        - role
        - firmRequestedAt
        - firmRequestedBy
    Currency:
