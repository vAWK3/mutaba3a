          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Today in the base profile's timezone
        base:
          allOf:
            - $ref: "#/components/schemas/Currency"
            - description: "The currency converted figures are in: the oldest personal profile’s default, else the oldest included profile’s (R4)"
        rates:
          type: object
          nullable: true
          properties:
            date:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Calendar date in the organization timezone, YYYY-MM-DD
            source:
              type: string
              enum:
                - live
                - stale
          required:
            - date
            - source
          description: The ECB reference day the converted figures used; null when no rates were available (every converted figure that needs one is then null)
        profiles:
          type: array
          items:
            type: object
            properties:
              profileId:
                type: string
                format: uuid
              name:
                type: string
              kind:
                type: string
                enum:
                  - BUSINESS
                  - PERSONAL
                  - FIRM
                description: BUSINESS and FIRM lines show net; a PERSONAL line is shown as spent (+ came in)
              shared:
                type: boolean
                description: More than one owner; its whole net counts in the total (R6)
              currencies:
                type: array
                items:
                  type: object
                  properties:
                    currency:
                      $ref: "#/components/schemas/Currency"
                    received:
                      type: string
                      pattern: ^-?\d+(\.\d+)?$
                      description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                    spent:
                      type: string
                      pattern: ^-?\d+(\.\d+)?$
                      description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                    net:
                      type: string
                      pattern: ^-?\d+(\.\d+)?$
                      description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                  required:
                    - currency
                    - received
                    - spent
                    - net
              converted:
                type: object
                nullable: true
                properties:
                  received:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                  spent:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                  net:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                required:
                  - received
                  - spent
                  - net
              history:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                      pattern: ^\d{4}-\d{2}$
                      description: Calendar month, YYYY-MM
                    currencies:
                      type: array
                      items:
                        type: object
                        properties:
                          currency:
                            $ref: "#/components/schemas/Currency"
                          received:
                            type: string
                            pattern: ^-?\d+(\.\d+)?$
                            description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                          spent:
                            type: string
                            pattern: ^-?\d+(\.\d+)?$
                            description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                        required:
                          - currency
                          - received
                          - spent
                  required:
                    - month
                    - currencies
                description: "The 12 calendar months ending with to’s month: received and spent per currency (clients and categories are GET /v1/summaries/activity’s)"
              owed:
                type: object
                properties:
                  currencies:
                    type: array
                    items:
                      type: object
                      properties:
                        currency:
                          $ref: "#/components/schemas/Currency"
                        outstanding:
                          type: string
                          pattern: ^-?\d+(\.\d+)?$
                          description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                        overdue:
                          type: string
                          pattern: ^-?\d+(\.\d+)?$
                          description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                      required:
                        - currency
                        - outstanding
                        - overdue
                  overdueCount:
                    type: integer
                    description: Open entries past their due date
                required:
                  - currencies
                  - overdueCount
              omittedCurrencies:
                type: array
                items:
                  type: string
                description: "Currency codes this API no longer supports (MUT-388) found on this profile’s records: those rows are left out of every figure. Usually empty"
            required:
              - profileId
              - name
              - kind
              - shared
              - currencies
              - converted
              - history
              - owed
              - omittedCurrencies
        total:
          type: object
          properties:
            label:
              type: string
              enum:
                - kept
                - businessNet
              description: kept when a personal profile is included; businessNet otherwise
            currencies:
              type: array
              items:
                type: object
                properties:
                  currency:
                    $ref: "#/components/schemas/Currency"
                  net:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                required:
                  - currency
                  - net
              description: Σ received − spent across every included profile, per currency (never summed across currencies)
            converted:
              type: string
              nullable: true
              pattern: ^-?\d+(\.\d+)?$
              description: The same in base at one rate set; null when a currency has no rate
            inCurrencyOnly:
              allOf:
                - $ref: "#/components/schemas/Currency"
                - nullable: true
                  description: "When converted is null: the currency with the most records, to show on its own"
            sharedInFull:
              type: boolean
            partial:
              type: boolean
              description: "A held profile is in `unavailable`: the totals cover the rest, and usual is null"
          required:
            - label
            - currencies
            - converted
            - inCurrencyOnly
            - sharedInFull
            - partial
        usual:
          type: string
          nullable: true
          pattern: ^-?\d+(\.\d+)?$
          description: Median kept over the up to 6 months before a calendar-month period in which every included profile was complete; null for weeks, years, fewer than 3 such months or missing rates
        owed:
          type: object
          properties:
            currencies:
              type: array
              items:
                type: object
                properties:
                  currency:
                    $ref: "#/components/schemas/Currency"
                  outstanding:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                  overdue:
                    type: string
                    pattern: ^-?\d+(\.\d+)?$
                    description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
                required:
                  - currency
                  - outstanding
                  - overdue
            overdueCount:
              type: integer
              description: Open entries past their due date
            converted:
              type: string
              nullable: true
              pattern: ^-?\d+(\.\d+)?$
              description: Canonical decimal string; exactly the currency's fractional digits; at most 999999999999999 minor units either sign (9999999999999.99 in a 2-decimal currency), else 422 AMOUNT_INVALID
          required:
            - currencies
            - overdueCount
            - converted
        unavailable:
          type: array
          items:
            type: object
            properties:
              profileId:
                type: string
                format: uuid
              name:
                type: string
              code:
                type: string
                enum:
                  - SUBSCRIPTION_LAPSED
                  - INTERNAL
            required:
              - profileId
              - name
              - code
          description: "Profiles left out: locked by billing (SUBSCRIPTION_LAPSED) or that failed to read (INTERNAL)"
      required:
        - from
        - to
        - asOf
        - base
        - rates
        - profiles
        - total
        - usual
        - owed
        - unavailable
