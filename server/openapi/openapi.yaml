openapi: 3.1.0
info:
  title: Mutaba3a Financial API
  version: 1.4.0-m5
  description: |-
    Organization-scoped financial ledger API (MUT/MAL Money v1, Milestones 1–4).

    Scopes: integration:read, integration:write, customers:read, customers:write, projects:read, projects:write, agreements:read, agreements:write, payments:read, payments:write, attachments:read, attachments:write, summaries:read, audit:read.

    Error codes: UNAUTHENTICATED, INVALID_API_KEY, API_KEY_REVOKED, API_KEY_EXPIRED, API_KEY_ENVIRONMENT_MISMATCH, ADMIN_UNAUTHORIZED, INSUFFICIENT_SCOPE, NOT_FOUND, ORGANIZATION_MISMATCH, CONFLICT, OPERATION_IN_PROGRESS, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_REQUIRED, RATE_LIMITED, INTERNAL. Every error is {"error":{"code","message","details?","requestId"}}.

    Financial writes require an `Idempotency-Key` header (8–128 chars). Same key + same body replays the stored outcome; same key + different body is rejected with IDEMPOTENCY_KEY_REUSED.

    PATCH routes require `If-Match: <version>` (optimistic concurrency).

    409 CONFLICT responses carry details.reason, one of: VERSION_MISMATCH, CURRENCY_LOCKED, CUSTOMER_MISMATCH, HAS_ACTIVE_PROJECTS, PREVIEW_STALE, INTEGRATION_NOT_CONNECTED, RATE_ALREADY_SET, AGREEMENT_HAS_POSTED_RECEIVABLES, AGREEMENT_CANCELLED, PROJECT_HAS_OUTSTANDING, ALREADY_REVERSED.

    422 VALIDATION_FAILED responses raised by business rules carry details.reason, one of: AMOUNT_INVALID, VAT_RATE_MISSING, INSTALLMENTS_DO_NOT_SUM, PERCENTS_DO_NOT_SUM, MIXED_INSTALLMENT_BASIS, NO_INSTALLMENTS, TOO_MANY_INSTALLMENTS, NON_POSITIVE_INSTALLMENT, CURRENCY_MISMATCH, PROJECT_ARCHIVED, CUSTOMER_ARCHIVED, NOT_MANUAL, NOT_FIXED, NOT_RECURRING, SUPPLEMENT_EXCEEDS_UNPOSTED, NEW_INSTALLMENT_REQUIRED, NEGATIVE_NEW_INSTALLMENT, BILLING_DAY_INVALID, START_MONTH_INVALID, END_MONTH_INVALID, END_BEFORE_START, DATE_INVALID, TRIGGER_DATE_REQUIRED, ALLOCATION_EXCEEDS_PAYMENT, ALLOCATION_EXCEEDS_OUTSTANDING, ALLOCATION_DUPLICATE, RECEIVABLE_NOT_FOUND, RECEIVABLE_NOT_OPEN, RECEIVABLE_CUSTOMER_MISMATCH, PAYMENT_NOT_POSTED, NO_UNALLOCATED_FUNDS, CREDIT_EXCEEDS_OUTSTANDING, REPLACES_NOT_REVERSED, REPLACES_CUSTOMER_MISMATCH, NO_ELIGIBLE_RECEIVABLES, CUSTOMER_NOT_FOUND, CHANGE_EFFECTIVE_INVALID, CHANGE_NOTHING_CHANGED, FINAL_MONTH_INVALID, PREVIEW_TOKEN_REQUIRED (schema failures carry the zod issues in details instead).

    Amounts are canonical decimal strings in the project currency; dates are YYYY-MM-DD in the organization timezone. VAT rates are basis points (1800 = 18 %).

    Payments (M4): a receivable's outstanding = gross − paid − credited. Allocations never cross a customer or a currency. GET /v1/operations/{key} reconciles a lost response: COMPLETED with the stored body, PENDING, or 404 (never completed; retry with the same key is safe).

    Lists paginate with ?limit= (1–200, default 50) and an opaque ?cursor= from the previous page's nextCursor.
tags:
  - name: Operations
    description: Liveness and readiness
  - name: Integration
    description: Credential validation and tenant binding
  - name: Customers
    description: The parties money is owed by
  - name: Projects
    description: Single-currency containers for agreements, receivables and payments
  - name: Import
    description: Batch linking of an external system's customers and projects
  - name: VAT
    description: The firm's effective-dated standard rate
  - name: Agreements
    description: Fixed-fee agreements, installments, supplements
  - name: Installments
    description: Manual triggers
  - name: Retainers
    description: Recurring agreements and their monthly charges
  - name: Receivables
    description: What is owed, and credits against it
  - name: Payments
    description: Money received, its allocations, reversals, and the operations lookup
  - name: Admin
    description: Operator provisioning
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Organization API key: `Authorization: Bearer mut_live_<prefix>_<secret>`"
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Operator token (MUTABA3A_ADMIN_TOKEN). Provisioning only.
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        time:
          type: string
          format: date-time
      required:
        - status
        - version
        - time
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - ok
                - failed
          required:
            - database
      required:
        - status
        - checks
    IntegrationStatusResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        apiKey:
          $ref: "#/components/schemas/ApiKeySummary"
        requiredScopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        missingScopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        integration:
          $ref: "#/components/schemas/Integration"
        server:
          type: object
          properties:
            version:
              type: string
            apiVersion:
              type: string
              enum:
                - v1
            time:
              type: string
              format: date-time
          required:
            - version
            - apiVersion
            - time
      required:
        - organization
        - apiKey
        - requiredScopes
        - missingScopes
        - integration
        - server
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        defaultCurrency:
          $ref: "#/components/schemas/Currency"
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - defaultCurrency
        - timezone
        - createdAt
    Currency:
      type: string
      enum:
        - ILS
        - USD
        - EUR
    ApiKeySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        environment:
          type: string
          enum:
            - live
            - test
        masked:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          nullable: true
          format: date-time
        expiresAt:
          type: string
          nullable: true
          format: date-time
        revokedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - name
        - environment
        - masked
        - scopes
        - createdAt
        - lastUsedAt
        - expiresAt
        - revokedAt
    Scope:
      type: string
      enum:
        - integration:read
        - integration:write
        - customers:read
        - customers:write
        - projects:read
        - projects:write
        - agreements:read
        - agreements:write
        - payments:read
        - payments:write
        - attachments:read
        - attachments:write
        - summaries:read
        - audit:read
    Integration:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
            - MALAFAT
        externalTenantId:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
            - CONNECTED
            - DISCONNECTED
        connectedAt:
          type: string
          format: date-time
        disconnectedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - provider
        - externalTenantId
        - displayName
        - status
        - connectedAt
        - disconnectedAt
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - INVALID_API_KEY
                - API_KEY_REVOKED
                - API_KEY_EXPIRED
                - API_KEY_ENVIRONMENT_MISMATCH
                - ADMIN_UNAUTHORIZED
                - INSUFFICIENT_SCOPE
                - NOT_FOUND
                - ORGANIZATION_MISMATCH
                - CONFLICT
                - OPERATION_IN_PROGRESS
                - VALIDATION_FAILED
                - IDEMPOTENCY_KEY_REUSED
                - IDEMPOTENCY_KEY_REQUIRED
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            details:
              nullable: true
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
      required:
        - error
    BindIntegrationResponse:
      type: object
      properties:
        integration:
          $ref: "#/components/schemas/Integration"
        created:
          type: boolean
      required:
        - integration
        - created
    BindIntegrationRequest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - MALAFAT
        externalTenantId:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - provider
        - externalTenantId
        - displayName
    DisconnectIntegrationResponse:
      type: object
      properties:
        integration:
          $ref: "#/components/schemas/Integration"
        apiKeyRevoked:
          type: boolean
          enum:
            - true
      required:
        - integration
        - apiKeyRevoked
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        status:
          $ref: "#/components/schemas/EntityStatus"
        archivedAt:
          type: string
          nullable: true
          format: date-time
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - phone
        - notes
        - vatTreatment
        - status
        - archivedAt
        - externalReference
        - version
        - createdAt
        - updatedAt
    VatTreatment:
      type: string
      nullable: true
      enum:
        - STANDARD_RATED
        - ZERO_RATED
        - EXEMPT
        - OUT_OF_SCOPE
        - null
    EntityStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    ExternalReference:
      type: object
      nullable: true
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        externalId:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - provider
        - externalId
    Provider:
      type: string
      enum:
        - MALAFAT
    CreateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          maxLength: 254
          format: email
        phone:
          type: string
          minLength: 1
          maxLength: 64
        notes:
          type: string
          maxLength: 4000
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
      required:
        - name
    CustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor
    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          nullable: true
          maxLength: 254
          format: email
        phone:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
        notes:
          type: string
          nullable: true
          maxLength: 4000
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        status:
          $ref: "#/components/schemas/EntityStatus"
        archivedAt:
          type: string
          nullable: true
          format: date-time
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - name
        - currency
        - vatTreatment
        - status
        - archivedAt
        - externalReference
        - version
        - createdAt
        - updatedAt
    CreateProjectRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          $ref: "#/components/schemas/Currency"
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
      required:
        - customerId
        - name
        - currency
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          $ref: "#/components/schemas/Currency"
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
      additionalProperties: false
    ImportPreviewResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportPlanRow"
        totals:
          type: object
          properties:
            create:
              type: integer
            link:
              type: integer
            conflict:
              type: integer
          required:
            - create
            - link
            - conflict
        previewToken:
          type: string
          minLength: 64
          maxLength: 64
      required:
        - rows
        - totals
        - previewToken
    ImportPlanRow:
      type: object
      properties:
        index:
          type: integer
        entityType:
          type: string
          enum:
            - CUSTOMER
            - PROJECT
        externalId:
          type: string
        action:
          type: string
          enum:
            - create
            - link
            - conflict
        existingId:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - UNKNOWN_CUSTOMER
            - CUSTOMER_MISMATCH
            - CURRENCY_DIFFERS
            - VALIDATION
        detail:
          type: string
          enum:
            - EMPTY_NAME
            - NAME_TOO_LONG
            - UNSUPPORTED_CURRENCY
            - DUPLICATE_IN_BATCH
        warnings:
          type: array
          items:
            type: string
            enum:
              - NAME_DIFFERS
              - ARCHIVED
      required:
        - index
        - entityType
        - externalId
        - action
        - warnings
    ImportPreviewRequest:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRow"
          maxItems: 500
      required:
        - provider
        - rows
    ImportRow:
      oneOf:
        - type: object
          properties:
            entityType:
              type: string
              enum:
                - CUSTOMER
            externalId:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              maxLength: 1000
            email:
              type: string
              maxLength: 254
              format: email
            phone:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - entityType
            - externalId
            - name
        - type: object
          properties:
            entityType:
              type: string
              enum:
                - PROJECT
            externalId:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              maxLength: 1000
            currency:
              type: string
              minLength: 1
              maxLength: 8
            customerExternalId:
              type: string
              minLength: 1
              maxLength: 128
          required:
            - entityType
            - externalId
            - name
            - currency
            - customerExternalId
    ImportCommitResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportCommitRow"
        totals:
          type: object
          properties:
            created:
              type: integer
            linked:
              type: integer
            failed:
              type: integer
          required:
            - created
            - linked
            - failed
      required:
        - rows
        - totals
    ImportCommitRow:
      type: object
      properties:
        index:
          type: integer
        entityType:
          type: string
          enum:
            - CUSTOMER
            - PROJECT
        externalId:
          type: string
        outcome:
          type: string
          enum:
            - created
            - linked
            - failed
        id:
          type: string
          format: uuid
        reason:
          type: string
        warnings:
          type: array
          items:
            type: string
            enum:
              - NAME_DIFFERS
              - ARCHIVED
      required:
        - index
        - entityType
        - externalId
        - outcome
        - warnings
    ImportCommitRequest:
      allOf:
        - $ref: "#/components/schemas/ImportPreviewRequest"
        - type: object
          properties:
            previewToken:
              type: string
              minLength: 64
              maxLength: 64
          required:
            - previewToken
    VatRatesResponse:
      type: object
      properties:
        rates:
          type: array
          items:
            $ref: "#/components/schemas/VatRate"
        current:
          allOf:
            - $ref: "#/components/schemas/VatRate"
            - nullable: true
      required:
        - rates
        - current
    VatRate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        effectiveFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar date in the organization timezone, YYYY-MM-DD
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - rateBasisPoints
        - effectiveFrom
        - createdAt
    SetVatRateRequest:
      type: object
      properties:
        rateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: 1800 = 18 %
        effectiveFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar date in the organization timezone, YYYY-MM-DD
      required:
        - rateBasisPoints
        - effectiveFrom
    AgreementPreviewResponse:
      type: object
      properties:
        totals:
          type: object
          properties:
            amount:
              type: string
              pattern: ^-?\d+(\.\d+)?$
              description: Canonical decimal string; exactly the currency's fractional digits
            net:
              type: string
              pattern: ^-?\d+(\.\d+)?$
              description: Canonical decimal string; exactly the currency's fractional digits
            vat:
              type: string
              pattern: ^-?\d+(\.\d+)?$
              description: Canonical decimal string; exactly the currency's fractional digits
            gross:
              type: string
              pattern: ^-?\d+(\.\d+)?$
              description: Canonical decimal string; exactly the currency's fractional digits
          required:
            - amount
            - net
            - vat
            - gross
        vatRateBasisPoints:
          type: integer
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        currency:
          $ref: "#/components/schemas/Currency"
        installments:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              label:
                type: string
              amount:
                type: string
                pattern: ^-?\d+(\.\d+)?$
                description: Canonical decimal string; exactly the currency's fractional digits
              net:
                type: string
                pattern: ^-?\d+(\.\d+)?$
                description: Canonical decimal string; exactly the currency's fractional digits
              vat:
                type: string
                pattern: ^-?\d+(\.\d+)?$
                description: Canonical decimal string; exactly the currency's fractional digits
              gross:
                type: string
                pattern: ^-?\d+(\.\d+)?$
                description: Canonical decimal string; exactly the currency's fractional digits
              vatTreatment:
                $ref: "#/components/schemas/VatTreatment"
              rateBasisPoints:
                type: integer
              trigger:
                $ref: "#/components/schemas/InstallmentTrigger"
              paymentTerms:
                $ref: "#/components/schemas/PaymentTerms"
              dueDate:
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
                description: Calendar date in the organization timezone, YYYY-MM-DD
              status:
                $ref: "#/components/schemas/ItemStatus"
            required:
              - position
              - label
              - amount
              - net
              - vat
              - gross
              - vatTreatment
              - rateBasisPoints
              - trigger
              - paymentTerms
              - dueDate
              - status
        previewToken:
          type: string
          minLength: 64
          maxLength: 64
      required:
        - totals
        - vatRateBasisPoints
        - vatTreatment
        - currency
        - installments
        - previewToken
    InstallmentTrigger:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/TriggerType"
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar date in the organization timezone, YYYY-MM-DD
      required:
        - type
    TriggerType:
      type: string
      enum:
        - IMMEDIATE
        - DATE
        - MANUAL
    PaymentTerms:
      type: string
      nullable: true
      enum:
        - IMMEDIATE
        - EOM
        - EOM_15
        - EOM_30
        - EOM_45
        - EOM_60
        - null
    ItemStatus:
      type: string
      enum:
        - PENDING
        - DUE
        - OVERDUE
        - PARTIALLY_PAID
        - PAID
        - VOID
    AgreementPreviewRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        amount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Canonical decimal string; exactly the currency's fractional digits
        currency:
          $ref: "#/components/schemas/Currency"
        pricingBasis:
          $ref: "#/components/schemas/PricingBasis"
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        agreementDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar date in the organization timezone, YYYY-MM-DD
        description:
          type: string
          maxLength: 500
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        installments:
          type: array
          items:
            $ref: "#/components/schemas/InstallmentSpec"
          minItems: 1
          maxItems: 60
      required:
        - projectId
        - amount
        - pricingBasis
        - agreementDate
        - installments
    PricingBasis:
      type: string
      enum:
        - VAT_EXCLUSIVE
        - VAT_INCLUSIVE
    InstallmentSpec:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Canonical decimal string; exactly the currency's fractional digits
        percentBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        vatTreatment:
          $ref: "#/components/schemas/VatTreatment"
        trigger:
          $ref: "#/components/schemas/InstallmentTrigger"
        paymentTerms:
          $ref: "#/components/schemas/PaymentTerms"
        dueDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar date in the organization timezone, YYYY-MM-DD
      required:
        - label
