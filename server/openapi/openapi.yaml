      tags:
        - Agents
      summary: The agent asking to connect (MUT-434)
      description: "What the consent page shows. Answers even without agent_access (agentAccess: false), so the page can refuse clearly and send the person back to the agent."
      security:
        - session: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: requestId
          in: path
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAuthorizationRequest"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PRINCIPAL_NOT_ACCEPTED, CROSS_SITE_REQUEST or ACCOUNT_CLOSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: NOT_FOUND — decided, expired (30 minutes) or unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OAUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/oauth/requests/{requestId}/decision:
    post:
      tags:
        - Agents
      summary: Allow or deny an agent (MUT-434)
      description: Allow creates the connection and returns the agent’s redirect with a one-time code; deny returns it with error=access_denied. Either way, send the browser to redirectTo.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: requestId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthDecisionRequest"
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDecision"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: FEATURE_NOT_ENABLED (allow without agent_access), PRINCIPAL_NOT_ACCEPTED, CROSS_SITE_REQUEST or ACCOUNT_CLOSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: CONFLICT (reason REQUEST_GONE) — already answered or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OAUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/oauth/grants:
    get:
      tags:
        - Agents
      summary: Your connected agents (MUT-434)
      security:
        - session: []
      responses:
        "200":
          description: Live connections, newest first, and the MCP address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthGrantList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: FEATURE_NOT_ENABLED, PRINCIPAL_NOT_ACCEPTED or ACCOUNT_CLOSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OAUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/oauth/grants/{grantId}:
    delete:
      tags:
        - Agents
      summary: Disconnect an agent (MUT-434)
      description: It loses access on its next call. Allowed without agent_access, so a person can always disconnect.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: grantId
          in: path
      responses:
        "204":
          description: Disconnected
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PRINCIPAL_NOT_ACCEPTED, CROSS_SITE_REQUEST or ACCOUNT_CLOSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: NOT_FOUND — no such live connection of yours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: OAUTH_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /jobs/v1/oauth/cleanup:
    post:
      tags:
        - Admin
      summary: Nightly OAuth housekeeping for MCP agents (Cloud Scheduler)
      description: Deletes expired consent requests and codes, the tokens of grants that ended a week ago, and registered clients that never got a grant within 30 days. Answers counts only.
      security:
        - jobToken: []
      responses:
        "200":
          description: What was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthCleanupSummary"
        "401":
          description: JOB_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: JOBS_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
