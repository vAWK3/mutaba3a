      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthGrant"
        mcpUrl:
          type: string
          format: uri
          description: The address to paste into Claude
      required:
        - items
        - mcpUrl
    OAuthGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientName:
          type: string
        clientKind:
          type: string
          enum:
            - DCR
            - CIMD
        trust:
          type: string
          enum:
            - VERIFIED
            - LOOPBACK
            - UNVERIFIED
          description: "From the redirect the code goes to, never the client’s own name: VERIFIED = Claude (claude.ai/claude.com), LOOPBACK = an app on this computer (e.g. Claude Code), UNVERIFIED = anyone else"
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - write
        connectedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          nullable: true
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id
        - clientName
        - clientKind
        - trust
        - scopes
        - connectedAt
        - lastUsedAt
        - expiresAt
    OAuthCleanupSummary:
      type: object
      properties:
        requests:
          type: integer
        codes:
          type: integer
        tokens:
          type: integer
        clients:
          type: integer
      required:
        - requests
        - codes
        - tokens
        - clients
  parameters: {}
