paths:
  /health:
    get:
      tags:
        - Operations
      summary: Liveness
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      tags:
        - Operations
      summary: Readiness (database reachable)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /v1/integration:
    get:
      tags:
        - Integration
      summary: Validate the API key and describe its organization, scopes and binding
      security:
        - apiKey: []
      responses:
        "200":
          description: Credential is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
        "401":
          description: Missing, malformed, unknown, revoked, expired or wrong-environment key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Key lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/integration/bind:
    post:
      tags:
        - Integration
      summary: Bind this organization to the calling system’s tenant
      description: Idempotent. Re-binding the same tenant returns the existing binding; binding a different tenant while one is CONNECTED is rejected with ORGANIZATION_MISMATCH. A DISCONNECTED binding to the same tenant is reconnected, keeping its id so external references survive (plan §10.4).
      security:
        - apiKey: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 128
            description: Client-generated key, unique per operation attempt (plan §14.2).
          required: true
          description: Client-generated key, unique per operation attempt (plan §14.2).
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindIntegrationRequest"
      responses:
        "200":
          description: Already bound to this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindIntegrationResponse"
        "201":
          description: Bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindIntegrationResponse"
        "401":
          description: Missing, malformed, unknown, revoked, expired or wrong-environment key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Key lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Bound to a different tenant, or the tenant is bound to another organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation or idempotency-key failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/integration/disconnect:
    post:
      tags:
        - Integration
      summary: Disconnect the binding and revoke the calling key
      description: Financial history and external references are preserved (plan §10.4). The calling API key is revoked; the response is the last one it can make.
      security:
        - apiKey: []
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectIntegrationResponse"
        "401":
          description: Missing, malformed, unknown, revoked, expired or wrong-environment key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Key lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No binding exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/api-keys/self/revoke:
    post:
      tags:
        - Integration
      summary: "Revoke the calling key (rotation: validate the new key first, then call this with the old one)"
      description: Idempotent. The binding is untouched; only this key stops working. Audited.
      security:
        - apiKey: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeySummary"
        "401":
          description: Missing, malformed, unknown, revoked, expired or wrong-environment key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Key lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/customers:
    post:
      tags:
        - Customers
      summary: Create a customer
      description: "With `externalReference`, creation is idempotent on that reference: a known reference returns the existing customer with 200 and changes nothing. Requires a CONNECTED integration for the provider."
      security:
        - apiKey: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 128
            description: Client-generated key, unique per operation attempt (plan §14.2).
          required: true
          description: Client-generated key, unique per operation attempt (plan §14.2).
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "200":
          description: Already exists for this external reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Missing, malformed, unknown, revoked, expired or wrong-environment key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Key lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Conflict; `details.reason` says which (see the API description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation or idempotency-key failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags:
        - Customers
      summary: List customers
      security:
        - apiKey: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Page size, 1–200.
          required: false
          description: Page size, 1–200.
