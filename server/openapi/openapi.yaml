        - session: []
        - deviceSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountRequest"
      responses:
        "200":
          description: Closing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseAccountResponse"
        "403":
          description: CURRENT_PASSWORD_WRONG (wrong password, or the account is locked), ACCOUNT_CLOSING, CROSS_SITE_REQUEST or PRINCIPAL_NOT_ACCEPTED
          content:
            application/json:
              schema:
