            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: PRINCIPAL_NOT_ACCEPTED or CROSS_SITE_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: TERMS_VERSION_STALE — `version` is not the current terms; details.current names it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me/password:
    post:
      tags:
        - Sessions
      summary: Change your own password (MUT-237)
      description: "Revokes every other session, web and device. This session stays signed in under a new token (MUT-262), so a leaked copy of the old one stops working too: a cookie session always gets a new cookie (204, Set-Cookie, never past the old absolute deadline); a device session gets one only when it sends `rotateToken: true`, in a 200 body, and otherwise keeps its token (204). A wrong current password counts toward the same lockout a wrong sign-in attempt would."
      security:
        - session: []
        - deviceSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Password changed; a device session that sent `rotateToken: true` continues under this token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangedToken"
        "204":
          description: Password changed; a cookie session continues under the new cookie set here, a device session that did not ask keeps its token
        "403":
          description: CURRENT_PASSWORD_WRONG (the current password is wrong, the account is locked, or another change landed first), CROSS_SITE_REQUEST or PRINCIPAL_NOT_ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed (the new password is 12 to 128 characters; the current one at most 1024)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
