          description: INVALID_CREDENTIALS — the same answer for every refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CROSS_SITE_REQUEST, or ACCOUNT_UNDER_REVIEW — the right password for a self-service account the operator has not approved yet (MUT-367); no session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/sessions/passkey:
    post:
      tags:
        - Sessions
      summary: Sign in with a passkey (sets the session cookie) (MUT-115)
      description: "Send the `challengeId` from POST /v1/passkey-challenges and the platform's assertion (WebAuthn JSON). The same same-origin check, IP budget, throttle and lockout as the password sign-in: a failed assertion counts toward the account's lockout, and every refusal is the same 401."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignInRequest"
      responses:
        "201":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: INVALID_CREDENTIALS — the same answer for every refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CROSS_SITE_REQUEST, or ACCOUNT_UNDER_REVIEW (as the password sign-in)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: NOT_FOUND — passkeys are not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/sessions/current:
