        - items
        - nextCursor
    UpdateConversionRequest:
      type: object
      properties:
        occurredOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: "Calendar date in the organization timezone, YYYY-MM-DD. Not later than the organization's today and not more than ten years (3660 days) before it: 422 DATE_INVALID with details.bound future or past. Checked only when it differs from the stored date."
        amount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: In the merged currency's fractional digits (the body's `currency`, else the row's)
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
            - description: Only together with `amount`
        toAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: In the merged toCurrency's fractional digits
        toCurrency:
          allOf:
            - $ref: "#/components/schemas/Currency"
            - description: Only together with `toAmount`; must differ from the merged `currency`
        notes:
          type: string
          nullable: true
          maxLength: 4000
      additionalProperties: false
    FxRatesResponse:
      type: object
      properties:
        base:
          $ref: "#/components/schemas/Currency"
        rateDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: The ECB reference date the rates are for (its last business day), YYYY-MM-DD
          example: 2026-10-15
        fetchedAt:
          type: string
          format: date-time
          description: When this server instance read the rates from the provider
        source:
          type: string
          enum:
            - live
            - stale
          description: live = inside the cache window; stale = the last refresh failed and these are the last good rates
        rates:
          type: array
          items:
            $ref: "#/components/schemas/FxRate"
          description: Every supported currency, base included (rate 1), in the supported-currency order
      required:
        - base
        - rateDate
        - fetchedAt
        - source
        - rates
    FxRate:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        rate:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Units of `currency` per 1 `base`, rounded to 6 decimal places
          example: 0.322356
        derived:
          type: boolean
          description: "True when either side of the pair is pegged to the US dollar (never base→base): the ECB publishes no rate for it, so the rate comes from its USD peg (1 USD = 0.709 JOD)"
      required:
        - currency
        - rate
        - derived
