[package]
name = "app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"

# OAuth loopback callback (MUT-28): a one-shot axum listener on 127.0.0.1.
# Device sync and its crates were retired in MUT-73 (ADR-053).
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tauri-plugin-opener = "2"

# Test-only: retired_sync.rs's tests write and remove files in a temp dir.
# (Declared by MUT-28 for the sync persistence tests, which MUT-73 removed.)
[dev-dependencies]
tempfile = "3"
