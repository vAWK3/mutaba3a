<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/index.css">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E6E2ED}a{color:#795DBA}a:hover{color:#533C87}</style>
</helmet>
<div id="fg" dir="rtl" style="position:relative;width:1024px;height:500px;overflow:hidden;background:#FCF6ED;display:flex;align-items:center;padding:0 88px;box-sizing:border-box;font-family:'Thmanyah Sans',sans-serif">
  <svg width="560" height="560" viewBox="0 0 100 100" style="position:absolute;left:-60px;top:-30px">
    <path d="M2 46 A44 44 0 0 1 46 2 L46 46 Z" fill="#BCABF1"></path>
    <circle cx="76" cy="24" r="22" fill="#795DBA"></circle>
    <path d="M2 98 A44 44 0 0 1 46 54 A44 44 0 0 1 2 98 Z" fill="#F499A7"></path>
    <path d="M54 54 H98 A44 44 0 0 1 54 98 Z" fill="#F5AB77"></path>
  </svg>
  <div style="position:relative;display:flex;flex-direction:column;gap:18px;max-width:440px">
    <span style="font-family:'Thmanyah Serif Display',serif;font-weight:700;font-size:112px;line-height:1;color:#392F4B">متابعة</span>
    <span style="font-size:30px;line-height:1.45;color:#675D7C;text-wrap:pretty">دخلك، مصروفاتك، وفواتيرك — في مكان واحد هادئ.</span>
    <div style="display:flex;gap:10px">
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#BAEBD4;color:#00624B;font-size:18px;font-weight:500;display:flex;align-items:center">الدخل</span>
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#FED4B9;color:#883C00;font-size:18px;font-weight:500;display:flex;align-items:center">المصروفات</span>
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#E0D7FF;color:#533C87;font-size:18px;font-weight:500;display:flex;align-items:center">الفواتير</span>
    </div>
  </div>
</div>
<div id="fg-en" dir="ltr" style="position:relative;width:1024px;height:500px;overflow:hidden;background:#FCF6ED;display:flex;align-items:center;padding:0 88px;box-sizing:border-box;font-family:'Thmanyah Sans',sans-serif;margin-top:24px">
  <svg width="560" height="560" viewBox="0 0 100 100" style="position:absolute;right:-60px;top:-30px">
    <path d="M2 46 A44 44 0 0 1 46 2 L46 46 Z" fill="#BCABF1"></path>
    <circle cx="76" cy="24" r="22" fill="#795DBA"></circle>
    <path d="M2 98 A44 44 0 0 1 46 54 A44 44 0 0 1 2 98 Z" fill="#F499A7"></path>
    <path d="M54 54 H98 A44 44 0 0 1 54 98 Z" fill="#F5AB77"></path>
  </svg>
  <div style="position:relative;display:flex;flex-direction:column;gap:20px;max-width:460px">
    <span style="font-family:Bitter,serif;font-weight:700;font-size:92px;line-height:1;letter-spacing:-.02em;color:#392F4B">Mutaba3a</span>
    <span style="font-family:Bitter,serif;font-weight:500;font-size:28px;line-height:1.4;color:#675D7C;text-wrap:pretty">Income, expenses and invoices — in one calm place.</span>
    <div style="display:flex;gap:10px">
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#BAEBD4;color:#00624B;font-family:Bitter,serif;font-size:17px;font-weight:500;display:flex;align-items:center">Income</span>
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#FED4B9;color:#883C00;font-family:Bitter,serif;font-size:17px;font-weight:500;display:flex;align-items:center">Expenses</span>
      <span style="height:40px;padding:0 18px;border-radius:999px;background:#E0D7FF;color:#533C87;font-family:Bitter,serif;font-size:17px;font-weight:500;display:flex;align-items:center">Invoices</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:1024}}"></script>

</html>
