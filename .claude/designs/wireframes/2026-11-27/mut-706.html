/* Meter rows, shared by MUT-733, MUT-754 (portal) and MUT-706 / MUT-756 (phone). Level: ok < 80% ≤ near < 90% ≤ nudge < 100% ≤ cap. */
function levelOf(used, cap) { const r = used / cap; return r >= 1 ? 'cap' : r >= 0.9 ? 'nudge' : r >= 0.8 ? 'near' : 'ok'; }
function meter({ label, used, cap, grace = '', style = 'A', upgrade = '' }) {
  const lv = levelOf(used, cap);
  const warn = !grace && (lv === 'nudge' || lv === 'cap');
  const pct = Math.min(100, Math.round((used / cap) * 100));
  const count = t('ofCap', { u: num(used), c: num(cap) });
  const status = grace ? `<span class="sub ok-ink">${t('noLimitUntil', { d: day(grace) })}</span>` : lv === 'cap' ? `<span class="sub warn-ink">${t('limitReached')}</span>` : '';
  const up = upgrade && warn ? lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' }) : '';
  const aria = `aria-label="${esc(label)}, ${used} / ${cap}"`;
  if (style === 'B') {
    return `<div class="row" ${aria}><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span></div>`;
  }
  if (style === 'C') {
    return `<div class="card" ${aria} style="${warn ? 'border-color:var(--m-butter-ink)' : ''}"><div class="sub">${label}</div><div class="big ${warn ? 'warn-ink' : ''}" style="font-size:1.75rem">${num(used)}<span class="sub" style="font-size:var(--text-label)"> / ${num(cap)}</span></div><div class="bar ${warn ? 'warn' : ''}" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div>${status || '<span class="sub">&nbsp;</span>'}${up ? `<div>${up}</div>` : ''}</div>`;
  }
  return `<div class="row" ${aria} style="flex-wrap:wrap;row-gap:6px"><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span><div class="bar ${warn ? 'warn' : ''}" style="flex-basis:100%"><i style="width:${pct}%"></i></div>${up ? `<div style="flex-basis:100%;margin-block:-8px">${up}</div>` : ''}</div>`;
}
function meters(list, style, { upgrade = '' } = {}) {
  if (style === 'C') return `<div class="grid2">${list.map((m) => meter({ ...m, style, upgrade })).join('')}</div>`;
  const anyWarn = list.some((m) => !m.grace && ['nudge', 'cap'].includes(levelOf(m.used, m.cap)));
  const tail = style === 'B' && upgrade && anyWarn ? row(`<span class="grow"></span>${lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' })}`) : '';
  return `<div class="rg">${list.map((m) => meter({ ...m, style, upgrade })).join('')}${tail}</div>`;
}

/* Toolbar and rendering */
function render() {

      ${['auto', 'light', 'dark'].map((m) => pb('thm', m, S.theme === m, t(m))).join('')}</div>
    ${APP.screens.length > 1 ? `<div class="r"><span class="lbl">${t('screen')}</span>${APP.screens.map((s) => pb('scr', s.id, s.id === sc.id, L(s.name))).join('')}</div>` : ''}
    <div class="r"><span class="lbl">${t('variant')}</span>${['A', 'B', 'C'].map((k) => `<button class="tb" data-var="${k}" aria-pressed="${k === v}">${k} · ${L(sc.names[k])}${k === sc.rec ? '<span class="star" title="' + t('recommended') + '">★</span>' : ''}</button>`).join('')}</div>
    ${sc.states ? `<div class="r"><span class="lbl">${t('state')}</span>${sc.states.map((s) => pb('st', s.id, s.id === st, L(s.label))).join('')}</div>` : ''}`;
  const d = sc.desk ? sc.desk(ctx) : null;
  let p = sc.phone ? sc.phone(ctx) : null;
  const tr = `<ul class="tradeoffs">${['A', 'B', 'C'].map((k) => `<li class="${k === v ? 'on' : ''}" dir="ltr"><b>${k}</b>${escH(sc.trade[k])}${k === sc.rec ? '<span class="rec">recommended</span>' : ''}</li>`).join('')}</ul>`;
  const note = sc.note ? `<p class="note" dir="ltr">${escH(sc.note)}</p>` : '';
  const none = (why) => `<div class="none" dir="ltr">${escH(why)}</div>`;
  let stage;
  if (Array.isArray(p)) {
    const phones = `<div class="stage phones">${p.map((ph) => `<div class="pcol"><p class="cap">${ph.cap}</p>${ph.html}</div>`).join('')}</div>`;
    stage = (d ? `<p class="cap">${t('desk')}</p>${d}<div style="height:24px"></div>` : sc.noDesk ? none(sc.noDesk) + '<div style="height:16px"></div>' : '') + `<p class="cap">${t('phone')}</p>` + phones;
  } else {
    const left = d ? `<div><p class="cap">${t('desk')}</p>${d}</div>` : `<div><p class="cap">${t('desk')}</p>${none(sc.noDesk || t('noSurface'))}</div>`;
    const right = p ? `<div class="pcol"><p class="cap">${t('phone')}</p>${p}</div>` : `<div class="pcol"><p class="cap">${t('phone')}</p>${none(sc.noPhone || t('noSurface'))}</div>`;

function setX(spec) {
  for (const part of spec.split(';')) {
    if (!part) continue;
    const [k, val] = part.split('=');
    if (val === 'null') delete S.x[k]; else if (val === '!') S.x[k] = !S.x[k]; else S.x[k] = val;
  }
}
function boot() {
  try { const saved = JSON.parse(localStorage.getItem('wf:' + APP.docTitle) || '{}'); if (saved.lang) S.lang = saved.lang; if (saved.theme) S.theme = saved.theme; } catch (e) { /* private mode */ }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-scr],[data-var],[data-st],[data-lang],[data-thm],[data-x]');
    if (!b) return;
    const ds = b.dataset;
    if (ds.scr) { S.scr = ds.scr; S.x = {}; }
    else if (ds.var) { S.v[S.scr] = ds.var; S.x = {}; }
    else if (ds.st) { S.st[S.scr] = ds.st; S.x = {}; }
    else if (ds.lang) S.lang = ds.lang;
    else if (ds.thm) S.theme = ds.thm;
    else if (ds.x) setX(ds.x);
    try { localStorage.setItem('wf:' + APP.docTitle, JSON.stringify({ lang: S.lang, theme: S.theme })); } catch (err) { /* ignore */ }
    render();
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-xs]'); if (el) { S.x[el.dataset.xs] = el.value; render(); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-x]')) { e.preventDefault(); e.target.click(); } });
  render();
}

function pickPhones(c) {
  const k = PICK[c.st]; const cap = PLANS[k.plan].biz; const list = BIZ.slice(0, k.owned);
  const kept = list.filter((b) => S.x['keep_' + b.id]); const n = kept.length;
  const entry = phone({ title: L(BIZ[2]), back: true, tabs: 'home', body: banner('warning', `<b>${t('readOnly')}</b><br>${t('bizLimit', { n: num(cap), p: pn(k.plan) })}`, lb(t('chooseBiz'))) + `<div class="none">—</div>` });
  const counter = `<div class="kv" style="padding-top:0"><b>${t('activeBiz')}</b><span class="num ${n === cap ? 'ok-ink' : ''}">${t('chosen', { n: num(n), c: num(cap) })}</span></div>`;
  const sub = (b) => `<span class="sub">${t('lastUsed', { d: day(b.last, { year: false }) })}</span>`;
  let body;
  if (c.v === 'A') body = counter + rows(list.map((b) => { const on = !!S.x['keep_' + b.id]; return row(`<span class="check ${on ? 'on' : ''}">${on ? '✓' : ''}</span><span class="grow" dir="auto">${L(b)}<br>${sub(b)}</span>`, { click: !on && n >= cap ? '' : `keep_${b.id}=!` }); }));
  else if (c.v === 'B') body = counter + rows(list.map((b) => { const on = !!S.x['keep_' + b.id]; return row(`<span class="grow" dir="auto">${L(b)}<br><span class="sub">${on ? t('active') : t('ro')}</span></span><span class="sw ${on ? 'on' : ''}" role="switch" aria-checked="${on}"></span>`, { click: !on && n >= cap ? '' : `keep_${b.id}=!` }); }));
  else {
    const off = list.filter((b) => !S.x['keep_' + b.id]);
    body = `<p class="cap">${t('active')} · ${t('chosen', { n: num(n), c: num(cap) })}</p>${kept.length ? rows(kept.map((b) => row(`<span class="grow" dir="auto">${L(b)}<br>${sub(b)}</span><span aria-hidden="true">−</span>`, { click: `keep_${b.id}=null` }))) : '<div class="none" style="margin-bottom:14px">—</div>'}
      <p class="cap">${t('ro')}</p>${rows(off.map((b) => row(`<span class="grow" dir="auto">${L(b)}<br>${sub(b)}</span>${n < cap ? '<span aria-hidden="true">+</span>' : ''}`, { click: n < cap ? `keep_${b.id}=1` : '' })))}`;
  }
  const pick = phone({ title: t('chooseBiz'), back: true, tabs: '', large: false, body, foot: btn(t('save'), { full: true, dis: n !== cap }) });
  return [{ cap: S.lang === 'ar' ? 'نشاط للقراءة فقط' : 'A read-only business', html: entry }, { cap: t('chooseBiz'), html: pick }];
}

    rec: 'A',
    note: 'Billing headline for every tier, with the portal\'s names (ADR-275): البداية / مستقل / تجاري / مؤسسة, legacy «الخطة السابقة», Accountant «المحاسب». The "Scheduled" state is MUT-734\'s read-only line (no Undo on the phone).',
    trade: {
      A: 'The plan name is the title, price and renewal under it, the scheduled line under that: same hierarchy as the portal\'s Billing, nothing to learn twice.',
      B: 'Plain settings rows ("Plan · Business"): most native-iOS, smallest; the plan stops being the first thing read.',

    },
    states: ['starter', 'solo', 'business', 'firm', 'legacy', 'accountant'].map((k) => ({ id: k, label: PLANS[k] })).concat([{ id: 'sched', label: { ar: 'تجاري → مستقل مُجدول', en: 'Business → Solo scheduled' } }]),
    noDesk: 'Web: plan names already ship on the portal (ADR-275); the scheduled line with Undo is in mut-734.html.',
    phone: (c) => phone({ title: t('billing'), back: true, body: planHead(NAMES[c.st], c.v, c.st === 'sched' ? 'solo' : '') }),
  },
  {
    id: 'usage', name: { ar: 'الاستخدام', en: 'Paid usage lines' },
    names: { A: { ar: 'صف وشريط', en: 'Row + bar' }, B: { ar: 'نص فقط', en: 'Text only' }, C: { ar: 'بطاقات', en: 'Tiles' } },
    rec: 'A',
    note: 'The same meter rows as the portal (mut-733.html), generalised from Starter\'s section to every plan with limits. 90% has no action on the phone (Q4). At the point of use, one line above the pinned button from 80%.',
    trade: {
      A: 'Row + bar, identical to the portal: one component, one meaning on both; two lines per meter.',
      B: 'Text rows only: densest, reads like iOS Settings; no sense of distance to the cap until the ink turns.',
      C: 'Tiles with big figures: glanceable; heavy on a 375 px screen and pushes everything else below the fold.',
    },
    states: [{ id: 'ok', label: '79%' }, { id: 'near', label: '80%' }, { id: 'nudge', label: '90%' }, { id: 'cap', label: { ar: 'الحد', en: 'At cap' } }, { id: 'grace', label: { ar: 'الهدية سارية', en: 'Gift running' } }],
    noDesk: 'Web: the portal meters are in mut-733.html (shared with MUT-754).',
    phone: usagePhones,
  },
  {
    id: 'gift', name: { ar: 'ورقة الهدية', en: 'Gift sheet' },
    names: { A: { ar: 'ورقة سفلية', en: 'Bottom sheet' }, B: { ar: 'ملء الشاشة', en: 'Full-height sheet' }, C: { ar: 'شريط فوق الزر', en: 'Banner above the button' } },
    rec: 'A',
    note: 'A refusal with gift: available shows the message and Continue only; Continue calls POST /v1/billing/over-cap-gift and re-runs the held action (issue, or the queued capture). Offline: the sheet stays and Continue retries. "Business limit" is AC2\'s refused new business.',
    trade: {
      A: 'A half sheet over the issue screen: the held action is still visible behind it, one thumb-reach Continue; the standard iOS pattern for a one-off question.',
      B: 'A full-height sheet: room for the moment to feel like a gift; the form disappears, so the retry feels disconnected from what was being done.',
      C: 'The phone DESIGN.md banner above the pinned primary, which turns into Continue: no modal at all; the message competes with the keyboard and is easy to scroll past.',
    },
    states: [{ id: 'shown', label: { ar: 'الهدية متاحة', en: 'Gift available' } }, { id: 'offline', label: { ar: 'بلا اتصال', en: 'Offline' } }, { id: 'biz', label: { ar: 'حد الأنشطة', en: 'Business limit' } }],
    noDesk: 'Web: the portal\'s gift notice is in mut-733.html, screen "At the point of use".',
    phone: giftPhone,
  },
  {
    id: 'pick', name: { ar: 'اختيار الأنشطة', en: 'Pick businesses' },
    names: { A: { ar: 'قائمة اختيار وعدّاد', en: 'Checklist + counter' }, B: { ar: 'مفاتيح', en: 'Switches' }, C: { ar: 'مجموعتان', en: 'Two groups' } },
    rec: 'A',
    note: 'A read-only business (over a paid plan\'s cap) opens the pick screen; multi-select up to the cap; Save only at exactly the cap (PUT /v1/billing/active-businesses). Tap rows to choose.',
    trade: {
      A: 'Checkboxes and "2 of 3": the same control as the portal\'s downgrade pick; rows past the cap stop taking ticks.',
      B: 'iOS switches with "Active / Read-only" under each name: very native; switches suggest instant effect, but nothing saves until Save.',
      C: 'Two groups with + / −: the end state is drawn; rows jump between groups as you tap.',
    },
    states: [{ id: 'cap3', label: { ar: 'تجاري: 5 → 3', en: 'Business: 5 → 3' } }, { id: 'cap1', label: { ar: 'مستقل: 3 → 1', en: 'Solo: 3 → 1' } }],
    noDesk: 'Web: the portal pick at downgrade time is in mut-734.html, screen "Businesses that stay active".',
    phone: pickPhones,
  },
);

boot();
</script>
