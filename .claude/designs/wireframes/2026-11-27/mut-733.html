/* Meter rows, shared by MUT-733, MUT-754 (portal) and MUT-706 / MUT-756 (phone). Level: ok < 80% ≤ near < 90% ≤ nudge < 100% ≤ cap. */
function levelOf(used, cap) { const r = used / cap; return r >= 1 ? 'cap' : r >= 0.9 ? 'nudge' : r >= 0.8 ? 'near' : 'ok'; }
function meter({ label, used, cap, grace = '', style = 'A', upgrade = '' }) {
  const lv = levelOf(used, cap);
  const warn = !grace && (lv === 'nudge' || lv === 'cap');
  const pct = Math.min(100, Math.round((used / cap) * 100));
  const count = t('ofCap', { u: num(used), c: num(cap) });
  const status = grace ? `<span class="sub ok-ink">${t('noLimitUntil', { d: day(grace) })}</span>` : lv === 'cap' ? `<span class="sub warn-ink">${t('limitReached')}</span>` : '';
  const up = upgrade && warn ? lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' }) : '';
  const aria = `aria-label="${esc(label)}, ${used} / ${cap}"`;
  if (style === 'B') {
    return `<div class="row" ${aria}><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span></div>`;
  }
  if (style === 'C') {
    return `<div class="card" ${aria} style="${warn ? 'border-color:var(--m-butter-ink)' : ''}"><div class="sub">${label}</div><div class="big ${warn ? 'warn-ink' : ''}" style="font-size:1.75rem">${num(used)}<span class="sub" style="font-size:var(--text-label)"> / ${num(cap)}</span></div><div class="bar ${warn ? 'warn' : ''}" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div>${status || '<span class="sub">&nbsp;</span>'}${up ? `<div>${up}</div>` : ''}</div>`;
  }
  return `<div class="row" ${aria} style="flex-wrap:wrap;row-gap:6px"><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span><div class="bar ${warn ? 'warn' : ''}" style="flex-basis:100%"><i style="width:${pct}%"></i></div>${up ? `<div style="flex-basis:100%;margin-block:-8px">${up}</div>` : ''}</div>`;
}
function meters(list, style, { upgrade = '' } = {}) {
  if (style === 'C') return `<div class="grid2">${list.map((m) => meter({ ...m, style, upgrade })).join('')}</div>`;
  const anyWarn = list.some((m) => !m.grace && ['nudge', 'cap'].includes(levelOf(m.used, m.cap)));
  const tail = style === 'B' && upgrade && anyWarn ? row(`<span class="grow"></span>${lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' })}`) : '';
  return `<div class="rg">${list.map((m) => meter({ ...m, style, upgrade })).join('')}${tail}</div>`;
}

/* Toolbar and rendering */

function setX(spec) {
  for (const part of spec.split(';')) {
    if (!part) continue;
    const [k, val] = part.split('=');
    if (val === 'null') delete S.x[k]; else if (val === '!') S.x[k] = !S.x[k]; else S.x[k] = val;
  }
}
function boot() {
  try { const saved = JSON.parse(localStorage.getItem('wf:' + APP.docTitle) || '{}'); if (saved.lang) S.lang = saved.lang; if (saved.theme) S.theme = saved.theme; } catch (e) { /* private mode */ }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-scr],[data-var],[data-st],[data-lang],[data-thm],[data-x]');
    if (!b) return;
    const ds = b.dataset;
    if (ds.scr) { S.scr = ds.scr; S.x = {}; }
    else if (ds.var) { S.v[S.scr] = ds.var; S.x = {}; }
    else if (ds.st) { S.st[S.scr] = ds.st; S.x = {}; }
    else if (ds.lang) S.lang = ds.lang;
    else if (ds.thm) S.theme = ds.thm;
    else if (ds.x) setX(ds.x);
    try { localStorage.setItem('wf:' + APP.docTitle, JSON.stringify({ lang: S.lang, theme: S.theme })); } catch (err) { /* ignore */ }
    render();
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-xs]'); if (el) { S.x[el.dataset.xs] = el.value; render(); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-x]')) { e.preventDefault(); e.target.click(); } });
  render();
}

/* Point of use: the Issue drawer */

  if (!blocked) return phone({ ...base, body: issueForm(), foot: line + primary });
  if (c.v === 'C') return phone({ ...base, body: issueForm(), foot: banner('warning', msg) + (c.st === 'gift' ? contB : primary) });
  const inner = `<div style="text-align:center;padding:${c.v === 'B' ? '60px' : '8px'} 4px 8px"><div class="big warn-ink">${num(50)}<span class="sub" style="font-size:var(--text-headline)"> / ${num(50)}</span></div><p style="margin:14px 0 0">${msg}</p></div>`;
  return phone({ ...base, body: issueForm(), sheet: sheet(inner, c.st === 'gift' ? contB : btn(t('close'), { kind: 'sec', full: true }), { full: c.v === 'B' }) });
}

APP.screens.push(
  {
    id: 'meters', name: { ar: 'سطور الاستخدام في الفوترة', en: 'Usage lines in Billing' },
    names: { A: { ar: 'صف وشريط', en: 'Row + bar' }, B: { ar: 'نص فقط', en: 'Text only' }, C: { ar: 'بطاقات', en: 'Tiles' } },

    trade: {
      A: 'Name, "41 of 50" and a thin bar per meter, the upgrade text button under the meter that needs it: the bar gives distance-to-cap at a glance; two lines per meter.',
      B: 'Text rows only, one Upgrade row after the group: densest and calmest, matches settings rows exactly; no visual sense of "how close" until the ink turns.',
      C: 'Two tiles with a big figure and a bar: most glanceable for a dashboard-like Billing; heaviest, competes with the plan headline and wraps to one column at 375 px.',
    },
    states: [{ id: 'ok', label: '79%' }, { id: 'near', label: '80%' }, { id: 'nudge', label: '90%' }, { id: 'cap', label: { ar: 'الحد', en: 'At cap' } }, { id: 'grace', label: { ar: 'الهدية سارية', en: 'Gift running' } }, { id: 'firm', label: { ar: 'مؤسسة 92%', en: 'Firm 92%' } }, { id: 'pilot', label: { ar: 'تجريبي (MUT-754)', en: 'Pilot (MUT-754)' } }],
    desk: (c) => desk(youPage(), { overlay: drawer({ title: t('billing'), body: billingUsage(USE[c.st], c.v) }) }),
    phone: (c) => phone({ title: t('billing'), back: true, body: billingUsage(USE[c.st], c.v).replace(/<button class="lb[^"]*" data-x="upgraded=1">[^<]*<\/button>/g, '') }),
  },
  {
    id: 'use', name: { ar: 'عند الإصدار', en: 'At the point of use' },
    names: { A: { ar: 'شريط في أعلى النافذة', en: 'Banner slot on top' }, B: { ar: 'التذييل يصبح الإشعار', en: 'Footer becomes the notice' }, C: { ar: 'صفحة كاملة', en: 'Pane swap' } },
    rec: 'A',
    note: 'Issue drawer (portal) and issue screen (phone). 80% / 90%: a line by the Issue button. At the cap with the gift unused: the gift message before anything goes through; Continue records it and re-runs the held request. Gift used: hard cap. Click Continue, then Issue. The phone never offers Upgrade (no selling); the hard-cap sheet names the web. Phone variants: A half sheet, B full-height sheet, C banner above the pinned button.',
    trade: {
      A: 'Uses DESIGN.md\'s one banner slot at the top of the body; the form stays visible under it, so the held request is obvious; the usage line lives in the footer by the action.',
      B: 'The footer turns into the notice, like InPlaceConfirm: the message sits right where the person was about to click; the footer grows tall and the banner rule ("top of the body") is bent.',
      C: 'The body becomes a centred "50 / 50" pane: strongest moment for a congratulation; hides the form, so after Continue the person lands back on a form they have to re-read.',
    },
    states: [{ id: 'near', label: '80%' }, { id: 'nudge', label: '90%' }, { id: 'gift', label: { ar: 'الحد، الهدية متاحة', en: 'Cap, gift available' } }, { id: 'hard', label: { ar: 'الحد، الهدية مستخدمة', en: 'Cap, gift used' } }],
    desk: (c) => desk(`<div class="hdr"><h2>${S.lang === 'ar' ? 'المستندات' : 'Documents'}</h2></div>`, { nav: 'owed', overlay: issueDesk(c) }),
    phone: issuePhone,
  },
);

boot();
