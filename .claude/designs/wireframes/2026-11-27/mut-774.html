/* Meter rows, shared by MUT-733, MUT-754 (portal) and MUT-706 / MUT-756 (phone). Level: ok < 80% ≤ near < 90% ≤ nudge < 100% ≤ cap. */
function levelOf(used, cap) { const r = used / cap; return r >= 1 ? 'cap' : r >= 0.9 ? 'nudge' : r >= 0.8 ? 'near' : 'ok'; }
function meter({ label, used, cap, grace = '', style = 'A', upgrade = '' }) {
  const lv = levelOf(used, cap);
  const warn = !grace && (lv === 'nudge' || lv === 'cap');
  const pct = Math.min(100, Math.round((used / cap) * 100));
  const count = t('ofCap', { u: num(used), c: num(cap) });
  const status = grace ? `<span class="sub ok-ink">${t('noLimitUntil', { d: day(grace) })}</span>` : lv === 'cap' ? `<span class="sub warn-ink">${t('limitReached')}</span>` : '';
  const up = upgrade && warn ? lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' }) : '';
  const aria = `aria-label="${esc(label)}, ${used} / ${cap}"`;
  if (style === 'B') {
    return `<div class="row" ${aria}><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span></div>`;
  }
  if (style === 'C') {
    return `<div class="card" ${aria} style="${warn ? 'border-color:var(--m-butter-ink)' : ''}"><div class="sub">${label}</div><div class="big ${warn ? 'warn-ink' : ''}" style="font-size:1.75rem">${num(used)}<span class="sub" style="font-size:var(--text-label)"> / ${num(cap)}</span></div><div class="bar ${warn ? 'warn' : ''}" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div>${status || '<span class="sub">&nbsp;</span>'}${up ? `<div>${up}</div>` : ''}</div>`;
  }
  return `<div class="row" ${aria} style="flex-wrap:wrap;row-gap:6px"><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span><div class="bar ${warn ? 'warn' : ''}" style="flex-basis:100%"><i style="width:${pct}%"></i></div>${up ? `<div style="flex-basis:100%;margin-block:-8px">${up}</div>` : ''}</div>`;
}
function meters(list, style, { upgrade = '' } = {}) {
  if (style === 'C') return `<div class="grid2">${list.map((m) => meter({ ...m, style, upgrade })).join('')}</div>`;
  const anyWarn = list.some((m) => !m.grace && ['nudge', 'cap'].includes(levelOf(m.used, m.cap)));
  const tail = style === 'B' && upgrade && anyWarn ? row(`<span class="grow"></span>${lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' })}`) : '';
  return `<div class="rg">${list.map((m) => meter({ ...m, style, upgrade })).join('')}${tail}</div>`;
}

/* Toolbar and rendering */

  const st = S.st[sc.id] || (sc.states && sc.states[0].id);
  const ctx = { v, st, x: S.x };

    ${APP.screens.length > 1 ? `<div class="r"><span class="lbl">${t('screen')}</span>${APP.screens.map((s) => pb('scr', s.id, s.id === sc.id, L(s.name))).join('')}</div>` : ''}
    <div class="r"><span class="lbl">${t('variant')}</span>${['A', 'B', 'C'].map((k) => `<button class="tb" data-var="${k}" aria-pressed="${k === v}">${k} · ${L(sc.names[k])}${k === sc.rec ? '<span class="star" title="' + t('recommended') + '">★</span>' : ''}</button>`).join('')}</div>
    ${sc.states ? `<div class="r"><span class="lbl">${t('state')}</span>${sc.states.map((s) => pb('st', s.id, s.id === st, L(s.label))).join('')}</div>` : ''}`;
  const d = sc.desk ? sc.desk(ctx) : null;
  let p = sc.phone ? sc.phone(ctx) : null;
  const tr = `<ul class="tradeoffs">${['A', 'B', 'C'].map((k) => `<li class="${k === v ? 'on' : ''}" dir="ltr"><b>${k}</b>${escH(sc.trade[k])}${k === sc.rec ? '<span class="rec">recommended</span>' : ''}</li>`).join('')}</ul>`;
  const note = sc.note ? `<p class="note" dir="ltr">${escH(sc.note)}</p>` : '';

function setX(spec) {
  for (const part of spec.split(';')) {
    if (!part) continue;
    const [k, val] = part.split('=');
    if (val === 'null') delete S.x[k]; else if (val === '!') S.x[k] = !S.x[k]; else S.x[k] = val;
  }
}
function boot() {
  try { const saved = JSON.parse(localStorage.getItem('wf:' + APP.docTitle) || '{}'); if (saved.lang) S.lang = saved.lang; if (saved.theme) S.theme = saved.theme; } catch (e) { /* private mode */ }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-scr],[data-var],[data-st],[data-lang],[data-thm],[data-x]');
    if (!b) return;
    const ds = b.dataset;
    if (ds.scr) { S.scr = ds.scr; S.x = {}; }
    else if (ds.var) { S.v[S.scr] = ds.var; S.x = {}; }
    else if (ds.st) { S.st[S.scr] = ds.st; S.x = {}; }
    else if (ds.lang) S.lang = ds.lang;
    else if (ds.thm) S.theme = ds.thm;
    else if (ds.x) setX(ds.x);
    try { localStorage.setItem('wf:' + APP.docTitle, JSON.stringify({ lang: S.lang, theme: S.theme })); } catch (err) { /* ignore */ }
    render();
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-xs]'); if (el) { S.x[el.dataset.xs] = el.value; render(); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-x]')) { e.preventDefault(); e.target.click(); } });
  render();
}

  });
  const tabs = c.v === 'B' ? `<div class="seg" style="margin-bottom:12px">${CURS.map((k) => `<button class="${k === (S.x.cur || 'ILS') ? 'on' : ''}" data-x="cur=${k}">${k}</button>`).join('')}</div>` : '';
  return phone({ title: t('clients'), tabs: 'clients', body: (ro ? `<p>${badge('neutral', t('viewOnly'))}</p>` : '') + tabs + rows(items) });
}

/* Screen 2: the ledger card */
function data(c) {
  if (c.st === 'empty') return { cur: 'ILS', lines: [], curs: ['ILS'] };
  if (c.st === 'credit') return { cur: 'ILS', lines: LINES.CREDIT, curs: ['ILS'] };
  const cur = S.x.cur || (c.st === 'usd' ? 'USD' : 'ILS');
  return { cur, lines: LINES[cur] || LINES.ILS, curs: ['ILS', 'USD'] };
}
const movement = (l) => (l.k === 'inc' ? `${t('inc')} · <span dir="auto">${L(l.note)}</span>` : t('pay'));
const tags = (l, ro) => [...l.docs.map(([k, n]) => `<span class="chip" style="${ro ? '' : 'color:var(--m-lavender-ink)'}">${t(k)} ${num(n)}</span>`), l.due ? `<span class="chip" style="background:var(--m-butter);color:var(--m-butter-ink);border-color:transparent">${t('due_' + l.due)}</span>` : ''].join(' ');
function controls(D, ro, phoneMode) {
  const seg = D.curs.length > 1 ? `<div class="seg">${D.curs.map((k) => `<button class="${k === D.cur ? 'on' : ''}" data-x="cur=${k}">${k}</button>`).join('')}</div>` : '';
  const per = `<select data-xs="per" style="min-height:36px;border-radius:12px;border:1px solid var(--m-line);background:var(--m-field-bg);padding:2px 10px">${['pAll', 'pYear', 'p12'].map((p) => `<option value="${p}" ${S.x.per === p ? 'selected' : ''}>${t(p)}</option>`).join('')}</select>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px">${seg}<label class="sub" style="display:flex;gap:6px;align-items:center">${phoneMode ? '' : t('period')} ${per}</label>${ro ? badge('neutral', t('viewOnly')) : ''}</div>`;
}
const opening = (D) => (S.x.per === 'pYear' || S.x.per === 'p12') && D.lines.length ? 0 : null;
function ledgerPhone(c) {
  const ro = c.st === 'acct';
  const D = data(c);
  const cl = c.st === 'credit' ? CLIENTS[3] : CLIENTS[1];
  const closing = D.lines.length ? D.lines[0].bal : 0;
  const op = opening(D);
  let body = controls(D, ro, true);
  if (!D.lines.length) return phone({ title: L(cl), back: true, tabs: 'clients', large: false, body: body + `<div class="none" style="text-align:center;padding:40px">${t('empty')}</div>` });
  const hero = `<div style="margin-bottom:14px"><div class="sub">${t('closing')}</div><div class="big" style="font-size:2rem">${balTxt(closing, D.cur)}</div></div>`;
  if (c.v === 'A') {
    let lastM = '';
    const items = [];
    D.lines.forEach((l) => {
      const m = l.d.slice(0, 7);
      if (m !== lastM) { items.push(`<div class="kv" style="padding:12px 2px 4px"><b>${month(l.d)}</b><span class="sub">${balTxt(l.bal, D.cur)}</span></div>`); lastM = m; }
      items.push(`<div class="rg" style="margin-bottom:6px"><div class="row ${ro ? '' : 'click'}" style="align-items:flex-start"><span class="grow"><span class="sub">${day(l.d, { year: false })}</span><br>${movement(l)}<div style="margin-top:4px">${tags(l, ro)}</div></span><span style="text-align:end"><span class="num" style="font-weight:600">${money(l.amt, D.cur, { sign: true })}</span><br><span class="sub">${balTxt(l.bal, D.cur)}</span></span>${ro ? '' : '<span class="chev">›</span>'}</div></div>`);
    });
    if (op !== null) items.push(`<div class="kv" style="padding:12px 2px"><b>${t('opening')}</b>${money(op, D.cur)}</div>`);
    body += hero + items.join('');
  } else if (c.v === 'B') {
    body += hero + `<table class="t" style="font-size:var(--text-label)"><thead><tr><th style="padding:8px">${t('date')}</th><th style="padding:8px">${t('movement')}</th><th class="n" style="padding:8px">±</th><th class="n" style="padding:8px">${t('balance')}</th></tr></thead><tbody>${D.lines.map((l) => `<tr class="${ro ? '' : 'click'}"><td style="padding:8px;white-space:nowrap">${day(l.d, { year: false, short: true })}</td><td style="padding:8px">${movement(l)}<div>${tags(l, ro)}</div></td><td class="n num" style="padding:8px">${money(l.amt, D.cur, { sign: true })}</td><td class="n" style="padding:8px">${balTxt(l.bal, D.cur)}</td></tr>`).join('')}${op !== null ? `<tr class="mon"><th colspan="3" style="padding:8px">${t('opening')}</th><td class="n" style="padding:8px">${money(op, D.cur)}</td></tr>` : ''}</tbody></table>`;
  } else {
    const deb = D.lines.filter((l) => l.amt > 0).reduce((s, l) => s + l.amt, 0); const cre = D.lines.filter((l) => l.amt < 0).reduce((s, l) => s - l.amt, 0);
    body += `<div class="card" style="margin-bottom:14px">${op !== null ? `<div class="kv"><span>${t('opening')}</span>${money(op, D.cur)}</div>` : ''}<div class="kv"><span>${t('debit')}</span>${money(deb, D.cur)}</div><div class="kv"><span>${t('credit')}</span>${money(cre, D.cur)}</div><div class="kv total"><span>${t('closing')}</span>${balTxt(closing, D.cur)}</div></div>`
      + rows(D.lines.map((l) => row(`<span class="grow"><span class="sub">${day(l.d, { year: false })}</span> · ${movement(l)}<div style="margin-top:4px">${tags(l, ro)}</div></span><span style="text-align:end"><span class="num">${money(l.amt, D.cur, { sign: true })}</span><br><span class="badge b-neutral" style="font-size:var(--text-micro)">${balTxt(l.bal, D.cur)}</span></span>`, { chev: !ro })));
  }
  return phone({ title: L(cl), back: true, tabs: 'clients', large: false, body });
}
function ledgerDesk(c) {
  const ro = c.st === 'acct';
  const D = data(c);
  const cl = c.st === 'credit' ? CLIENTS[3] : CLIENTS[1];
  const op = opening(D);
  if (!D.lines.length) return desk(`<div class="hdr"><h2>${L(cl)}</h2></div>${controls(D, ro)}<div class="none" style="text-align:center;padding:48px">${t('empty')}</div>`, { nav: 'clients' });
  let lastM = '';
  const tr = [];
  D.lines.forEach((l) => {
    if (l.d.slice(0, 7) !== lastM) { tr.push(`<tr class="mon"><th colspan="5">${month(l.d)}</th><td class="n">${balTxt(l.bal, D.cur)}</td></tr>`); lastM = l.d.slice(0, 7); }
    tr.push(`<tr><td class="sub">${day(l.d, { year: false })}</td><td>${movement(l)}</td><td>${tags(l, ro)}</td><td class="n">${l.amt > 0 ? money(l.amt, D.cur) : ''}</td><td class="n">${l.amt < 0 ? money(-l.amt, D.cur) : ''}</td><td class="n">${balTxt(l.bal, D.cur)}</td></tr>`);
  });
  if (op !== null) tr.push(`<tr class="mon"><th colspan="5">${t('opening')}</th><td class="n">${money(op, D.cur)}</td></tr>`);
  return desk(`<div class="hdr"><h2>${L(cl)}</h2></div>${controls(D, ro)}<p><span class="sub">${t('closing')}</span> <b>${balTxt(D.lines[0].bal, D.cur)}</b></p>
    <table class="t"><thead><tr><th>${t('date')}</th><th>${t('movement')}</th><th>${t('document')}</th><th class="n">${t('debit')}</th><th class="n">${t('credit')}</th><th class="n">${t('balance')}</th></tr></thead><tbody>${tr.join('')}</tbody></table>`, { nav: 'clients' });
}

APP.screens.push(
  {
    id: 'list', name: { ar: 'قائمة العملاء', en: 'Clients list' },
    names: { A: { ar: 'عمود رصيد مكدّس', en: 'Stacked balance column' }, B: { ar: 'تبويب لكل عملة', en: 'Tab per currency' }, C: { ar: 'شارات في الصف', en: 'Chips in the row' } },
    rec: 'A',
    note: 'GET /v1/customer-balances on the portal list: each client\'s balance per currency, never summed across currencies (ADR-004); a negative balance reads "Client in credit"; it must match the ledger card and Owed. Accountant: same list, view only. Phone list shown for parity (not in MUT-774\'s AC).',
    trade: {
      A: 'One Balance column, one line per currency stacked: every currency visible, nothing summed, scans like the ledger card\'s balance column; rows with three currencies get tall.',
      B: 'A currency tab, the column sorted by balance with a per-currency total: best for "who owes me the most in ₪"; a client\'s other currencies are hidden until you switch tab.',
      C: 'Balances as chips under the name, no column: works unchanged at 375 px and on the phone; chips are harder to compare down a list than a right-aligned column.',
    },
    states: [{ id: 'all', label: { ar: 'المالك', en: 'Owner' } }, { id: 'acct', label: { ar: 'محاسب (للعرض)', en: 'Accountant (view only)' } }],
    desk: (c) => desk(listDesk(c), { nav: 'clients' }),
    phone: listPhone,
  },
  {
    id: 'ledger', name: { ar: 'كرت العميل على الهاتف', en: 'Phone ledger card' },
    names: { A: { ar: 'أقسام شهرية', en: 'Month sections' }, B: { ar: 'جدول مضغوط', en: 'Compact table' }, C: { ar: 'ملخص ثم الحركات', en: 'Summary + list' } },
    rec: 'A',
    note: 'The phone mirrors the portal LedgerCard (the web frame: already built in MUT-664, unchanged, shown for reference): newest first, one card per currency (tabs), month rows carrying the month-end balance, period filter with opening and closing balance, document tags beside the line, "to issue" in butter; each line opens its entry, a tag its document; an accountant reads it only. Try the period select and the currency tabs.',
    trade: {
      A: 'Month sections with the month-end balance in the header, each line a card with signed amount and running balance: same reading order as the portal\'s month rows, thumb-sized taps; the longest scroll.',
      B: 'A 4-column table (date, movement, ±, balance): closest to the portal and to a printed כרטסת, densest; 12–13 px type at 375 px and tags squeezed under the movement.',
      C: 'Opening / debit / credit / closing summary first, then a flat list: the answer before the detail; loses the month grouping, and the running balance becomes a small chip.',
    },
    states: [{ id: 'ils', label: '₪ ILS' }, { id: 'usd', label: '$ USD' }, { id: 'credit', label: { ar: 'العميل دائن', en: 'In credit' } }, { id: 'acct', label: { ar: 'محاسب', en: 'Accountant' } }, { id: 'empty', label: { ar: 'فارغ', en: 'Empty' } }],
    desk: ledgerDesk,
    phone: ledgerPhone,
  },
);

boot();
</script>
</body>
</html>
