/* Meter rows, shared by MUT-733, MUT-754 (portal) and MUT-706 / MUT-756 (phone). Level: ok < 80% ≤ near < 90% ≤ nudge < 100% ≤ cap. */
function levelOf(used, cap) { const r = used / cap; return r >= 1 ? 'cap' : r >= 0.9 ? 'nudge' : r >= 0.8 ? 'near' : 'ok'; }
function meter({ label, used, cap, grace = '', style = 'A', upgrade = '' }) {
  const lv = levelOf(used, cap);
  const warn = !grace && (lv === 'nudge' || lv === 'cap');
  const pct = Math.min(100, Math.round((used / cap) * 100));
  const count = t('ofCap', { u: num(used), c: num(cap) });
  const status = grace ? `<span class="sub ok-ink">${t('noLimitUntil', { d: day(grace) })}</span>` : lv === 'cap' ? `<span class="sub warn-ink">${t('limitReached')}</span>` : '';
  const up = upgrade && warn ? lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' }) : '';
  const aria = `aria-label="${esc(label)}, ${used} / ${cap}"`;
  if (style === 'B') {
    return `<div class="row" ${aria}><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span></div>`;
  }
  if (style === 'C') {
    return `<div class="card" ${aria} style="${warn ? 'border-color:var(--m-butter-ink)' : ''}"><div class="sub">${label}</div><div class="big ${warn ? 'warn-ink' : ''}" style="font-size:1.75rem">${num(used)}<span class="sub" style="font-size:var(--text-label)"> / ${num(cap)}</span></div><div class="bar ${warn ? 'warn' : ''}" style="margin:8px 0 4px"><i style="width:${pct}%"></i></div>${status || '<span class="sub">&nbsp;</span>'}${up ? `<div>${up}</div>` : ''}</div>`;
  }
  return `<div class="row" ${aria} style="flex-wrap:wrap;row-gap:6px"><span class="grow">${label}</span>${status}<span class="num ${warn ? 'warn-ink' : ''}" style="font-weight:${warn ? 600 : 400}">${count}</span><div class="bar ${warn ? 'warn' : ''}" style="flex-basis:100%"><i style="width:${pct}%"></i></div>${up ? `<div style="flex-basis:100%;margin-block:-8px">${up}</div>` : ''}</div>`;
}
function meters(list, style, { upgrade = '' } = {}) {
  if (style === 'C') return `<div class="grid2">${list.map((m) => meter({ ...m, style, upgrade })).join('')}</div>`;
  const anyWarn = list.some((m) => !m.grace && ['nudge', 'cap'].includes(levelOf(m.used, m.cap)));
  const tail = style === 'B' && upgrade && anyWarn ? row(`<span class="grow"></span>${lb(t('upgradeTo', { p: pn(upgrade) }), { x: 'upgraded=1' })}`) : '';
  return `<div class="rg">${list.map((m) => meter({ ...m, style, upgrade })).join('')}${tail}</div>`;
}

function setX(spec) {

function boot() {

    if (ds.scr) { S.scr = ds.scr; S.x = {}; }

  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[data-x]')) { e.preventDefault(); e.target.click(); } });
  render();
}

  const P = (p) => PLANS[p];
  const cell = (a, b) => `<td>${a}</td><td>${b}</td>`;
  const diff = (a, b) => (a === b ? num(b) : `<b>${num(b)}</b>`);
  const table = `<table class="t" style="margin-top:14px"><thead><tr><th></th><th>${t('now')} · ${pn(sc.from)}</th><th>${k === 'up' ? t('now') : day(FROM)} · ${pn(pick)}</th></tr></thead><tbody>
    <tr><th class="sub" style="font-weight:400">${t('price')}</th>${cell(priceOf(sc.from), priceOf(pick))}</tr>
    <tr><th class="sub" style="font-weight:400">${t('businesses')}</th>${cell(num(P(sc.from).biz), diff(P(sc.from).biz, P(pick).biz))}</tr>
    <tr><th class="sub" style="font-weight:400">${t('invoices')}</th>${cell(num(P(sc.from).docs), diff(P(sc.from).docs, P(pick).docs))}</tr>
    <tr><th class="sub" style="font-weight:400">${t('scans')}</th>${cell(num(P(sc.from).scans), diff(P(sc.from).scans, P(pick).scans))}</tr>
    <tr><th class="sub" style="font-weight:400">${k === 'up' ? t('chargedNow') : t('plan')}</th>${cell(`<span class="sub">${t('untilD', { d: day(k === 'up' ? '2026-11-27' : END) })}</span>`, k === 'up' ? `<b>${money(PRORATA)}</b>` : t('fromD', { p: pn(pick), d: day(FROM) }))}</tr></tbody></table>`;
  const cap = P(pick).biz;
  const keep = k !== 'up' && sc.owned > cap ? `<div style="margin-top:16px">${keepList(sc.owned, cap)}</div>` : '';
  return drawer({ title: t('changePlan'), wide: true, back: 'x=1', body: (S.x.done ? resultBanner(sc) : '') + seg + table + keep, foot: btn(t('cancel'), { kind: 'sec' }) + (S.x.done ? '' : confirmBtn(sc.from, pick, sc.owned)) });
}

/* --- Screen 2: Billing with the scheduled change --- */
const SCHED = {
  down: { plan: 'business', sched: 'solo' },
  starter: { plan: 'business', sched: 'starter' },
  pending: { plan: 'solo', sched: null, pending: 'business' },
  none: { plan: 'business', sched: null },
};
function schedLine(sched, style, { phone = false } = {}) {
  if (!sched) return '';
  const undo = phone ? '' : lb(t('undo'), { x: 'undone=1' });
  if (style === 'B') return banner('info', t('fromD', { p: pn(sched), d: day(FROM) }), undo);
  if (style === 'C') return '';
  return `<p style="margin:6px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${badge('info', t('scheduledChip'))}<span>${t('fromD', { p: pn(sched), d: day(FROM) })}</span>${undo}</p>`;
}
function headline(plan, sched, style, { phone = false } = {}) {
  const P = PLANS[plan];
  const sub = sched ? t('untilD', { d: day(END) }) : t('renews', { d: day(FROM) });
  if (style === 'C' && sched) {
    return rows([
      row(`<span class="grow"><span class="sub">${t('now')}</span><br><b>${pn(plan)}</b></span><span class="sub">${money(P.price)} · ${t('untilD', { d: day(END) })}</span>`),
      row(`<span class="grow"><span class="sub">${day(FROM)}</span><br><b>${pn(sched)}</b></span>${phone ? '' : lb(t('undo'), { x: 'undone=1' })}`),
    ]);
  }
  return `<div style="margin-bottom:14px"><div class="sub">${t('plan')}</div><div class="title">${pn(plan)}</div><div class="sub">${money(P.price)} ${t('perMonth')} · ${sub}</div>${style === 'A' ? schedLine(sched, 'A', { phone }) : ''}</div>`;
}
function billingBody(plan, sched, style, { pending = '', phone = false } = {}) {
  const P = PLANS[plan];
  const top = (style === 'B' && sched ? schedLine(sched, 'B', { phone }) : '') + (pending ? banner('info', `${t('pending')} · ${pn(pending)}`, phone ? '' : lb(t('completePay'))) : '');
  const m = meters([{ label: `${t('invoices')} · ${t('thisMonth')}`, used: 12, cap: P.docs }, { label: `${t('scans')} · ${t('thisMonth')}`, used: 31, cap: P.scans }], 'A');
  const acts = phone ? '' : rows([row(`<span class="grow">${t('changePlan')}</span>`, { chev: true }), row(`<span class="grow">${t('payMethod')}</span><span class="sub num">•••• 4242</span>`, { chev: true }), row(`<span class="grow">${t('invoicesRow')}</span>`, { chev: true }), row(`<span class="grow err-ink">${t('cancelSub')}</span>`)]);
  return top + headline(plan, sched, style, { phone }) + m + acts;
}
function billingDrawer(c, { plan, sched, style, pending = '' }) {
  const undone = S.x.undone;
  const body = billingBody(plan, undone ? null : sched, style, { pending });
  return drawer({ title: t('billing'), body, extra: undone ? toast(t('undone', { p: pn(plan), d: day(FROM) })) : '' });
}

/* --- Screen 3: which businesses stay active --- */
const KEEP = { cap1: { from: 'business', to: 'solo', owned: 3 }, cap3: { from: 'firm', to: 'business', owned: 5 }, err: { from: 'business', to: 'solo', owned: 3, err: true } };
function keepDesk(c) {
  const k = KEEP[c.st]; const cap = PLANS[k.to].biz; const list = BIZ.slice(0, k.owned);
  const n = keptIds(k.owned).length;
  const err = k.err && n !== cap ? banner('error', t('pickFirst', { c: num(cap) })) : '';
  let body;
  if (c.v === 'A') body = keepList(k.owned, cap);
  else if (c.v === 'B') {
    body = `<div class="kv" style="padding-top:0"><b>${t('activeBiz')}</b><span class="num">${t('chosen', { n: num(n), c: num(cap) })}</span></div>` + rows(list.map((b) => {
      const on = !!S.x['keep_' + b.id];
      return row(`<span class="grow" dir="auto">${bn(b)}<br><span class="sub">${t('lastUsed', { d: day(b.last, { year: false }) })}</span></span><div class="seg"><button class="${on ? 'on' : ''}" data-x="keep_${b.id}=1">${t('active')}</button><button class="${on ? '' : 'on'}" data-x="keep_${b.id}=null">${t('ro')}</button></div>`);
    }));
  } else {
    const on = list.filter((b) => S.x['keep_' + b.id]); const off = list.filter((b) => !S.x['keep_' + b.id]);
    const r = (b, isOn) => row(`<span class="grow" dir="auto">${bn(b)}<br><span class="sub">${t('lastUsed', { d: day(b.last, { year: false }) })}</span></span>${isOn || n < cap ? lb(t('move'), { x: `keep_${b.id}=${isOn ? 'null' : '1'}` }) : ''}`);
    body = `<div class="kv" style="padding-top:0"><b>${t('active')}</b><span class="num">${t('chosen', { n: num(n), c: num(cap) })}</span></div>${on.length ? rows(on.map((b) => r(b, true))) : `<div class="none" style="margin-bottom:14px">—</div>`}
      <div class="kv"><b>${t('readOnlyFrom', { d: day(FROM) })}</b><span class="num">${num(off.length)}</span></div>${off.length ? rows(off.map((b) => r(b, false))) : ''}`;
  }
  const head = `<div class="card" style="margin-bottom:14px"><b>${t('fromD', { p: pn(k.to), d: day(FROM) })}</b><div class="sub">${limitsLine(k.to)}</div></div>`;
  return drawer({ title: pn(k.to), back: 'x=1', body: err + head + body, foot: btn(t('cancel'), { kind: 'sec' }) + btn(t('confirm'), { dis: !k.err && n !== cap }) });
}

/* --- Screen 4: cancel offers Starter --- */
function cancelDesk(c) {
  const plan = 'business';
  const line = t('thenRO', { p: pn(plan), d: day(END) });
  if (c.v === 'A') {
    const foot = `<div style="flex-basis:100%"><b>${t('cancelSub')}</b><p class="sub" style="margin:2px 0 8px">${line}</p></div>${btn(t('cancel'), { kind: 'sec' })}${btn(t('moveStarter'))}${btn(t('endSub'), { kind: 'danger' })}`;
    return drawer({ title: t('billing'), body: billingBody(plan, null, 'A'), foot });
  }
  if (c.v === 'B') {
    const pick = S.x.c || 'starter';
    const body = rows([
      row(`<span class="radio ${pick === 'starter' ? 'on' : ''}"></span><span class="grow"><b>${t('moveStarter')}</b><br><span class="sub">${t('fromD', { p: pn('starter'), d: day(FROM) })} · ${limitsLine('starter')}</span></span>`, { click: 'c=starter' }),
      row(`<span class="radio ${pick === 'end' ? 'on' : ''}"></span><span class="grow"><b>${t('endSub')}</b><br><span class="sub">${t('readOnlyFrom', { d: day(FROM) })}</span></span>`, { click: 'c=end' }),
    ]);
    return drawer({ title: t('cancelSub'), back: 'x=1', body, foot: btn(t('cancel'), { kind: 'sec' }) + btn(t('confirm'), { kind: pick === 'end' ? 'danger' : '' }) });
  }
  const card = (title, sub, b) => `<div class="card stack"><b>${title}</b><div class="sub">${sub}</div>${b}</div>`;
  const body = `<div class="grid2">${card(pn('starter'), `${t('fromD', { p: pn('starter'), d: day(FROM) })}<br>${limitsLine('starter')}`, btn(t('moveStarter'), { full: true }))}${card(t('endSub'), t('readOnlyFrom', { d: day(FROM) }), btn(t('endSub'), { kind: 'danger', full: true }))}</div>`;
  return drawer({ title: t('cancelSub'), back: 'x=1', wide: true, body, foot: btn(t('cancel'), { kind: 'sec' }) });
}

APP.screens.push(
  {
    id: 'change', name: { ar: 'تغيير الخطة', en: 'Change plan pane' },
    names: { A: { ar: 'قائمة ومعاينة معًا', en: 'List + inline preview' }, B: { ar: 'خطوتان', en: 'Two panes' }, C: { ar: 'مقارنة', en: 'Compare columns' } },
    rec: 'B',
    note: 'Billing › Change plan. Pick a plan, see the preview (amount charged now, or the date and which businesses stay active), confirm. Confirm moves on to Billing (screen 2) or to the pending / declined state.',
    trade: {
      A: 'Everything in one pane: the list stays visible while the preview grows under it; fewer clicks, but on a downgrade with a business pick the pane gets long and the Confirm moves far from the choice.',
      B: 'List pane, then one preview pane per plan (DESIGN.md "panes inside a drawer"): one decision per pane, the amount or date is the hero, the pick list has room; one extra click and a Back.',
      C: 'Wide drawer comparing now vs after, every changed limit in bold: best for "what do I lose", but 720 px wide and a table that stacks badly at 375 px.',
    },
    states: [{ id: 'up', label: { ar: 'ترقية مستقل → تجاري', en: 'Up: Solo → Business' } }, { id: 'down', label: { ar: 'تخفيض تجاري → مستقل', en: 'Down: Business → Solo' } }, { id: 'starter', label: { ar: 'إلى البداية', en: 'To Starter' } }, { id: 'pending', label: { ar: 'بانتظار الدفع (3-D Secure)', en: 'Pending (3-D Secure)' } }, { id: 'declined', label: { ar: 'رُفضت البطاقة', en: 'Card declined' } }],
    desk: (c) => { const sc = CHANGE[c.st]; return desk(youPage(), { overlay: c.v === 'A' ? changeA(c, sc) : c.v === 'B' ? changeB(c, sc) : changeC(c, sc) }); },
    noPhone: 'Phone: no change actions (MUT-734 Q4 / MUT-364 D1). The phone shows the result as a read-only line: see "Scheduled change" and mut-706.html.',
  },
  {
    id: 'sched', name: { ar: 'التغيير المُجدول', en: 'Scheduled change' },
    names: { A: { ar: 'سطر تحت الخطة', en: 'One line under the plan' }, B: { ar: 'شريط في الأعلى', en: 'Banner on top' }, C: { ar: 'صفّان: الآن وبعد', en: 'Now / next rows' } },
    rec: 'A',
    note: 'Billing after a downgrade is scheduled (or a pending upgrade). Web: Undo until the boundary. Phone: the same line, read-only (MUT-706 AC5). Click Undo to see the toast.',
    trade: {
      A: 'A "Scheduled" chip and "Solo from 1 January · Undo" right under the plan name: the fact sits where the plan is read, quietest; easy to miss if someone only scans the meters.',
      B: 'An info banner at the top of Billing: impossible to miss, Undo is a clear target; but a banner reads as "something to deal with" for a choice the person made on purpose.',
      C: 'Two rows, now and from the date, as a tiny timeline: the clearest picture of what happens when; takes the most room and replaces the big plan name.',
    },
    states: [{ id: 'down', label: { ar: 'إلى مستقل', en: 'To Solo' } }, { id: 'starter', label: { ar: 'إلى البداية', en: 'To Starter' } }, { id: 'pending', label: { ar: 'ترقية بانتظار الدفع', en: 'Upgrade pending' } }, { id: 'none', label: { ar: 'لا شيء مُجدول', en: 'Nothing scheduled' } }],
    desk: (c) => { const s = SCHED[c.st]; return desk(youPage(), { overlay: billingDrawer(c, { plan: s.plan, sched: s.sched, style: c.v, pending: s.pending }) }); },
    phone: (c) => { const s = SCHED[c.st]; return phone({ title: t('billing'), back: true, body: billingBody(s.plan, s.sched, c.v, { pending: s.pending, phone: true }) }); },
  },
  {
    id: 'keep', name: { ar: 'الأنشطة التي تبقى فعّالة', en: 'Businesses that stay active' },
    names: { A: { ar: 'قائمة اختيار وعدّاد', en: 'Checklist + counter' }, B: { ar: 'مفتاح لكل نشاط', en: 'Switch per business' }, C: { ar: 'مجموعتان', en: 'Two groups' } },
    rec: 'A',
    note: 'Downgrade below the businesses owned. The person must pick exactly the new cap (no default, MUT-731 Q5); Confirm is off until then. The "error" state is the 422 ACTIVE_BUSINESSES_REQUIRED answer. Click rows to choose.',
    trade: {
      A: 'Checkboxes with "1 of 1" and each unchecked row saying "Read-only from 1 January": one control type, the consequence printed on the row; rows past the cap simply stop taking ticks.',
      B: 'Each row has Active / Read-only: both outcomes visible as words, no counting in the head; two buttons per row is busier and the cap still needs the counter.',
      C: 'Two groups that rows move between: the end state is literally drawn; Move buttons are an extra step and the groups jump as rows move.',
    },
    states: [{ id: 'cap1', label: { ar: 'تجاري → مستقل (3 → 1)', en: 'Business → Solo (3 → 1)' } }, { id: 'cap3', label: { ar: 'مؤسسة → تجاري (5 → 3)', en: 'Firm → Business (5 → 3)' } }, { id: 'err', label: { ar: 'خطأ: لم يُختر شيء', en: 'Error: none picked' } }],
    desk: (c) => desk(youPage(), { overlay: keepDesk(c) }),
    noPhone: 'Phone: no downgrade on the phone. After the boundary the phone\'s own pick screen (multi-select up to the cap) is in mut-706.html, screen "Pick businesses".',
  },
  {
    id: 'cancel', name: { ar: 'الإلغاء ← البداية', en: 'Cancel → Starter' },
    names: { A: { ar: 'تأكيد في التذييل', en: 'In-place footer confirm' }, B: { ar: 'خياران', en: 'Two choices' }, C: { ar: 'بطاقتان', en: 'Two cards' } },
    rec: 'A',
    note: 'AC8: the cancel flow\'s confirm step offers "Move to Starter instead" (= cancel at period end + starterChosenAt).',
    trade: {
      A: 'The footer turns into the InPlaceConfirm (DESIGN.md recipe) with three buttons: no new pane, matches every other destructive confirm; three buttons in one footer is crowded at 375 px (they stack).',
      B: 'A pane with two radio rows, Starter preselected: calm, one Confirm whose tone follows the choice; adds a pane to a flow people want to finish fast.',
      C: 'Two side-by-side cards, each with its own button: both outcomes equally visible; wide, and the danger button sits next to the free option at equal weight.',
    },
    desk: (c) => desk(youPage(), { overlay: cancelDesk(c) }),
    noPhone: 'Phone: no cancel on the phone (managed on the web).',
  },
);

boot();
</script>
