<title>Documents Due Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
/* Brand primitives (src/styles/brand/mutaba3a-theme.css), named by DESIGN.md role */
:root {
  --bg: #FCF6ED; --surface: #FFFCF7; --surface-2: #F4F2FB; --line: #E6E2ED;
  --text: #392F4B; --muted: #564E68; --faint: #8a8299;
  --accent: #795DBA; --accent-solid: #5E439E; --accent-text: #5E439E;
  --sel: #E0D7FF; --on-sel: #4D387E;
  --ok: #00513E; --ok-bg: #BAEBD4; --warn: #67450A; --warn-bg: #F6E8B3; --err: #742B35; --err-bg: #FFCED5;
  --on-fill: #FCF6ED; --frame: 0 30px 60px -30px rgba(57,47,75,.35), 0 0 0 1px rgba(57,47,75,.08);
  --glass: rgba(255,252,247,.78); --lift: 0 8px 30px rgba(57,47,75,.12), 0 1px 3px rgba(57,47,75,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221B2D; --surface: #2E273C; --surface-2: #3B334C; --line: #4B435A;
    --text: #F4EEE4; --muted: #BAB3C8; --faint: #8f879e;
    --accent: #BCA9F7; --accent-solid: #C8B7FF; --accent-text: #C8B7FF;
    --sel: #453A64; --on-sel: #DBCEFF;
    --ok: #A5E9CA; --ok-bg: #134E39; --warn: #F0DE99; --warn-bg: #57451E; --err: #FFC2CB; --err-bg: #62313A;
    --on-fill: #221B2D; --frame: 0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08);
    --glass: rgba(46,39,60,.78); --lift: 0 8px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #221B2D; --surface: #2E273C; --surface-2: #3B334C; --line: #4B435A;
  --text: #F4EEE4; --muted: #BAB3C8; --faint: #8f879e;
  --accent: #BCA9F7; --accent-solid: #C8B7FF; --accent-text: #C8B7FF;
  --sel: #453A64; --on-sel: #DBCEFF;
  --ok: #A5E9CA; --ok-bg: #134E39; --warn: #F0DE99; --warn-bg: #57451E; --err: #FFC2CB; --err-bg: #62313A;
  --on-fill: #221B2D; --frame: 0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08);
  --glass: rgba(46,39,60,.78); --lift: 0 8px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 100%/1.55 "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
.num, bdi.m { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 48px 16px 120px; }

/* document */
.eyebrow { font-size: .8125rem; color: var(--muted); margin: 0 0 8px; }
h1.doc { font-family: "Noto Serif", "Noto Sans Arabic", serif; font-size: clamp(1.9rem, 4.2vw, 2.75rem); line-height: 1.1; margin: 0; }
.lede { font-size: 1.0625rem; color: var(--muted); max-width: 780px; margin: 14px 0 0; }
.lede b { color: var(--text); }
.toggles { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; position: sticky; top: 10px; z-index: 20; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); box-shadow: 0 0 0 1px var(--line); }
.seg button { padding: 6px 14px; border-radius: 999px; font-size: .875rem; color: var(--muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; font-size: .875rem; }
.toc a { color: var(--accent-text); text-decoration: none; }
.screen-sec { margin-top: 88px; scroll-margin-top: 70px; }
.screen-sec .n { font-size: .8125rem; color: var(--muted); }
.screen-sec h2 { font-family: "Noto Serif", "Noto Sans Arabic", serif; font-size: 1.6rem; margin: 2px 0 8px; line-height: 1.2; }
.screen-sec .idea { color: var(--muted); max-width: 820px; margin: 0; }
.screen-sec .idea b { color: var(--text); }
.stage { display: flex; gap: 36px; align-items: flex-start; flex-wrap: wrap; margin-top: 24px; }
.desk-wrap { flex: 1 1 760px; min-width: 0; overflow-x: auto; padding: 4px 4px 28px; margin: -4px; }
.phone-wrap { flex: 0 0 auto; margin-inline: auto; padding-bottom: 28px; }
.cap { text-align: center; font-size: .8125rem; color: var(--muted); margin-top: 10px; max-width: 375px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 28px; max-width: 980px; margin-top: 4px; }
.notes h3 { font-size: .8125rem; color: var(--muted); margin: 0 0 4px; }
.notes ul { margin: 0; padding-inline-start: 18px; font-size: .9375rem; }
.notes li + li { margin-top: 4px; }
@media (max-width: 860px) { .notes { grid-template-columns: 1fr; gap: 14px; } }

/* frames */
.desk { width: 100%; min-width: 760px; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: var(--frame); }
.desk .bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); direction: ltr; }
.desk .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.desk .bar .url { margin-inline: auto; font-size: .75rem; color: var(--muted); background: var(--surface); padding: 2px 14px; border-radius: 7px; font-family: "IBM Plex Mono", monospace; }
.desk .scr { height: 620px; overflow: auto; position: relative; }
.desk.short .scr { height: auto; min-height: 380px; }
.chrome { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 22px; }
.pill { margin-inline: auto; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--lift); }
.pill span { padding: 6px 14px; border-radius: 999px; font-size: .8125rem; color: var(--muted); white-space: nowrap; }
.pill span.on { background: var(--surface); color: var(--text); font-weight: 700; }
.island, .corner { display: grid; place-items: center; height: 36px; min-width: 36px; padding: 0 4px; border-radius: 999px; background: var(--glass); box-shadow: var(--lift); font-size: .75rem; color: var(--muted); }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .6875rem; font-weight: 700; color: var(--on-fill); background: var(--accent); }
.page { padding: 4px 36px 48px; }
.ph { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 14px; flex-wrap: wrap; }
.ph h3 { margin: 0; font-family: "Noto Serif", "Noto Sans Arabic", serif; font-size: 1.75rem; line-height: 1.15; }
.ph .sub { color: var(--muted); font-size: .875rem; }
.ph .end { margin-inline-start: auto; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 16px; font-size: .9375rem; }
.tabs span { padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs span.on { color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
.tabs .new { font-size: .6875rem; font-weight: 700; color: var(--on-sel); background: var(--sel); border-radius: 999px; padding: 1px 7px; margin-inline-start: 6px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 16px; border-radius: 999px; font-size: .875rem; font-weight: 700; background: var(--accent-solid); color: var(--on-fill); white-space: nowrap; }
.btn.sec { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: var(--err); color: var(--on-fill); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.lb { color: var(--accent-text); font-size: .8125rem; font-weight: 700; min-height: 44px; padding: 0 6px; display: inline-flex; align-items: center; white-space: nowrap; }
.lb.danger { color: var(--err); }
.lb[disabled] { color: var(--faint); cursor: not-allowed; }
.segc { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); box-shadow: 0 0 0 1px var(--line); }
.segc button { padding: 5px 14px; border-radius: 999px; font-size: .8125rem; color: var(--muted); min-height: 32px; }
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.sel { appearance: none; -webkit-appearance: none; min-height: 36px; padding: 6px 14px; padding-inline-end: 32px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2) no-repeat; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-size: 5px 5px; background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; font-size: .875rem; }
[dir="rtl"] .sel { background-position: 16px 50%, 11px 50%; }
.chk { width: 18px; height: 18px; accent-color: var(--accent-solid); margin: 0; flex: none; }
.badge { font-size: .6875rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.b-neutral { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.b-acc { background: var(--sel); color: var(--on-sel); }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-err { background: var(--err-bg); color: var(--err); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 14px; font-size: .875rem; margin: 0 0 14px; }
.banner.err { background: var(--err-bg); color: var(--err); }
.banner.info { background: var(--sel); color: var(--on-sel); }
.banner .lb { min-height: 0; padding: 0; color: inherit; text-decoration: underline; }

/* to-issue list */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .lbl { font-size: .8125rem; color: var(--muted); }
.toolbar .end { margin-inline-start: auto; display: flex; gap: 10px; align-items: center; }
.grp { background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 14px; overflow: hidden; }
.grp-h { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.grp-h h4 { margin: 0; font-size: 1rem; }
.grp-h .pref { font-size: .75rem; color: var(--muted); }
.grp-h .end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
.row { display: flex; align-items: center; gap: 12px; padding: 6px 16px; min-height: 56px; }
.row + .row { border-top: 1px solid var(--line); }
.row .what { flex: 1; min-width: 0; font-size: .9375rem; }
.row .what small { display: block; color: var(--muted); font-size: .8125rem; }
.row .amt { font-weight: 500; min-width: 92px; text-align: end; }
.row.inert .what small.why { color: var(--warn); }
.row.gone { display: none; }
.bulk { position: sticky; bottom: 14px; z-index: 4; margin: 10px auto 0; max-width: 640px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--lift), 0 0 0 1px var(--line); }
.bulk .t { flex: 1; font-size: .875rem; min-width: 180px; }
.bulk .t b { display: block; font-size: .9375rem; }
.empty { text-align: center; padding: 48px 16px; border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.empty .art { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; background: var(--sel); display: grid; place-items: center; position: relative; }
.empty .art::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.empty h4 { margin: 0 0 4px; font-size: 1.0625rem; } .empty p { margin: 0; color: var(--muted); font-size: .875rem; }

/* drawer */
.overlay { position: absolute; inset: 0; background: rgba(34,27,45,.32); z-index: 8; display: none; }
.drawer { position: absolute; top: 0; bottom: 0; inset-inline-end: 0; width: 400px; max-width: 100%; z-index: 9; background: var(--surface); box-shadow: var(--lift); display: none; flex-direction: column; }
.show .overlay, .show .drawer { display: flex; }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 700; }
.drawer .dh .x { margin-inline-start: auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.drawer .db { flex: 1; padding: 16px 18px; overflow: auto; font-size: .875rem; }
.drawer .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--bg); }
.field { margin-bottom: 12px; } .field label { display: block; font-size: .8125rem; color: var(--muted); margin-bottom: 4px; }
.field .v { min-height: 38px; padding: 8px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.linked { font-size: .8125rem; color: var(--on-sel); background: var(--sel); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }

/* toast */
.toast { position: absolute; inset-inline: 0; bottom: 18px; margin: 0 auto; width: max-content; max-width: 92%; z-index: 12; display: flex; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 14px; background: var(--text); color: var(--bg); font-size: .875rem; box-shadow: var(--lift); }
.toast button { color: var(--sel); font-weight: 700; }
:root[data-theme="dark"] .toast button { color: var(--accent-solid); }

/* home */
.lanes { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 22px; align-items: start; }
.addbox { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: 0 0 0 1px var(--line); font-size: .875rem; }
.addbox .dz { border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px 10px; text-align: center; color: var(--muted); margin-bottom: 10px; }
.addbox .dz b { display: block; color: var(--text); }
.hg { background: var(--surface); border-radius: 18px; padding: 12px 16px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 12px; }
.hg.new { box-shadow: 0 0 0 2px var(--accent); }
.hg-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.hg-h h4 { margin: 0; font-size: 1rem; }
.hg-h .c { font-size: .75rem; font-weight: 700; color: var(--on-sel); background: var(--sel); border-radius: 999px; padding: 1px 8px; }
.hg-h a { margin-inline-start: auto; font-size: .8125rem; color: var(--accent-text); text-decoration: none; font-weight: 700; }
.thumbs { display: flex; gap: 10px; } .thumbs i { width: 74px; height: 56px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); display: block; }
.plist { list-style: none; margin: 0; padding: 0; font-size: .875rem; }
.plist li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; }
.plist li + li { border-top: 1px solid var(--line); }
.plist .late { color: var(--err); }
.plist .k { color: var(--muted); }
.youtag { position: absolute; font-size: .6875rem; font-weight: 700; color: var(--on-fill); background: var(--accent-solid); border-radius: 999px; padding: 2px 8px; transform: translateY(-50%); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); font-size: .875rem; }
.tbl th { text-align: start; font-size: .75rem; color: var(--muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr:first-child td { border-top: 0; }
.tbl td.amt { text-align: end; }
.tbl .acts { display: flex; gap: 2px; justify-content: flex-end; flex-wrap: wrap; }
.tbl tr.flash td { background: var(--sel); }
.card { background: var(--surface); border-radius: 18px; padding: 16px 18px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 14px; }
.card h4 { margin: 0 0 10px; font-size: 1.0625rem; }
.kv { display: grid; grid-template-columns: 160px minmax(0,1fr); gap: 8px 16px; align-items: center; font-size: .875rem; }
.kv .k { color: var(--muted); }
.help { font-size: .8125rem; color: var(--muted); margin-top: 6px; }
.due-preview { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: .8125rem; }
.due-preview b { display: block; margin-bottom: 2px; font-size: .75rem; color: var(--muted); font-weight: 500; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.split .col { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line); }
.split .cur { font-size: .75rem; color: var(--muted); margin-bottom: 6px; }
.line3 { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: .9375rem; }
.line3 + .line3 { border-top: 1px solid var(--line); }
.line3.sum { font-weight: 700; border-top: 2px solid var(--line); }
.line3 .k small { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
.bar2 { height: 8px; border-radius: 4px; overflow: hidden; display: flex; background: var(--surface-2); margin: 4px 0 8px; }
.bar2 i { display: block; background: var(--accent); } .bar2 i + i { background: var(--line); }
.minitbl { font-family: "IBM Plex Mono", monospace; font-size: .75rem; }
.minitbl td, .minitbl th { padding: 6px 10px; }

/* phone */
.phone { width: 375px; height: 760px; border-radius: 46px; padding: 12px; background: #1d1d1f; box-shadow: var(--frame); }
.phone .ps { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; }
.phone .status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: .8125rem; font-weight: 700; direction: ltr; }
.phone .pb { flex: 1; overflow: auto; padding: 2px 16px 100px; }
.phone .ttl { font-family: "Noto Serif", "Noto Sans Arabic", serif; font-size: 1.6rem; margin: 4px 0 10px; line-height: 1.15; }
.phone .back { font-size: .9375rem; color: var(--accent-text); min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.phone .tabbar { position: absolute; inset-inline: 0; bottom: 0; height: 78px; padding: 8px 18px 22px; display: flex; justify-content: space-around; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); font-size: .6875rem; color: var(--muted); }
.phone .tabbar span { display: grid; justify-items: center; gap: 2px; }
.phone .tabbar span::before { content: ""; width: 22px; height: 22px; border-radius: 7px; background: var(--line); }
.phone .tabbar span.on { color: var(--accent-text); font-weight: 700; } .phone .tabbar span.on::before { background: var(--accent); }
.strip { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); margin-bottom: 10px; min-height: 56px; width: 100%; text-align: start; font-size: .9375rem; }
.strip .dot { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--sel); color: var(--on-sel); font-weight: 700; font-size: .8125rem; }
.strip .tx { flex: 1; } .strip .tx small { display: block; color: var(--muted); font-size: .75rem; }
.strip .chev { color: var(--faint); }
.strip.new { box-shadow: 0 0 0 2px var(--accent); }
.day { font-size: .75rem; color: var(--muted); font-weight: 700; margin: 14px 0 6px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .875rem; }
.prow .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; flex: none; font-size: .75rem; }
.prow .tx { flex: 1; min-width: 0; } .prow .tx small { display: block; color: var(--muted); font-size: .75rem; }
.pg { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 12px; overflow: hidden; }
.pg-h { padding: 10px 14px; font-weight: 700; font-size: .9375rem; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
.pg-h small { color: var(--muted); font-weight: 400; font-size: .75rem; }
.pr { padding: 10px 14px; } .pr + .pr { border-top: 1px solid var(--line); }
.pr .top { display: flex; justify-content: space-between; gap: 8px; font-size: .875rem; }
.pr .top small { display: block; color: var(--muted); font-size: .75rem; }
.pr .why { font-size: .75rem; color: var(--warn); margin-top: 4px; }
.pr .acts { display: flex; gap: 8px; margin-top: 8px; }
.pr .acts .btn { min-height: 40px; flex: 1; font-size: .8125rem; }

  else if (issuable(it)) acts = `<button class="btn sec" data-act="issue-one" data-id="${it.id}">${L_.issue}</button>`;
  else acts = `<button class="lb" data-act="noop">${L_.attach}</button><button class="lb" data-act="nfi-one" data-id="${it.id}">${L_.nfi}</button>`;
  return `<div class="row ${issuable(it) || S.seg === 'nfi' ? '' : 'inert'}"><input type="checkbox" class="chk" data-act="sel" data-id="${it.id}" ${checked ? 'checked' : ''} aria-label="${typeLabel(it.kind)} ${it.no}">

    <tbody>${rows.map(([id, d, c, a, st]) => `<tr><td>${fmtDate(d)}</td><td dir="auto">${clientName(c)}</td><td>${docCell(id, st)}</td><td class="amt">${money(a)}</td><td><div class="acts"><button class="lb">${L_.edit}</button>${act(id, st)}</div></td></tr>`).join('')}</tbody></table></div>`;
  const d = desk('app.mtb3a.com/p/barmajiyat/payments', page, '', 'short');
  const sheet = `<div class="overlay" data-act="sheet-close"></div><div class="sheet"><h5 dir="auto">${L_.sheetTitle} · ${money(700)}</h5>
    ${S.sheetMsg ? `<div class="msg">${L_.refused}</div>` : ''}
    <button class="opt acc">${L_.sIssue}</button><button class="opt">${L_.sEdit}</button><button class="opt">${L_.sRedate}</button><button class="opt">${L_.sAttach}</button>
    <button class="opt" data-act="sheet-nfi">${S.sheetNfi ? L_.sBack : L_.sNfi}</button>
    <button class="opt" data-act="sheet-try" style="color:var(--muted);font-size:.8125rem">${ui.lang === 'ar' ? '(جرّب على قيد له فاتورة ضريبية)' : '(try on an entry with a tax invoice)'}</button></div>`;
  const p = phone(`<div class="pb"><h3 class="ttl">${L_.recent}</h3><div class="day">${L_.today2}</div>
    <button class="prow" style="width:100%;text-align:start" data-act="sheet-open"><span class="ic">＋</span><span class="tx" dir="auto">${CLIENTS.nour[ui.lang]}<small>${S.sheetNfi ? L_.nfiChip : typeLabel('TAX_INVOICE_RECEIPT') + ' · ' + L_.toIssueChip}</small></span>${money(700)}</button>
    <div class="prow"><span class="ic">＋</span><span class="tx" dir="auto">${CLIENTS.rami[ui.lang]}<small>${L_.hasTI('0007')}</small></span>${money(3400)}</div></div>${tabbar('recent')}${S.sheetOpen ? sheet : ''}`, S.sheetOpen ? 'psh' : '');
  return `<div class="desk-wrap">${d}<div class="cap" style="max-width:none">${ui.lang === 'ar' ? 'جرّب «خارج الفوترة» على صف رامي حداد (له فاتورة ضريبية).' : 'Try “Not for invoice” on Rami Haddad’s row (it has a tax invoice).'}</div></div><div class="phone-wrap">${p}<div class="cap">${ui.lang === 'ar' ? 'اضغط قيد نور للتصميم لفتح ورقة الإجراءات' : 'Tap Nour Design’s entry to open its action sheet'}</div></div>`;
}

/* ---------- 4. client preference ---------- */
function client() {

    <span class="k">${L_.docsPref}</span><span><select class="sel" data-act="pref" aria-label="${L_.docsPref}">${opts.map(o => `<option value="${o}" ${S.pref === o ? 'selected' : ''}>${L_.prefOf[o]}</option>`).join('')}</select> ${S.prefSaved ? `<span class="badge b-ok" role="status">${L_.saved}</span>` : ''}
      <div class="help">${L_.docsHelp}</div><div class="due-preview"><b>${L_.dueFor}</b>${L_.dueText[eff]}</div></span></div></div></div>`;

    <div class="pg"><div class="pg-h" dir="auto">${CLIENTS.rami[ui.lang]}<small>${L_.prefOf[eff]}</small></div><div class="pr"><div class="top"><span>${typeLabel(eff === 'TAX_INVOICE_FIRST' ? 'TAX_INVOICE' : eff === 'PAYMENT_REQUEST_FIRST' ? 'PAYMENT_REQUEST' : 'TAX_INVOICE_RECEIPT')}<small>${L_.forOwed('O-0412')}</small></span>${money(3400)}</div></div></div>
    <div class="ph-note"><b>${L_.phClientNote}</b>${L_.phClientNoteS}<br><br>${L_.phClientGroup}</div></div>${tabbar('recent')}`);
  return `<div class="desk-wrap">${d}</div><div class="phone-wrap">${p}</div>`;
}

function defaults() {

  const page = `${chrome('')}<div class="page"><div class="ph"><h3>${L_.setupT}</h3></div>
    <div class="card"><h4>${L_.step3}</h4><div class="kv"><span class="k">${L_.offer}</span><span><span class="badge b-ok">${L_.on}</span></span>
    <span class="k">${L_.defPref}</span><span><select class="sel" data-act="defpref" aria-label="${L_.defPref}">${opts.map(o => `<option value="${o}" ${S.defPref === o ? 'selected' : ''}>${L_.prefOf[o]}</option>`).join('')}</select><div class="help">${L_.defHelp}</div></span></div></div></div>`;

  return `<div class="desk-wrap">${d}</div><div class="phone-wrap">${p}</div>`;
}

/* ---------- 6. books ---------- */
function books() {

      <div class="line3"><span class="k">${L_.invIncome}<small>${L_.invIncomeS}</small></span>${money(v.inv, cur)}</div>
      <div class="line3"><span class="k">${L_.nfiIncome}<small>${L_.nfiIncomeS}</small></span>${money(v.nfi, cur)}</div>
      <div class="line3 sum"><span class="k">${L_.allIncome}</span>${money(all, cur)}</div></div>`; };
  const page = `${chrome('')}<div class="page"><div class="ph"><h3>${L_.reportsT}</h3><span class="sub">${L_.nov}</span></div>
    <div class="card"><h4>${L_.income}</h4><div class="split">${col('₪', ils)}${col('$', usd)}</div><div class="help">${L_.reconcile}</div></div>
    <div class="card"><h4>${L_.exportT}</h4><table class="tbl minitbl" dir="ltr"><thead><tr><th>date</th><th>client</th><th>amount</th><th>currency</th><th>${L_.colStatus}</th></tr></thead>
      <tbody><tr><td>2026-11-19</td><td>Nour Design</td><td>700.00</td><td>ILS</td><td>to_issue</td></tr><tr><td>2026-11-12</td><td></td><td>260.00</td><td>ILS</td><td>not_for_invoice</td></tr><tr><td>2026-11-04</td><td>Rami Haddad</td><td>3400.00</td><td>ILS</td><td>issued</td></tr><tr><td>2026-11-02</td><td>Zaid Coffee</td><td>900.00</td><td>ILS</td><td>no_document</td></tr></tbody></table></div></div>`;
  const d = desk('app.mtb3a.com/p/barmajiyat/reports', page, '', 'short');
  const p = phone(`<div class="pb"><div class="mail"><div class="from">${L_.mailFrom}</div><h6>${L_.mailT}</h6>
    <div class="line3"><span class="k">${L_.mailRecv}</span>${money(17460)}</div>
    <div class="line3" style="padding-inline-start:14px;font-size:.875rem"><span class="k">${L_.invIncome}</span>${money(14200)}</div>
    <div class="line3" style="padding-inline-start:14px;font-size:.875rem"><span class="k">${L_.nfiIncome}</span>${money(3260)}</div>
    <div class="line3"><span class="k">${L_.mailSpent}</span>${money(4120)}</div></div></div>`);
  return `<div class="desk-wrap">${d}</div><div class="phone-wrap">${p}<div class="cap">${L_.phMail}</div></div>`;
}

/* ---------- page ---------- */
function render() {
  const L_ = L();
  document.documentElement.lang = ui.lang; document.documentElement.dir = ui.lang === 'ar' ? 'rtl' : 'ltr';
  const secs = [['s1', home, L_.s1, 's1'], ['s2', list, L_.s2, 's2'], ['s3', entry, L_.s3, 's3'], ['s4', client, L_.s4, 's4'], ['s5', defaults, L_.s5, 's5'], ['s6', books, L_.s6, 's6']];
  const y = window.scrollY;
  document.getElementById('app').innerHTML = `<p class="eyebrow">${L_.eyebrow}</p><h1 class="doc">${L_.title}</h1><p class="lede">${L_.lede}</p>
    <div class="toggles"><div class="seg" role="group" aria-label="${L_.lang}"><button data-ui="lang" data-v="ar" aria-pressed="${ui.lang === 'ar'}">العربية</button><button data-ui="lang" data-v="en" aria-pressed="${ui.lang === 'en'}">English</button></div>
    <div class="seg" role="group" aria-label="${L_.theme}">${['auto', 'light', 'dark'].map(v => `<button data-ui="theme" data-v="${v}" aria-pressed="${ui.theme === v}">${L_[v]}</button>`).join('')}</div>
    <div class="seg"><button data-act="reset">${L_.reset}</button></div></div>
    <nav class="toc">${secs.map(([id, , title], i) => `<a href="#${id}">${i + 1}. ${title}</a>`).join('')}</nav>
    ${secs.map(([id, fn, title, key], i) => section(id, `${i + 1} / 6`, title, '', fn(), key)).join('')}
    <div class="final"><h2>${L_.final}</h2><ul>${L_.finalItems.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
  window.scrollTo(0, y);
}

/* ---------- interaction ---------- */
let toastTimer, phTimer;
function flash(msg, undo) { S.toast = msg; S.undo = undo || null; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; S.undo = null; render(); }, 6000); }
function setStatus(ids, v) { const prev = ids.map(id => [id, S.status[id]]); ids.forEach(id => { if (v) S.status[id] = v; else delete S.status[id]; }); return () => prev.forEach(([id, p]) => { if (p) S.status[id] = p; else delete S.status[id]; }); }

document.addEventListener('click', e => {
  const u = e.target.closest('[data-ui]');
  if (u) { ui[u.dataset.ui] = u.dataset.v; if (u.dataset.ui === 'theme') { if (u.dataset.v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = u.dataset.v; } render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, L_ = L();
  if (a.tagName === 'SELECT' || a.type === 'checkbox') return;
  switch (act) {
    case 'reset': S = seed(); break;
    case 'goto-list': e.preventDefault(); document.getElementById('s2').scrollIntoView({ behavior: 'smooth' }); return;
    case 'seg': S.seg = a.dataset.v; S.sel.clear(); S.confirm = null; break;
    case 'sel-all': shown().forEach(i => S.sel.add(i.id)); S.confirm = null; break;
    case 'clear': S.sel.clear(); S.confirm = null; break;
    case 'bulk': S.confirm = true; break;
    case 'confirm-cancel': S.confirm = null; break;
    case 'confirm-go': { const ids = shown().filter(i => S.sel.has(i.id)).map(i => i.id); const back = S.seg === 'nfi'; const u2 = setStatus(ids, back ? null : 'nfi'); S.sel.clear(); S.confirm = null; flash(back ? L_.toastBack(ids.length) : L_.toastNfi(ids.length), u2); break; }
    case 'undo': if (S.undo) S.undo(); S.toast = null; S.undo = null; break;
    case 'issue-all': { const c = a.dataset.c === 'null' ? null : a.dataset.c; const ids = due().filter(i => i.client === c && issuable(i)).map(i => i.id); setStatus(ids, 'issued'); ids.forEach(x => S.sel.delete(x)); flash(L_.toastIssued(ids.length, clientName(c))); break; }
    case 'issue-one': S.drawer = id; break;
    case 'drawer-close': S.drawer = null; break;
    case 'drawer-issue': { const it = S.items.find(i => i.id === S.drawer); setStatus([it.id], 'issued'); S.sel.delete(it.id); S.drawer = null; flash(L_.toastOne(typeLabel(it.kind))); break; }
    case 'nfi-one': { const u2 = setStatus([id], 'nfi'); S.sel.delete(id); flash(L_.toastNfi(1), u2); break; }
    case 'back-one': { const u2 = setStatus([id], null); flash(L_.toastBack(1), u2); break; }
    case 'ph-open': S.phoneScreen = 'list'; if (a.closest('#s1')) { render(); document.getElementById('s2').scrollIntoView({ behavior: 'smooth' }); return; } break;
    case 'ph-back': S.phoneScreen = 'recent'; break;
    case 'ph-issue': { const it = S.items.find(i => i.id === id); const u2 = setStatus([id], 'issued'); S.phoneToast = L_.toastOne(typeLabel(it.kind)); S._phUndo = u2; clearTimeout(phTimer); phTimer = setTimeout(() => { S.phoneToast = null; render(); }, 5000); break; }
    case 'ph-nfi': { const u2 = setStatus([id], 'nfi'); S.phoneToast = L_.toastNfi(1); S._phUndo = u2; clearTimeout(phTimer); phTimer = setTimeout(() => { S.phoneToast = null; render(); }, 5000); break; }
    case 'ph-undo': if (S._phUndo) S._phUndo(); S.phoneToast = null; break;
    case 'e-nfi': if (S.entryState[id] === 'doc') S.entryBanner = true; else { S.entryState[id] = 'nfi'; S.entryBanner = false; } break;
    case 'e-back': S.entryState[id] = 'none'; S.entryBanner = false; break;
    case 'sheet-open': S.sheetOpen = true; S.sheetMsg = false; break;
    case 'sheet-close': S.sheetOpen = false; break;
    case 'sheet-nfi': S.sheetNfi = !S.sheetNfi; S.sheetOpen = false; break;
    case 'sheet-try': S.sheetMsg = true; break;
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'sel') { a.checked ? S.sel.add(a.dataset.id) : S.sel.delete(a.dataset.id); S.confirm = null; }
  else if (act === 'sel-group') { const c = a.dataset.c === 'null' ? null : a.dataset.c; shown().filter(i => i.client === c).forEach(i => a.checked ? S.sel.add(i.id) : S.sel.delete(i.id)); S.confirm = null; }
  else if (act === 'older') { S.older = Number(a.value); S.sel.clear(); S.confirm = null; }
  else if (act === 'pref') { S.pref = a.value; S.prefSaved = true; CLIENTS.rami.pref = a.value === 'DEFAULT' ? null : a.value; setTimeout(() => { S.prefSaved = false; render(); }, 2500); }
  else if (act === 'defpref') { S.defPref = a.value; }
  else return;
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.drawer || S.confirm || S.sheetOpen)) { S.drawer = null; S.confirm = null; S.sheetOpen = false; render(); } });
render();
</script>
