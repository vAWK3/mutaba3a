/* Layout: a flow rail, then each step shown twice side by side, portal (desktop drawer or page) beside the phone. MTB3A's own roles; Plex stands in for Thmanyah. */
:root {

  --ink: #392F4B; --ink2: #564E68; --primary: #795DBA; --primary-solid: #5E439E; --on-primary: #FFFCF7;
  --lav: #E0D7FF; --lav-ink: #4D387E; --rose: #FFCED5; --rose-ink: #742B35; --butter: #F6E8B3; --butter-ink: #67450A;
  --mint: #BAEBD4; --mint-ink: #00513E; --overlay: rgba(57,47,75,.28); --frame: #D9D3E3;
  --font: "IBM Plex Sans Arabic", "Thmanyah Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #221B2D; --surface: #2E273C; --field: #3B334C; --line: #4B435A; --ink: #F4EEE4; --ink2: #BAB3C8;
  --primary: #BCA9F7; --primary-solid: #C8B7FF; --on-primary: #221B2D; --lav: #453A64; --lav-ink: #DBCEFF;
  --rose: #62313A; --rose-ink: #FFC2CB; --butter: #57451E; --butter-ink: #F0DE99; --mint: #134E39; --mint-ink: #A5E9CA;
  --overlay: rgba(10,6,16,.5); --frame: #4B435A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #221B2D; --surface: #2E273C; --field: #3B334C; --line: #4B435A; --ink: #F4EEE4; --ink2: #BAB3C8;
  --primary: #BCA9F7; --primary-solid: #C8B7FF; --on-primary: #221B2D; --lav: #453A64; --lav-ink: #DBCEFF;
  --rose: #62313A; --rose-ink: #FFC2CB; --butter: #57451E; --butter-ink: #F0DE99; --mint: #134E39; --mint-ink: #A5E9CA;
  --overlay: rgba(10,6,16,.5); --frame: #4B435A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0 }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1360px; margin: 0 auto; display: grid; gap: 20px }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between }
header.top h1 { font-size: 26px; margin: 0; font-weight: 700; text-wrap: balance }
header.top p { margin: 4px 0 0; color: var(--ink2); max-width: 70ch; font-size: 14px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px }
.seg button { border: 0; background: none; color: var(--ink2); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px }
.seg button[aria-pressed="true"] { background: var(--lav); color: var(--lav-ink); font-weight: 500 }
.controls { display: flex; flex-wrap: wrap; gap: 8px }
.flows { display: flex; flex-wrap: wrap; gap: 6px }
.flows button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 14px; cursor: pointer; min-height: 40px }
.flows button[aria-current="true"] { border-color: var(--primary); background: var(--lav); color: var(--lav-ink); font-weight: 500 }
.flows button:focus-visible, .seg button:focus-visible, .stage button:focus-visible, .stage input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px }
.stepbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px }
.stepbar .what { min-width: 0 }
.stepbar strong { font-size: 17px }
.stepbar .note { color: var(--ink2); font-size: 13px; margin: 2px 0 0; max-width: 80ch }
.pager { display: flex; gap: 6px; align-items: center }
.pager button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 36px }
.pager button:disabled { opacity: .4; cursor: default }
.pager span { font-family: var(--mono); font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start }
@media (max-width: 1100px) { .stage { grid-template-columns: minmax(0, 1fr) } .phone-col { justify-self: center } }
.label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px }
.desk-scroll { overflow-x: auto; border-radius: 16px }
/* desktop frame */
.desk { width: 920px; height: 600px; border: 1px solid var(--frame); border-radius: 16px; background: var(--bg); position: relative; overflow: hidden }
.desk .chrome { height: 34px; display: flex; align-items: center; gap: 6px; padding-inline: 12px; border-bottom: 1px solid var(--line); background: var(--surface) }
.desk .chrome i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block }
.desk .chrome .url { margin-inline-start: 12px; font-family: var(--mono); font-size: 11px; color: var(--ink2); direction: ltr }
.desk .page { padding: 28px 40px; height: calc(100% - 34px); position: relative }
.pill { display: flex; gap: 4px; justify-content: center; margin-bottom: 22px }
.pill span { font-size: 13px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink2) }
.pill span.on { background: var(--lav); color: var(--lav-ink); border-color: transparent }
.ptitle { font-size: 26px; font-weight: 700; margin: 0 0 14px }
.overlay { position: absolute; inset: 34px 0 0 0; background: var(--overlay) }
.drawer { position: absolute; top: 34px; bottom: 0; inset-inline-end: 0; width: 440px; background: var(--surface); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column }
.drawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700 }
.drawer .db { padding: 18px 20px; overflow: auto; flex: 1; display: grid; gap: 14px; align-content: start }
.drawer .df { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--bg); display: flex; gap: 8px; justify-content: flex-end }
.x { border: 0; background: none; color: var(--ink2); font-size: 18px; cursor: pointer; min-width: 32px; min-height: 32px }
.card { max-width: 400px; margin: 30px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; gap: 14px }
.brand { font-weight: 700; color: var(--primary); font-size: 15px }
/* phone frame */
.phone { width: 340px; height: 690px; border: 10px solid var(--ink); border-radius: 44px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column }
.phone .sb { height: 34px; display: flex; justify-content: space-between; align-items: center; padding-inline: 22px; font-size: 12px; font-family: var(--mono); color: var(--ink); direction: ltr; flex: none }
.phone .nav { display: flex; align-items: center; gap: 8px; padding: 6px 14px 10px; flex: none }
.phone .nav .back { border: 0; background: none; color: var(--primary); font: inherit; font-size: 15px; cursor: pointer; min-height: 36px; padding: 0 }
.phone .nav h2 { font-size: 17px; margin: 0; flex: 1; text-align: center; font-weight: 700 }
.phone .nav .sp { width: 52px }
.phone .body { padding: 6px 18px 12px; overflow: auto; flex: 1; display: grid; gap: 14px; align-content: start }
.phone .foot { padding: 10px 18px 22px; display: grid; gap: 8px; flex: none }
.phone .big { font-size: 26px; font-weight: 700; margin: 4px 0 0; line-height: 1.25 }
/* shared controls */
.muted { color: var(--ink2); font-size: 14px; margin: 0 }
.small { font-size: 13px }
.field { display: grid; gap: 6px }
.field label { font-size: 13px; color: var(--ink2) }
.field input { font: inherit; font-size: 16px; background: var(--field); color: var(--ink); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; min-height: 46px; width: 100% }
.field input.code { font-family: var(--mono); font-size: 22px; letter-spacing: .35em; text-align: center; direction: ltr }
.field input.rc { font-family: var(--mono); font-size: 18px; letter-spacing: .12em; text-align: center; direction: ltr }
.field .hint { font-size: 12px; color: var(--ink2) }
.btn { font: inherit; font-size: 15px; font-weight: 500; border-radius: 12px; padding: 10px 18px; min-height: 44px; cursor: pointer; border: 1px solid transparent }
.btn.primary { background: var(--primary-solid); color: var(--on-primary) }
.btn.primary:disabled { opacity: .45; cursor: default }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line) }
.btn.danger { background: var(--rose-ink); color: var(--surface) }
.btn.block { width: 100% }
.link { border: 0; background: none; color: var(--primary-solid); font: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; min-height: 36px; text-align: start }
.link[disabled] { color: var(--ink2); cursor: default }
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 11px 13px; font-size: 14px }
.banner b { display: block }
.banner.error { background: var(--rose); color: var(--rose-ink) }
.banner.info { background: var(--lav); color: var(--lav-ink) }
.banner.warn { background: var(--butter); color: var(--butter-ink) }
.banner.ok { background: var(--mint); color: var(--mint-ink) }
.banner .ic { font-family: var(--mono); font-weight: 500; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 11px; margin-top: 1px }
.rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface) }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; border-top: 1px solid var(--line); width: 100%; background: none; border-inline: 0; border-bottom: 0; font: inherit; color: inherit; text-align: start; cursor: pointer }
.row:first-child { border-top: 0 }
.row .t { flex: 1; min-width: 0 }
.row .t b { font-weight: 500; display: block }
.row .t span { font-size: 13px; color: var(--ink2) }
.row .chev { color: var(--ink2) }
[dir="rtl"] .row .chev { transform: scaleX(-1) }
.row.sel { background: var(--lav); color: var(--lav-ink) }
.row.sel .t span { color: var(--lav-ink) }
.row.danger { color: var(--rose-ink) }
.row.inert { cursor: default; opacity: .6 }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink2); flex: none }
.row.sel .radio { border: 5px solid var(--primary-solid) }
.chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--mint); color: var(--mint-ink); white-space: nowrap }
.chip.off { background: var(--field); color: var(--ink2) }
.qrbox { display: flex; gap: 16px; align-items: center; flex-wrap: wrap }
.qr { width: 132px; height: 132px; background: #fff; border-radius: 10px; padding: 8px; flex: none }
.qr canvas { width: 116px; height: 116px; image-rendering: pixelated; display: block }
.secret { font-family: var(--mono); font-size: 15px; letter-spacing: .08em; direction: ltr; background: var(--field); border-radius: 10px; padding: 8px 10px; word-break: break-all }
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-family: var(--mono); font-size: 15px; direction: ltr; background: var(--field); border-radius: 12px; padding: 14px; font-variant-numeric: tabular-nums }
.codes span.used { text-decoration: line-through; color: var(--ink2) }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; min-height: 40px }
.check input { width: 18px; height: 18px; accent-color: var(--primary-solid) }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap }
.confirm { border: 1px solid var(--rose-ink); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--surface) }
.docrow { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 14px }
.docrow:first-child { border-top: 0 }
.amount { font-family: var(--mono); font-variant-numeric: tabular-nums }
.toast { position: absolute; inset-inline: 0; bottom: 18px; margin: auto; width: max-content; max-width: 90%; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: 14px }
.decisions { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 8px; max-width: 90ch }
.decisions h2 { font-size: 17px; margin: 0 }
.decisions ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; color: var(--ink2); font-size: 14px }
.decisions b { color: var(--ink) }
@media (prefers-reduced-motion: no-preference) { .drawer, .phone .body { animation: in .22s ease-out } @keyframes in { from { opacity: .4 } to { opacity: 1 } } }
</style>

</div>

function drawQr() {
  document.querySelectorAll('canvas[data-qr]').forEach((cv) => {
    const n = 29; cv.width = n; cv.height = n; const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, n, n); g.fillStyle = '#1b1524';
    let s = 7; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rnd() > 0.52) g.fillRect(x, y, 1, 1);
    [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([x, y]) => { g.fillStyle = '#fff'; g.fillRect(x - 1 < 0 ? 0 : x - 1, y - 1 < 0 ? 0 : y - 1, 9, 9); g.fillStyle = '#1b1524'; g.fillRect(x, y, 7, 7); g.fillStyle = '#fff'; g.fillRect(x + 1, y + 1, 5, 5); g.fillStyle = '#1b1524'; g.fillRect(x + 2, y + 2, 3, 3); });
  });
}
function render() {
  const L = state.lang; document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  try { localStorage.setItem('mut710-wf', JSON.stringify({ lang: L, method: state.method, flow: state.flow })); } catch (e) {}
  $('h1').textContent = t('h1'); $('lede').textContent = t('lede');
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === L));
  document.querySelectorAll('#methodSeg [data-method]').forEach((b) => { b.textContent = t(b.dataset.method); b.setAttribute('aria-pressed', b.dataset.method === state.method); });
  $('flows').innerHTML = t('flows').map((f, i) => `<button type="button" data-flow="${i}" aria-current="${i === state.flow}">${f}</button>`).join('');
  const key = FLOW_KEYS[state.flow]; const list = screens[key]; const meta = t('steps')[key][state.step];
  $('stepTitle').textContent = meta[0]; $('stepNote').textContent = meta[1];
  $('prev').textContent = t('prev'); $('next').textContent = t('next');
  $('prev').disabled = state.step === 0; $('next').disabled = state.step === list.length - 1;
  $('count').textContent = `${state.step + 1} / ${list.length}`;
  $('lblPortal').textContent = t('portal'); $('lblPhone').textContent = t('phone');
  $('desk').innerHTML = list[state.step].desk(); $('phone').innerHTML = list[state.step].phone();
  $('decisions').innerHTML = `<h2>${t('dTitle')}</h2><ol>${t('d').map((x) => `<li>${x}</li>`).join('')}</ol>`;
  drawQr();
}
function go(step) { const n = screens[FLOW_KEYS[state.flow]].length; state.step = Math.max(0, Math.min(n - 1, step)); render(); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-lang],[data-method],[data-flow],[data-act],#prev,#next'); if (!el) return;
  if (el.dataset.lang) { state.lang = el.dataset.lang; render(); return; }
  if (el.dataset.method) { state.method = el.dataset.method; render(); return; }
  if (el.dataset.flow) { state.flow = +el.dataset.flow; state.step = 0; state.saved = false; state.showQr = false; state.confirmOff = false; render(); return; }
  if (el.id === 'prev') return go(state.step - 1);
  if (el.id === 'next') return go(state.step + 1);
  const a = el.dataset.act;
  if (a === 'next') go(state.step + 1); else if (a === 'prev') go(state.step - 1);
  else if (a === 'qr') { state.showQr = !state.showQr; render(); }
  else if (a === 'confirmOff') { state.confirmOff = true; render(); }
  else if (a === 'cancelOff') { state.confirmOff = false; render(); }
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.act === 'saved') { state.saved = e.target.checked; render(); } });
render();
</script>
