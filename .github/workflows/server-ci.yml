# CI for the hosted API in server/ (closes TD-019).
#
# Nothing here deploys and nothing is pushed: the Docker build is a build-only proof that the image
# still assembles and answers /health. Deploys are operator-run from
# server/scripts/deploy.sh on the operator's machine (ADR-026, server/DEPLOYMENT.md).
name: Server CI

# Manual only (2026-10-20): start it with `make ci server` or from the Actions tab. `make release`
# reminds you to run it after each push.
on:
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  verify:
    name: Type-check, lint, tests, OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mutaba3a
          POSTGRES_PASSWORD: mutaba3a
          POSTGRES_DB: mutaba3a_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U mutaba3a -d mutaba3a_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MUTABA3A_TEST_DATABASE_URL: postgresql://mutaba3a:mutaba3a@localhost:54329/mutaba3a_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run openapi:check
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MUTABA3A_TEST_DATABASE_URL }}
      - name: Unit, route and Postgres contract tests
        run: npm run test:db

  docker:
    name: Docker image builds and the service answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the hosted-portal bundle (MUT-45; the image serves it from PORTAL_DIST_DIR)
        working-directory: .
        # The portal bundles the server's routes for local mode (MUT-286), so it resolves
        # @hono/zod-openapi and friends from server/node_modules.
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund
          npm run build:hosted
      - name: Copy the portal build into the server's Docker context
        working-directory: .
        run: cp -r dist-hosted server/dist-hosted
      - name: Build the service image
        run: docker build -t mutaba3a-api:ci .
      - name: Boot the service image and probe /health
        run: |
          docker run -d --name api -p 8787:8787 \
            -e DATABASE_URL=postgresql://nobody:nobody@127.0.0.1:1/none \
            -e MUTABA3A_ADMIN_TOKEN=ci-only-token-ci-only-token-ci-only-token \
            -e API_KEY_ENVIRONMENT=test \
            -e SERVICE_VERSION=${{ github.sha }} \
            mutaba3a-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health; then echo; exit 0; fi
            sleep 1
          done
          echo "service never answered /health"; docker logs api; exit 1

  terraform:
    name: Terraform format and validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # terraform = GCP (ADR-026); sentry = error reporting (ADR-091, MUT-147).
        module: [terraform, sentry]
    defaults:
      run:
        working-directory: server/infrastructure/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      # Offline: the providers are mocked (Sentry; Google and random since MUT-270), so no token or account is needed.
      - run: terraform test
